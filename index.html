function changeQty(productId, delta){
  const item = cart.find(c => c.productId === productId);
  if(!item) return;
  const p = findProduct(productId);
  const st = stockInfo(p);
  if(delta > 0 && st.control && item.qty >= st.stock){
    vibrate(40);
    toast('Solo te quedan ' + st.stock, { icon:icon('alert'), variant:'toast-danger toast-top', subtitle: p.name, duration:1800 });
    return;
  }
  item.qty += delta;
  if(item.qty <= 0){ cart = cart.filter(c => c.productId !== productId); }
  vibrate(10);
  openCartSheet('cart');
  renderBackgroundIfSale();
}
function removeFromCart(productId){
  cart = cart.filter(c => c.productId !== productId);
  vibrate(10);
  openCartSheet('cart');
  renderBackgroundIfSale();
}
function renderBackgroundIfSale(){ if(currentView === 'sale') render(); }

function setServiceType(id){ checkout.serviceType = id; openCartSheet('checkout'); }
function setPaymentMethod(id){ checkout.paymentMethod = id; openCartSheet('checkout'); }

function onCashInput(val){
  checkout.cash = val;
  const totals = computeTotals();
  const cashNum = parseFloat(val) || 0;
  const change = cashNum - totals.total;
  const hint = document.getElementById('cashHint');
  if(hint){
    hint.className = 'field-hint ' + (cashNum >= totals.total ? 'ok' : 'warn');
    hint.textContent = cashNum > 0 ? (cashNum >= totals.total ? 'Cambio: ' + formatMoney(change) : 'Falta ' + formatMoney(totals.total - cashNum)) : 'Ingresa el monto entregado por el cliente';
  }
}

function confirmarCobro(){
  if(cart.length === 0){ toast('El carrito está vacío'); return; }

  // Última revisión de existencias antes de cobrar.
  const inventario = DB.getProducts();
  const sinExistencias = [];
  cart.forEach(c => {
    const prod = inventario.find(x => x.id === c.productId);
    const st = stockInfo(prod);
    if(st.control && c.qty > st.stock){
      sinExistencias.push(prod.name + ': pides ' + c.qty + ' y ' + (st.stock <= 0 ? 'ya no hay' : 'solo hay ' + st.stock));
    }
  });
  if(sinExistencias.length){
    vibrate(40);
    toast('No hay existencias suficientes', { icon:icon('alert'), variant:'toast-danger', subtitle: sinExistencias[0], duration:2600 });
    return;
  }

  const totals = computeTotals();
  if(checkout.paymentMethod === 'efectivo'){
    const cashNum = parseFloat(checkout.cash) || 0;
    if(cashNum < totals.total){ toast('El efectivo recibido es insuficiente'); return; }
  }

  const number = DB.nextSaleNumber();
  const sale = {
    id: 'v' + Date.now(),
    number: number,
    date: new Date().toISOString(),
    items: cart.map(c => {
      const p = findProduct(c.productId);
      return { productId: p.id, name: p.name, price: p.price, cost: p.cost != null ? p.cost : null, qty: c.qty };
    }),
    subtotal: totals.subtotal,
    iva: totals.iva,
    total: totals.total,
    serviceType: checkout.serviceType,
    table: checkout.serviceType === 'comer' ? checkout.table : '',
    paymentMethod: checkout.paymentMethod,
    cash: checkout.paymentMethod === 'efectivo' ? (parseFloat(checkout.cash) || 0) : null,
    change: checkout.paymentMethod === 'efectivo' ? round2((parseFloat(checkout.cash) || 0) - totals.total) : null,
    cancelled: false
  };

  const sales = DB.getSales();
  sales.push(sale);
  DB.saveSales(sales);

  // Se descuentan las piezas vendidas del inventario.
  stockAlert = [];
  let inventarioCambio = false;
  cart.forEach(c => {
    const prod = inventario.find(x => x.id === c.productId);
    const st = stockInfo(prod);
    if(!st.control) return;
    prod.stock = Math.max(0, st.stock - c.qty);
    inventarioCambio = true;
    if(prod.stock <= st.min){
      stockAlert.push({ name: prod.name, stock: prod.stock });
    }
  });
  if(inventarioCambio) DB.saveProducts(inventario);

  cart = [];
  checkout = { serviceType:'comer', table:'', paymentMethod:'efectivo', cash:'' };
  saleCategoryFilter = 'todos';

  vibrate([15, 60, 15]);
  showTicket(sale, { fromCheckout:true });
}

/* =========================================================
   IMPRESION DE TICKETS (impresora termica)
   ---------------------------------------------------------
   Esta configuracion se guarda en ESTE dispositivo, porque la
   impresora cambia en cada caja, celular o computadora.
========================================================= */
const PRINT_KEY = 'mesa_print';

/* paper = ancho del rollo | width = ancho util de impresion */
const PRINT_PRESETS = {
  '58':     { label:'Termica 58 mm', note:'Rollo chico',        paper:58, width:48, size:11 },
  '80':     { label:'Termica 80 mm', note:'Rollo estandar',     paper:80, width:72, size:12 },
  'hoja':   { label:'Hoja normal',   note:'Carta / A4',         paper:0,  width:72, size:13 },
  'custom': { label:'Otro tamano',   note:'Tu eliges el ancho', paper:0,  width:60, size:12 }
};
const PRINT_SPACING = { compacto:1.15, normal:1.35, amplio:1.6 };

const DEFAULT_PRINT = {
  preset:   '80',
  widthMm:  72,
  fontSize: 12,
  spacing:  'normal',
  copies:   1,
  feedMm:   10,
  logo:     false,
  footer:   '\u00a1Gracias por su visita!'
};

function printPrefs(){
  let guardado = {};
  try{ guardado = JSON.parse(localStorage.getItem(PRINT_KEY) || '{}') || {}; }catch(e){ guardado = {}; }
  return Object.assign({}, DEFAULT_PRINT, guardado);
}
function savePrintPrefs(p){
  try{ localStorage.setItem(PRINT_KEY, JSON.stringify(p)); }catch(e){}
  applyPrintVars();
}
/** rerender = true vuelve a pintar toda la hoja de configuracion. */
function setPrintPref(key, value, rerender){
  const p = printPrefs();
  p[key] = value;
  savePrintPrefs(p);
  if(rerender) renderPrintSettings(); else updatePrintPreview();
}
function setPrintPreset(id){
  const preset = PRINT_PRESETS[id] || PRINT_PRESETS['80'];
  const p = printPrefs();
  p.preset = id;
  if(id !== 'custom'){
    p.widthMm  = preset.width;
    p.fontSize = preset.size;
  }
  savePrintPrefs(p);
  vibrate(10);
  renderPrintSettings();
}
function resetPrintPrefs(){
  try{ localStorage.removeItem(PRINT_KEY); }catch(e){}
  applyPrintVars();
  renderPrintSettings();
  toast('Listo, valores de f\u00e1brica');
}
function printPaperMm(p){
  p = p || printPrefs();
  if(p.preset === '58') return 58;
  if(p.preset === '80') return 80;
  return Math.max(30, Number(p.widthMm) + 6);
}
function printSubtitle(){
  const p = printPrefs();
  const preset = PRINT_PRESETS[p.preset] || PRINT_PRESETS['80'];
  return preset.label.replace('Termica', 'T\u00e9rmica') + ' \u00b7 ' + p.widthMm + ' mm de ancho';
}

/** Copia la configuracion a variables CSS y arma la regla @page. */
function applyPrintVars(){
  const p = printPrefs();
  const hoja = p.preset === 'hoja';
  const r = document.documentElement.style;
  r.setProperty('--print-w',    Math.max(30, Number(p.widthMm) || 72) + 'mm');
  r.setProperty('--print-size', (Number(p.fontSize) || 12) + 'px');
  r.setProperty('--print-lh',   String(PRINT_SPACING[p.spacing] || 1.35));
  r.setProperty('--print-pad',  hoja ? '0mm' : '1.5mm');
  r.setProperty('--print-feed', (Number(p.feedMm) || 0) + 'mm');

  let regla = document.getElementById('printPageRule');
  if(!regla){
    regla = document.createElement('style');
    regla.id = 'printPageRule';
    document.head.appendChild(regla);
  }
  regla.textContent = hoja
    ? '@page{ size:auto; margin:8mm; }'
    : '@page{ size:' + printPaperMm(p) + 'mm auto; margin:0; }';
}

/* Las termicas dibujan los emojis como imagen y salen borrosos:
   en el ticket impreso se quitan. */
function stripEmoji(txt){
  return String(txt == null ? '' : txt)
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
    .trim();
}

/** Imprime el ticket con el tamano configurado. Acepta el id o el objeto. */
function printTicket(venta){
  let sale = null;
  if(venta && typeof venta === 'object') sale = venta;
  else if(venta) sale = DB.getSales().find(s => s.id === venta) || null;

  const agotados = stockAlert.filter(x => x.stock <= 0);

function matchesHistoryFilters(sale){
  const now = new Date();
  const d = new Date(sale.date);
  if(historyFilters.period === 'today' && !isSameDay(d, now)) return false;
  if(historyFilters.period === 'week' && !isSameWeek(d, now)) return false;
  if(historyFilters.period === 'month' && !isSameMonth(d, now)) return false;
  if(historyFilters.status === 'activa' && sale.cancelled) return false;
  if(historyFilters.status === 'cancelada' && !sale.cancelled) return false;
  if(historyFilters.service !== 'all' && sale.serviceType !== historyFilters.service) return false;
  if(historyFilters.payment !== 'all' && sale.paymentMethod !== historyFilters.payment) return false;
  if(historyFilters.search){
    const q = historyFilters.search.toLowerCase();
    const inNumber = String(sale.number).includes(q) || orderNumberLabel(sale.number).toLowerCase().includes(q);
    const inItems = sale.items.some(it => it.name.toLowerCase().includes(q));
    const inTable = (sale.table || '').toLowerCase().includes(q);
    if(!inNumber && !inItems && !inTable) return false;
  }
  return true;
}

/* Gráfico de barras del historial: solo aparece cuando las ventas filtradas
   abarcan más de una semana, agrupando por día (o por semana si el rango
   es muy largo), con el mismo lenguaje visual que la vista de Ventas. */
function buildHistoryChart(sales){
  const activeSales = sales.filter(s => !s.cancelled);
  if(activeSales.length < 2) return '';

  const times = activeSales.map(s => new Date(s.date).getTime());
  const minT = Math.min(...times), maxT = Math.max(...times);
  const spanDays = (maxT - minT) / 86400000;
  if(spanDays < 7) return '';

  const groupByWeek = spanDays > 31;
  const buckets = {};
  activeSales.forEach(s => {
    const d = new Date(s.date);
    let key, label;
    if(groupByWeek){
      const wk = startOfWeek(d);
      key = wk.getTime();
      label = 'Sem. ' + wk.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit' });
    } else {
      const day = new Date(d); day.setHours(0,0,0,0);
      key = day.getTime();
      label = day.toLocaleDateString('es-MX', { day:'2-digit', month:'short' });
    }
    if(!buckets[key]) buckets[key] = { key, label, total:0 };
    buckets[key].total += s.total;
  });

  let rows = Object.values(buckets).sort((a,b) => a.key - b.key);
  if(rows.length > 14) rows = rows.slice(-14);
  const maxVal = Math.max(...rows.map(r => r.total), 1);

  return `
    <div class="section-title" style="margin-top:0;">Ventas por ${groupByWeek ? 'semana' : 'día'}</div>
    <div class="card hist-chart-card">
      ${rows.map(r => `
        <div class="bar-row">
          <div class="bar-row-top"><span>${r.label}</span><span class="bv">${formatMoney(r.total)}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(r.total/maxVal)*100}%; background:var(--sec-history);"></div></div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ---------- Ganancia neta ----------
   Ganancia = (precio de venta − precio de producción) × cantidad, sin IVA
   (el IVA no es ganancia). Usa el coste guardado en cada venta; en ventas
   anteriores usa el que tiene hoy el producto. Lo que no tenga precio de
   producción no se cuenta (se avisa en pantalla). */
function itemCost(it){
  if(it.cost != null) return it.cost;
  const p = findProduct(it.productId);
  return (p && p.cost != null) ? p.cost : null;
}
function computeProfit(sales){
  let profit = 0, missing = 0;
  sales.forEach(s => s.items.forEach(it => {
    const c = itemCost(it);
    if(c == null){ missing += it.qty; return; }
    profit += (it.price - c) * it.qty;
  }));
  return { profit: round2(profit), missing };
}

/* ---------- Gráficas de Ventas (barras y líneas) ----------
   Se calculan al vuelo con las ventas guardadas (sin canceladas).
   Cambian solas al elegir Días / Semanas / Meses. */
let statsPeriod = 'days';   // days | weeks | months
let statsSel = null;        // columna seleccionada (null = la actual)
const STATS_PERIODS = [
  { id:'days',   label:'Días',    n:14 },
  { id:'weeks',  label:'Semanas', n:8  },
  { id:'months', label:'Meses',   n:6  },
];

function buildStatsBuckets(sales, period){
  const cfg = STATS_PERIODS.find(p => p.id === period) || STATS_PERIODS[0];
  const now = new Date();
  const rows = [];
  for(let i = cfg.n - 1; i >= 0; i--){
    let start, end, label, long;
    if(period === 'days'){
      start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
      label = String(start.getDate());
      long = i === 0 ? 'Hoy' : start.toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short' });
    } else if(period === 'weeks'){
      start = startOfWeek(now); start.setDate(start.getDate() - 7 * i);
      end = new Date(start); end.setDate(end.getDate() + 7);
      label = start.getDate() + '/' + (start.getMonth() + 1);
      long = i === 0 ? 'Esta semana' : 'Semana del ' + start.toLocaleDateString('es-MX', { day:'numeric', month:'short' });
    } else {
      start = new Date(now.getFullYear(), now.getMonth() - i, 1);
      end = new Date(start.getFullYear(), start.getMonth() + 1, 1);
      label = start.toLocaleDateString('es-MX', { month:'short' }).replace('.', '');
      long = start.toLocaleDateString('es-MX', { month:'long', year:'numeric' });
    }
    rows.push({ start:start.getTime(), end:end.getTime(), label, long, total:0, count:0 });
  }
  sales.forEach(s => {
    const t = new Date(s.date).getTime();
    const r = rows.find(r => t >= r.start && t < r.end);
    if(r){ r.total += s.total; r.count += 1; }
  });
  return rows;
}

function statsChartsHTML(){
  const rows = buildStatsBuckets(DB.getSales().filter(s => !s.cancelled), statsPeriod);
  const n = rows.length;
  const sel = (statsSel !== null && statsSel < n) ? statsSel : n - 1;
  const cur = rows[sel];
  const maxTotal = Math.max(1, ...rows.map(r => r.total));
  const maxCount = Math.max(1, ...rows.map(r => r.count));

  const cx = i => ((i + 0.5) / n) * 100;
  const py = v => 8 + (v / maxCount) * 84;            // % desde abajo
  const pts = rows.map((r, i) => cx(i).toFixed(2) + ',' + (100 - py(r.count)).toFixed(2));
  const area = cx(0).toFixed(2) + ',100 ' + pts.join(' ') + ' ' + cx(n - 1).toFixed(2) + ',100';
  const xLabels = `<div class="chart-x">${rows.map((r, i) => `<span class="${i === sel ? 'sel' : ''}">${r.label}</span>`).join('')}</div>`;

  return `
    <div class="seg" role="tablist" aria-label="Periodo">
      ${STATS_PERIODS.map(p => `<button role="tab" aria-selected="${p.id === statsPeriod}" class="${p.id === statsPeriod ? 'active' : ''}" onclick="setStatsPeriod('${p.id}')">${p.label}</button>`).join('')}
    </div>
    <div class="chart-grid">
      <div class="card">
        <div class="chart-head">
          <div><div class="chart-title">Ventas</div><div class="chart-sub">${cur.long}</div></div>
          <div class="chart-value">${formatMoney(cur.total)}</div>
        </div>
        <div class="chart-plot">
          ${rows.map((r, i) => `<button class="chart-col ${i === sel ? 'sel' : ''}" onclick="selectStatsBucket(${i})" aria-label="${r.long}: ${formatMoney(r.total)}">
            <span class="vbar ${r.total ? '' : 'zero'}" style="${r.total ? 'height:' + Math.max(r.total / maxTotal * 100, 4) + '%' : ''}"></span>
          </button>`).join('')}
        </div>
        ${xLabels}
      </div>
      <div class="card">
        <div class="chart-head">
          <div><div class="chart-title">Pedidos</div><div class="chart-sub">${cur.long}</div></div>
          <div class="chart-value">${cur.count} pedido${cur.count === 1 ? '' : 's'}</div>
        </div>
        <div class="chart-plot">
          <svg class="line-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <polygon points="${area}" fill="var(--accent-soft)" opacity=".75"/>
            <polyline points="${pts.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
          </svg>
          ${rows.map((r, i) => `<button class="chart-col ${i === sel ? 'sel' : ''}" onclick="selectStatsBucket(${i})" aria-label="${r.long}: ${r.count} pedidos">
            <span class="dot" style="bottom:${py(r.count)}%"></span>
          </button>`).join('')}
        </div>
        ${xLabels}
      </div>
    </div>
  `;
}

  const el = document.getElementById('statsCharts');
  if(el) el.innerHTML = statsChartsHTML();

function renderProducts(){
  const products = DB.getProducts();
  const categories = DB.getCategories();
  return `
    <h1 class="page-title">Productos</h1>
    <p class="page-sub">Administra tu catálogo y tus existencias</p>

    ${stockWarningCardHTML()}

    <div class="fab-row" style="gap:8px; margin-top:16px;">
      <button class="btn ghost" onclick="openCategoryManager()">${icon('tag')} Categorías</button>
      <button class="btn primary" onclick="openProductForm()">${icon('plus')} Nuevo producto</button>
    </div>

    ${products.length === 0 ? `
      <div class="empty-state">
        ${illustration('boxEmpty')}
        <div class="empty-title">Aún no hay productos</div>
        <div class="empty-text">Agrega tu primer producto para empezar a vender.</div>
      </div>
    ` : ''}

    ${categories.map(cat => {
      const items = products.filter(p => p.category === cat.id);
      if(items.length === 0) return '';
      return `
        <div class="cat-header">
          <span class="cat-emoji">${cat.emoji}</span>
          <span class="cat-name">${cat.name}</span>
          <span class="cat-count">· ${items.length}</span>
        </div>
        ${items.map(p => renderProdRow(p, cat)).join('')}
      `;
    }).join('')}
    ${(() => {
      const orphans = products.filter(p => !categories.some(c => c.id === p.category));
      if(orphans.length === 0) return '';
      return `
        <div class="cat-header">
          <span class="cat-emoji">${UNCATEGORIZED.emoji}</span>
          <span class="cat-name">${UNCATEGORIZED.name}</span>
          <span class="cat-count">· ${orphans.length}</span>
        </div>
        ${orphans.map(p => renderProdRow(p, UNCATEGORIZED)).join('')}
      `;
    })()}
  `;
}

function renderProdRow(p, cat){
  const st = stockInfo(p);
  return `
    <div class="prod-row">
      <div class="pr-photo">
        ${p.image ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">` : `<span style="color:${cat.color}">${icon('plate')}</span>`}
      </div>
      <div class="pr-info">
        <div class="pr-name">${escapeHtml(p.name)}</div>
        <div class="pr-price">${formatMoney(p.price)}${p.cost != null ? ' · producción ' + formatMoney(p.cost) : ''}</div>
        ${st.control ? `<div class="pr-stock">${stockBadge(p)}</div>` : ''}
      </div>
      <label class="switch">
        <input type="checkbox" ${p.active?'checked':''} onchange="toggleProductActive('${p.id}', this.checked)">
        <span class="track"></span>
      </label>
      <div class="pr-actions">
        ${st.control ? `<button class="icon-btn" title="Agregar existencias" onclick="openStockForm('${p.id}')">${icon('boxes')}</button>` : ''}
        <button class="icon-btn" onclick="openProductForm('${p.id}')">${icon('edit')}</button>
        <button class="icon-btn" onclick="deleteProduct('${p.id}')">${icon('trash')}</button>
      </div>
    </div>
  `;
}

/* ---------- Agregar existencias rápido (sin abrir todo el formulario) ---------- */
function openStockForm(productId){
  const p = DB.getProducts().find(x => x.id === productId);
  if(!p) return;
  const st = stockInfo(p);
  openModal(`
    <h3 class="sheet-title">Existencias de ${escapeHtml(p.name)}</h3>
    <p class="sheet-text">Hoy tienes <b>${st.stock}</b> ${st.stock === 1 ? 'pieza' : 'piezas'}. Escribe cuántas quedan o suma lo que acabas de comprar.</p>
    <div class="field">
      <label>Piezas disponibles</label>
      <input id="sfStock" type="number" inputmode="numeric" min="0" step="1" value="${st.stock}">
    </div>
    <div class="opt-grid">
      <button class="opt-card" onclick="sumarStock(5)">+5</button>
      <button class="opt-card" onclick="sumarStock(10)">+10</button>
      <button class="opt-card" onclick="sumarStock(20)">+20</button>
    </div>
    <div class="field">
      <label>Avisarme cuando queden</label>
      <input id="sfMin" type="number" inputmode="numeric" min="0" step="1" value="${st.min}">
      <div class="field-hint">Con ese número o menos, el producto aparece marcado en la app.</div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost block" onclick="closeModal()">Cancelar</button>
      <button class="btn primary block" onclick="saveStockForm('${p.id}')">Guardar</button>
    </div>
  `, { dismissible:true });
}

function sumarStock(n){
  const input = document.getElementById('sfStock');
  if(!input) return;
  input.value = Math.max(0, (parseInt(input.value, 10) || 0) + n);
  vibrate(10);
}

function saveStockForm(productId){
  const stock = parseInt(document.getElementById('sfStock').value, 10);
  let min = parseInt(document.getElementById('sfMin').value, 10);
  if(isNaN(stock) || stock < 0){ toast('Escribe cuántas piezas tienes'); return; }
  if(isNaN(min) || min < 0) min = 2;

  const products = DB.getProducts();
  const p = products.find(x => x.id === productId);
  if(!p) return;
  p.stock = stock;
  p.minStock = min;
  DB.saveProducts(products);
  closeModal();
  toast('Existencias actualizadas', { icon:icon('check'), variant:'toast-success', subtitle: p.name + ': ' + stock + ' piezas' });
  render();
}

function toggleProductActive(id, active){
  const products = DB.getProducts();
  const p = products.find(x => x.id === id);
  if(!p) return;
  p.active = active;
  DB.saveProducts(products);
  toast(active ? 'Producto activado' : 'Producto desactivado');
}

function deleteProduct(productId){
  const products = DB.getProducts();
  const p = products.find(x => x.id === productId);
  if(!p) return;
  const ok = window.confirm(`¿Eliminar el producto "${p.name}"? Esta acción no se puede deshacer.`);
  if(!ok) return;

  DB.saveProducts(products.filter(x => x.id !== productId));
  cart = cart.filter(c => c.productId !== productId);

  toast('Producto eliminado');
  render();
}

function openCategoryForm(categoryId){
  const categories = DB.getCategories();
  const editing = categoryId ? categories.find(c => c.id === categoryId) : null;
  const html = `
    <div class="sheet-header">
      <h2>${editing ? 'Editar categoría' : 'Nueva categoría'}</h2>
      <button class="sheet-close" onclick="openCategoryManager()">${icon('close')}</button>
    </div>
    <div class="field">
      <label>Nombre</label>
      <input id="cfName" type="text" placeholder="Ej. Postres" value="${editing ? escapeHtml(editing.name) : ''}">
    </div>
    <div class="field">
      <label>Ícono (emoji, opcional)</label>
      <input id="cfEmoji" type="text" maxlength="4" placeholder="🍰" value="${editing ? escapeHtml(editing.emoji) : ''}">
    </div>
    <div class="field">
      <label>Color</label>
      <input id="cfColor" type="color" style="height:46px; padding:4px;" value="${editing ? editing.color : '#F5BF3C'}">
    </div>
    <button class="btn primary block" onclick="saveCategoryForm('${editing ? editing.id : ''}')">${editing ? 'Guardar cambios' : 'Crear categoría'}</button>
  `;

}

function saveCategoryForm(categoryId){
  const name = document.getElementById('cfName').value.trim();
  const emoji = document.getElementById('cfEmoji').value.trim() || '🍽️';
  const color = document.getElementById('cfColor').value || '#F5BF3C';
  if(!name){ toast('Escribe un nombre para la categoría'); return; }

  const categories = DB.getCategories();
  if(categoryId){
    const c = categories.find(x => x.id === categoryId);
    c.name = name; c.emoji = emoji; c.color = color;
  } else {
    categories.push({ id:'cat' + Date.now(), name, emoji, color });
  }
  DB.saveCategories(categories);
  toast(categoryId ? 'Categoría actualizada' : 'Categoría creada');
  openCategoryManager();
  renderBackgroundIfProducts();
}

function deleteCategory(categoryId){
  const categories = DB.getCategories();
  const cat = categories.find(c => c.id === categoryId);
  if(!cat) return;
  const products = DB.getProducts();
  const affected = products.filter(p => p.category === categoryId);
  const msg = affected.length > 0
    ? `"${cat.name}" tiene ${affected.length} producto(s). Se moverán a "Sin categoría". ¿Eliminar de todas formas?`
    : `¿Eliminar la categoría "${cat.name}"?`;
  const ok = window.confirm(msg);
  if(!ok) return;

  const remaining = categories.filter(c => c.id !== categoryId);
  DB.saveCategories(remaining);

  if(affected.length > 0){
    affected.forEach(p => p.category = UNCATEGORIZED.id);
    DB.saveProducts(products);
  }
  if(saleCategoryFilter === categoryId) saleCategoryFilter = 'todos';

  toast('Categoría eliminada');
  openCategoryManager();
  renderBackgroundIfProducts();
}

/* Redimensiona/recorta cualquier imagen a un cuadro fijo (cover) para que
   el tamaño de la tarjeta de producto nunca cambie, sin importar la foto original. */
const PRODUCT_IMAGE_SIZE = 320;
function onProductPhotoSelected(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Selecciona un archivo de imagen'); return; }

  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const size = PRODUCT_IMAGE_SIZE;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      const dx = (size - w) / 2, dy = (size - h) / 2;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, dx, dy, w, h);
      productFormImage = canvas.toDataURL('image/jpeg', 0.85);

      const box = document.getElementById('pfPhotoBox');
      if(box){
        box.classList.add('has-image');
        box.innerHTML = `<img id="pfPhotoImg" src="${productFormImage}" alt="">
          <span class="photo-upload-hint">Toca para subir una foto</span>
          <input id="pfPhotoInput" type="file" accept="image/*" style="display:none" onchange="onProductPhotoSelected(this)">`;
        let removeBtn = box.parentElement.querySelector('.photo-upload-remove-block');
        if(!removeBtn){
          box.insertAdjacentHTML('afterend', `<button type="button" class="btn ghost block photo-upload-remove-block" style="margin-top:8px;" onclick="removeProductPhoto()">${icon('trash')} Quitar foto</button>`);
        }
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeProductPhoto(){
  productFormImage = null;
  const box = document.getElementById('pfPhotoBox');
  if(box){
    box.classList.remove('has-image');
    box.innerHTML = `${icon('camera')}
      <span class="photo-upload-hint">Toca para subir una foto</span>
      <input id="pfPhotoInput" type="file" accept="image/*" style="display:none" onchange="onProductPhotoSelected(this)">`;
  }
  const removeBtn = document.querySelector('.photo-upload-remove-block');
  if(removeBtn) removeBtn.remove();
}

/* Muestra u oculta los campos de existencias dentro del formulario. */
function toggleStockFields(on){
  const box = document.getElementById('pfStockBox');
  if(box) box.style.display = on ? 'block' : 'none';
  if(on){
    const input = document.getElementById('pfStock');
    if(input && input.value === '') input.value = 0;
  }
}

function saveProductForm(productId){
  const name = document.getElementById('pfName').value.trim();
  const price = parseFloat(document.getElementById('pfPrice').value);
  const category = document.getElementById('pfCategory').value;

  if(!name){ toast('Escribe un nombre para el producto'); return; }
  if(isNaN(price) || price < 0){ toast('Ingresa un precio de venta válido'); return; }
  const costRaw = document.getElementById('pfCost').value.trim();
  const cost = costRaw === '' ? null : parseFloat(costRaw);
  if(cost !== null && (isNaN(cost) || cost < 0)){ toast('Ingresa un precio de producción válido'); return; }

  // Existencias (opcional)
  const stockOn = document.getElementById('pfStockOn').checked;
  let stock = null, minStock = 2;
  if(stockOn){
    stock = parseInt(document.getElementById('pfStock').value, 10);
    if(isNaN(stock) || stock < 0){ toast('Escribe cuántas piezas tienes'); return; }
    minStock = parseInt(document.getElementById('pfMinStock').value, 10);
    if(isNaN(minStock) || minStock < 0) minStock = 2;
  }

  const products = DB.getProducts();
  if(productId){
    const p = products.find(x => x.id === productId);
    p.name = name; p.price = round2(price); p.cost = cost === null ? null : round2(cost); p.category = category; p.image = productFormImage;
    p.stock = stock; p.minStock = minStock;
  } else {
    products.push({ id:'p' + Date.now(), name, price: round2(price), cost: cost === null ? null : round2(cost), category, active:true, image: productFormImage, stock: stock, minStock: minStock });
  }
  DB.saveProducts(products);
  productFormImage = null;
  closeModal();
  toast(productId ? 'Producto actualizado' : 'Producto agregado');
  render();
}

function tickClock(){
  const el = document.getElementById('clock');
  if(!el) return;
  const now = new Date();
  el.innerHTML = now.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit' }) + '<br>' +
    now.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
}

function paintChrome(){
  const mark = document.getElementById('brandMark');
  if(mark) mark.innerHTML = ICONS.fork;
  document.querySelectorAll('.navbtn').forEach(btn => {
    const holder = btn.querySelector('.navicon');
    if(holder) holder.innerHTML = icon(btn.dataset.icon);
  });
  const av = document.getElementById('avatarBtn');
  const u = (typeof currentUser === 'function') ? currentUser() : null;
  if(av){
    av.innerHTML = (u && u.photo) ? `<img src="${u.photo}" alt="">` : `<span class="ini">${initials()}</span>`;
  }
  const chip = document.getElementById('chipName');
  if(chip){
    const n = (u && u.name || '').trim();
    chip.textContent = n ? n.split(/\s+/)[0] : 'Mi cuenta';
  }
}

const COUNTRIES = [
  { code:'MX', flag:'🇲🇽', name:'México',              dial:'+52', digits:10 },
  { code:'US', flag:'🇺🇸', name:'Estados Unidos',      dial:'+1',  digits:10 },
  { code:'CO', flag:'🇨🇴', name:'Colombia',            dial:'+57', digits:10 },
  { code:'AR', flag:'🇦🇷', name:'Argentina',           dial:'+54', digits:10 },
  { code:'PE', flag:'🇵🇪', name:'Perú',                dial:'+51', digits:9  },
  { code:'CL', flag:'🇨🇱', name:'Chile',               dial:'+56', digits:9  },
  { code:'GT', flag:'🇬🇹', name:'Guatemala',           dial:'+502', digits:8 },
  { code:'ES', flag:'🇪🇸', name:'España',              dial:'+34', digits:9  }
];
function countryOf(code){ return COUNTRIES.find(c => c.code === code) || COUNTRIES[0]; }

/* ---------- Persistencia de la cuenta ---------- */
const AUTH = {
  getUser(){
    try{ return JSON.parse(localStorage.getItem('mesa_user') || 'null'); }
    catch(e){ return null; }
  },
  saveUser(u){ localStorage.setItem('mesa_user', JSON.stringify(u)); },
  isLogged(){ return localStorage.getItem('mesa_session') === '1' && !!AUTH.getUser(); },
  openSession(){ localStorage.setItem('mesa_session','1'); },
  closeSession(){ localStorage.removeItem('mesa_session'); },
  eraseAccount(){
    localStorage.removeItem('mesa_user');
    localStorage.removeItem('mesa_session');
  }
};

function newUser(country, phone){
  return {
    name:'',
    country: country,
    phone: phone,
    photo: null,
    provider: 'phone',
    business: { name:'', type:'', address:'', phone:'' },
    prefs: { notifSales:true, notifStock:true, notifDaily:false, haptics:true, bizOnTicket:true },
    pin: null,
    createdAt: new Date().toISOString()
  };
}

function currentUser(){ return AUTH.getUser(); }
function userPrefs(){
  const u = currentUser();
  const base = { notifSales:true, notifStock:true, notifDaily:false, haptics:true, bizOnTicket:true };
  return Object.assign(base, (u && u.prefs) || {});
}
function updateUser(patch){
  const u = currentUser() || newUser('MX','');
  AUTH.saveUser(Object.assign({}, u, patch));
}
function displayName(){
  const u = currentUser();
  if(!u) return 'Invitado';
  return u.name && u.name.trim() ? u.name.trim() : 'Sin nombre';
}
function initials(){
  const n = (currentUser() && currentUser().name || '').trim();
  if(!n) return icon('person');
  return n.split(/\s+/).slice(0,2).map(p => p[0].toUpperCase()).join('');
}
function fullPhone(u){
  u = u || currentUser();
  if(!u || !u.phone) return 'Sin número';
  return countryOf(u.country).dial + ' ' + formatPhone(u.phone, u.country);
}
function formatPhone(digits, code){
  const c = countryOf(code);
  if(c.code === 'MX' && digits.length === 10){
    return digits.slice(0,2) + ' ' + digits.slice(2,6) + ' ' + digits.slice(6);
  }
  if(digits.length === 10) return digits.slice(0,3) + ' ' + digits.slice(3,6) + ' ' + digits.slice(6);
  return digits;
}

let authState = {
  screen: 'welcome',   // welcome | signup | login | otp | name | lock
  mode: 'signup',      // signup | login
  country: 'MX',
  phone: '',
  terms: false,
  code: '',            // código simulado de 6 dígitos
  resendIn: 0,
  pinBuffer: ''
};
/* ¿El envío real de SMS ya está conectado?
   false = modo actual: se entra sin código (la pantalla de código existe
   y funciona, solo está en pausa).
   true  = pide el código de 6 dígitos. */
const SMS_ACTIVADO = false;

let authResendTimer = null;
let accountFormPhoto = null;   // foto temporal mientras se edita el perfil

function showAuth(screen){
  authState.screen = screen || authState.screen;
  document.getElementById('authLayer').classList.add('show');
  document.body.classList.add('auth-open');
  closeModal();
  renderAuth();
}
function hideAuth(){
  document.getElementById('authLayer').classList.remove('show');
  document.getElementById('authLayer').innerHTML = '';
  document.body.classList.remove('auth-open');
  clearInterval(authResendTimer);
}
function authGo(screen){
  authState.screen = screen;
  renderAuth();
}

function renderAuth(){
  const layer = document.getElementById('authLayer');
  const s = authState.screen;
  let html = '';
  if(s === 'welcome') html = authWelcomeHTML();
  else if(s === 'signup' || s === 'login') html = authPhoneHTML();
  else if(s === 'otp') html = authOtpHTML();
  else if(s === 'name') html = authNameHTML();
  else if(s === 'lock') html = authLockHTML();
  layer.innerHTML = `<div class="auth-screen" key="${s}">${html}</div>`;

  if(s === 'signup' || s === 'login'){
    const inp = document.getElementById('authPhone');
    if(inp) setTimeout(() => inp.focus(), 180);
  }
  if(s === 'otp'){
    const first = document.getElementById('otp0');
    if(first) setTimeout(() => first.focus(), 180);
  }
}

    <div class="auth-hero">

function authStart(mode){

}

function authPhoneHTML(){
  const isLogin = authState.mode === 'login';

  return `
    <div class="auth-top">
      <button class="auth-back" onclick="authGo('welcome')" aria-label="Regresar">${icon('chevronLeft')}</button>
    </div>
    <div class="auth-body">

        : (SMS_ACTIVADO

            <span class="flag">${c.flag}</span>${c.dial}${icon('chevronDown')}

                 placeholder="${'0'.repeat(Math.min(c.digits,4))} ${'0'.repeat(Math.max(c.digits-4,0))}"
                 value="${formatPhone(authState.phone, authState.country)}"
                 oninput="onAuthPhoneInput(this)">

        <div class="terms-row ${authState.terms ? 'checked':''}" id="termsRow" onclick="toggleTerms()">
          <span class="terms-box">${icon('check')}</span>
          <span class="terms-text">Aceptas los <b>términos y condiciones</b> y autorizas el <b>tratamiento de datos personales.</b></span>

      `}

      <div class="auth-actions">
        <button class="btn dark xl block" id="authPhoneBtn" ${ready ? '' : 'disabled'} onclick="sendCode()">
          ${icon('phone')} ${isLogin ? 'Entrar con mi número' : 'Crear cuenta con celular'}

        <button class="btn outline xl block" onclick="appleSignIn()">
          ${icon('apple')} ${isLogin ? 'Entrar con Apple' : 'Crear cuenta con Apple'}
        </button>

          ${isLogin
            ? `¿Aún no tienes cuenta? <button onclick="authStart('signup')">Créala aquí</button>`
            : `¿Ya tienes una cuenta? <button onclick="authStart('login')">Inicia sesión</button>`}
        </p>
      </div>
    </div>
  `;
}

function authPhoneReady(){
  const c = countryOf(authState.country);
  const okPhone = authState.phone.length === c.digits;
  return authState.mode === 'login' ? okPhone : (okPhone && authState.terms);
}
function refreshPhoneBtn(){
  const btn = document.getElementById('authPhoneBtn');
  if(btn) btn.disabled = !authPhoneReady();
}
function onAuthPhoneInput(input){
  const c = countryOf(authState.country);
  const digits = input.value.replace(/\D/g,'').slice(0, c.digits);
  authState.phone = digits;
  input.value = formatPhone(digits, authState.country);
  refreshPhoneBtn();
}
function toggleTerms(){
  authState.terms = !authState.terms;
  const row = document.getElementById('termsRow');
  if(row) row.classList.toggle('checked', authState.terms);
  refreshPhoneBtn();
}

function openCountryPicker(){
  openModal(`
    <h3 class="sheet-title">Elige tu país</h3>
    <div class="country-list">
      ${COUNTRIES.map(c => `
        <button class="country-item ${c.code === authState.country ? 'active':''}" onclick="pickCountry('${c.code}')">
          <span class="flag">${c.flag}</span>
          <span class="cname">${c.name}</span>
          <span class="cdial">${c.dial}</span>
        </button>
      `).join('')}
    </div>
  `, { dismissible:true });
}
function pickCountry(code){
  authState.country = code;
  authState.phone = '';
  closeModal();
  renderAuth();
}

/* ---------- Envío y validación del código ---------- */
function sendCode(){
  if(!authPhoneReady()) return;
  const existing = currentUser();
  if(authState.mode === 'login'){
    const same = existing && existing.phone === authState.phone && existing.country === authState.country;
    if(!same){
      toast('No encontramos esa cuenta en este dispositivo', {
        subtitle:'Revisa el número o crea una cuenta nueva',
        variant:'toast-danger', icon:icon('close'), duration:2600
      });
      return;
    }
  }
  vibrate(12);

  if(!SMS_ACTIVADO){
    entrarSinCodigo();
    return;
  }

  authState.code = String(Math.floor(100000 + Math.random() * 900000));
  authState.resendIn = 45;
  authGo('otp');
  startResendTimer();
}

/* Entrada directa mientras el SMS no está conectado.
   Hace exactamente lo mismo que verifyCode() cuando el código es correcto. */
function entrarSinCodigo(){
  if(authState.mode === 'login'){
    AUTH.openSession();
    finishAuth('¡Bienvenido de vuelta!');
    return;
  }
  const existing = currentUser();
  if(existing && existing.phone === authState.phone){
    AUTH.openSession();
    finishAuth('¡Bienvenido de vuelta!');
    return;
  }
  AUTH.saveUser(newUser(authState.country, authState.phone));
  AUTH.openSession();
  authGo('name');
}

function startResendTimer(){
  clearInterval(authResendTimer);
  authResendTimer = setInterval(() => {
    authState.resendIn -= 1;
    const el = document.getElementById('resendArea');
    if(!el){ clearInterval(authResendTimer); return; }
    el.innerHTML = resendHTML();
    if(authState.resendIn <= 0) clearInterval(authResendTimer);
  }, 1000);
}
function resendHTML(){
  if(authState.resendIn > 0){
    return `Puedes pedir otro código en <b>${authState.resendIn}s</b>`;
  }
  return `¿No te llegó? <button onclick="sendCode()">Enviar de nuevo</button>`;
}

function authOtpHTML(){
  const c = countryOf(authState.country);
  return `
    <div class="auth-top">
      <button class="auth-back" onclick="authBackFromOtp()" aria-label="Regresar">${icon('chevronLeft')}</button>
    </div>
    <div class="auth-body">
      <h1 class="auth-title">Escribe tu código</h1>
      <p class="auth-sub">Enviamos 6 dígitos al <b style="color:var(--ink)">${c.dial} ${formatPhone(authState.phone, authState.country)}</b>.</p>

      <div class="auth-illu">${ILLUSTRATIONS.lockShield}</div>

      <div class="demo-code">
        Versión de prueba: aquí todavía no se manda un SMS real, así que tu código es
        <span>${authState.code}</span>
      </div>

      <div class="otp-row" id="otpRow">
        ${[0,1,2,3,4,5].map(i => `
          <input class="otp-cell" id="otp${i}" type="tel" inputmode="numeric" maxlength="1"
                 autocomplete="one-time-code"
                 oninput="onOtpInput(${i}, this)" onkeydown="onOtpKey(${i}, event)" onpaste="onOtpPaste(event)">
        `).join('')}
      </div>
      <p class="otp-help" id="resendArea">${resendHTML()}</p>

      <div class="auth-actions">
        <button class="btn dark xl block" id="otpBtn" disabled onclick="verifyCode()">Verificar</button>
      </div>
    </div>
  `;
}

function authBackFromOtp(){
  clearInterval(authResendTimer);
  authGo(authState.mode === 'login' ? 'login' : 'signup');
}

function otpValue(){
  return [0,1,2,3,4,5].map(i => (document.getElementById('otp'+i) || {}).value || '').join('');
}
function refreshOtpBtn(){
  const btn = document.getElementById('otpBtn');
  if(btn) btn.disabled = otpValue().length !== 6;
}
function onOtpInput(i, el){
  el.value = el.value.replace(/\D/g,'').slice(0,1);
  el.classList.toggle('filled', !!el.value);
  document.getElementById('otpRow').classList.remove('error');
  if(el.value && i < 5){ document.getElementById('otp'+(i+1)).focus(); }
  refreshOtpBtn();
  if(otpValue().length === 6) setTimeout(verifyCode, 140);
}
function onOtpKey(i, e){
  if(e.key === 'Backspace' && !e.target.value && i > 0){
    const prev = document.getElementById('otp'+(i-1));
    prev.value = ''; prev.classList.remove('filled'); prev.focus();
    refreshOtpBtn();
  }
}
function onOtpPaste(e){
  const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
  if(!txt) return;
  e.preventDefault();
  txt.split('').forEach((d, i) => {
    const cell = document.getElementById('otp'+i);
    if(cell){ cell.value = d; cell.classList.add('filled'); }
  });
  refreshOtpBtn();
  if(txt.length === 6) setTimeout(verifyCode, 140);
}

function verifyCode(){
  const value = otpValue();
  if(value.length !== 6) return;
  if(value !== authState.code){
    const row = document.getElementById('otpRow');
    row.classList.add('error');
    setTimeout(() => row.classList.remove('error'), 400);
    [0,1,2,3,4,5].forEach(i => {
      const c = document.getElementById('otp'+i);
      c.value = ''; c.classList.remove('filled');
    });
    document.getElementById('otp0').focus();
    refreshOtpBtn();
    vibrate([18,60,18]);
    toast('Ese código no coincide', { subtitle:'Revísalo e inténtalo otra vez', variant:'toast-danger', icon:icon('close') });
    return;
  }

  clearInterval(authResendTimer);
  vibrate(20);

  if(authState.mode === 'login'){
    AUTH.openSession();
    finishAuth('¡Bienvenido de vuelta!');
    return;
  }
  const existing = currentUser();
  if(existing && existing.phone === authState.phone){
    AUTH.openSession();
    finishAuth('¡Bienvenido de vuelta!');
    return;
  }
  AUTH.saveUser(newUser(authState.country, authState.phone));
  AUTH.openSession();
  authGo('name');
}

const AVATAR_SIZE = 256;
function onAvatarSelected(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Selecciona un archivo de imagen'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const size = AVATAR_SIZE;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0,0,size,size);
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      accountFormPhoto = canvas.toDataURL('image/jpeg', 0.85);
      const box = document.getElementById('avatarBox');
      if(box){
        box.classList.add('has-image');
        box.innerHTML = `<img src="${accountFormPhoto}" alt="">`;
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removeAvatar(){
  accountFormPhoto = null;
  const box = document.getElementById('avatarBox');
  if(box){ box.classList.remove('has-image'); box.innerHTML = icon('camera'); }
  const del = document.querySelector('.photo-picker-actions .btn.danger');
  if(del) del.remove();
}

      <b>Escala 100%</b>. Si tu impresora trae su propio tama\u00f1o de papel
      (por ejemplo 80 x 297 mm), sel\u00e9ccionalo ah\u00ed mismo.
    </p>

    <div class="sheet-actions">
      <button class="btn ghost block" onclick="printTestTicket()">${icon('print')} Imprimir prueba</button>
      <button class="btn primary block" onclick="closeModal(); render();">Listo</button>
    </div>
    <button class="btn ghost block" style="margin-top:10px;" onclick="resetPrintPrefs()">Restablecer valores</button>
  `;
}

function openNotifications(){
  const p = userPrefs();
  openModal(`
    <h3 class="sheet-title">Notificaciones</h3>
    <div class="toggle-row">
      <span class="acc-ico green">${icon('check')}</span>
      <span class="acc-txt">
        <span class="acc-label">Avisos de venta</span>
        <span class="acc-sub">Confirmación cada vez que cobras.</span>
      </span>
      <label class="switch"><input type="checkbox" ${p.notifSales ? 'checked':''} onchange="setPref('notifSales', this.checked)"><span class="track"></span></label>
    </div>
    <div class="toggle-row">
      <span class="acc-ico gold">${icon('box')}</span>
      <span class="acc-txt">
        <span class="acc-label">Productos por agotarse</span>
        <span class="acc-sub">Te avisamos cuando queda poco inventario.</span>
      </span>
      <label class="switch"><input type="checkbox" ${p.notifStock ? 'checked':''} onchange="setPref('notifStock', this.checked)"><span class="track"></span></label>
    </div>
    <div class="toggle-row">
      <span class="acc-ico violet">${icon('chart')}</span>
      <span class="acc-txt">
        <span class="acc-label">Resumen del día</span>
        <span class="acc-sub">Tus ventas totales al cerrar el día.</span>
      </span>
      <label class="switch"><input type="checkbox" ${p.notifDaily ? 'checked':''} onchange="setPref('notifDaily', this.checked)"><span class="track"></span></label>
    </div>
    <div class="sheet-actions">
      <button class="btn primary block" onclick="closeModal(); render();">Listo</button>
    </div>
  `, { dismissible:true });
}

function setPref(key, value){
  const p = userPrefs();
  p[key] = value;
  updateUser({ prefs: p });
}

/* ---------- Seguridad ---------- */
function openSecurity(){
  const u = currentUser() || {};
  openModal(`
    <h3 class="sheet-title">Seguridad</h3>
    <div class="toggle-row">
      <span class="acc-ico gold">${icon('key')}</span>
      <span class="acc-txt">
        <span class="acc-label">PIN para abrir la app</span>
        <span class="acc-sub">${u.pin ? 'Está activado. Se pide cada vez que abres la app.' : 'Protege tus ventas con 4 dígitos.'}</span>
      </span>
      <label class="switch"><input type="checkbox" ${u.pin ? 'checked':''} onchange="togglePin(this.checked)"><span class="track"></span></label>
    </div>
    ${u.pin ? `<button class="btn ghost block" style="margin-top:14px;" onclick="openPinForm()">${icon('edit')} Cambiar mi PIN</button>` : ''}
    <button class="btn ghost block" style="margin-top:10px;" onclick="openChangePhone()">${icon('phone')} Cambiar número de celular</button>
    <div class="sheet-actions">
      <button class="btn primary block" onclick="closeModal(); render();">Listo</button>
    </div>
  `, { dismissible:true });
}
function togglePin(on){
  if(on){ openPinForm(); }
  else{
    updateUser({ pin:null });
    openSecurity();
    toast('PIN desactivado');
  }
}
function openPinForm(){
  openModal(`
    <h3 class="sheet-title">Tu PIN de 4 dígitos</h3>
    <p class="sheet-text">Te lo vamos a pedir cada vez que abras la app. Si lo olvidas, puedes entrar otra vez con tu número.</p>
    <div class="field">
      <label for="pin1">Nuevo PIN</label>
      <input id="pin1" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:8px; text-align:center;">
    </div>
    <div class="field">
      <label for="pin2">Repite el PIN</label>
      <input id="pin2" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:8px; text-align:center;">
    </div>
    <div class="sheet-actions">
      <button class="btn ghost block" onclick="openSecurity()">Cancelar</button>
      <button class="btn primary block" onclick="savePin()">Guardar PIN</button>
    </div>
  `, { dismissible:true });
}
function savePin(){
  const a = document.getElementById('pin1').value.replace(/\D/g,'');
  const b = document.getElementById('pin2').value.replace(/\D/g,'');
  if(a.length !== 4){ toast('El PIN debe tener 4 dígitos'); return; }
  if(a !== b){ toast('Los dos PIN no son iguales'); return; }
  updateUser({ pin:a });
  openSecurity();
  toast('PIN activado', { variant:'toast-success', icon:icon('check') });
}
function openChangePhone(){
  const u = currentUser() || {};
  const c = countryOf(u.country);
  openModal(`
    <h3 class="sheet-title">Cambiar número</h3>
    <p class="sheet-text">Este será tu nuevo número para iniciar sesión.</p>
    <div class="field">
      <label for="npPhone">Nuevo número</label>
      <div class="phone-row">
        <span class="phone-code"><span class="flag">${c.flag}</span>${c.dial}</span>
        <input id="npPhone" class="phone-input" type="tel" inputmode="numeric" placeholder="${'0'.repeat(c.digits)}">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost block" onclick="openSecurity()">Cancelar</button>
      <button class="btn primary block" onclick="saveNewPhone()">Guardar</button>
    </div>
  `, { dismissible:true });
}
function saveNewPhone(){
  const u = currentUser() || {};
  const c = countryOf(u.country);
  const digits = document.getElementById('npPhone').value.replace(/\D/g,'');
  if(digits.length !== c.digits){ toast(`El número debe tener ${c.digits} dígitos`); return; }
  updateUser({ phone:digits });
  closeModal();
  render();
  toast('Número actualizado', { variant:'toast-success', icon:icon('check') });
}

/* ---------- Cerrar sesión y eliminar cuenta ---------- */
function confirmLogout(){
  openModal(`
    <h3 class="sheet-title">¿Cerrar sesión?</h3>
    <p class="sheet-text">Tus productos, ventas e historial se quedan guardados en este dispositivo. Vuelves a entrar con tu número.</p>
    <div class="sheet-actions">
      <button class="btn ghost block" onclick="closeModal()">Cancelar</button>
      <button class="btn dark block" onclick="closeModal(); doLogout();">Cerrar sesión</button>
    </div>
  `, { dismissible:true });
}
function doLogout(){
  AUTH.closeSession();
  currentView = 'home';
  authState = Object.assign(authState, { screen:'welcome', mode:'login', phone:'', terms:false, code:'' });
  showAuth('welcome');
  toast('Sesión cerrada');
}

function confirmDeleteAccount(){
  openModal(`
    <h3 class="sheet-title">Eliminar cuenta</h3>
    <p class="sheet-text">
      Se borra tu perfil de este dispositivo. Si también marcas la casilla, se borran
      tus productos, categorías y el historial de ventas. Esto no se puede deshacer.
    </p>
    <div class="terms-row" id="wipeRow" onclick="this.classList.toggle('checked')">
      <span class="terms-box">${icon('check')}</span>
      <span class="terms-text">Borrar también <b>mis productos y mis ventas</b></span>
    </div>
    <div class="field" style="margin-top:18px;">
      <label for="delWord">Escribe ELIMINAR para confirmar</label>
      <input id="delWord" type="text" placeholder="ELIMINAR" autocapitalize="characters">
    </div>
    <div class="sheet-actions">
      <button class="btn ghost block" onclick="closeModal()">Cancelar</button>
      <button class="btn danger block" onclick="doDeleteAccount()">Eliminar cuenta</button>
    </div>
  `, { dismissible:true });
}
function doDeleteAccount(){
  const word = (document.getElementById('delWord').value || '').trim().toUpperCase();
  if(word !== 'ELIMINAR'){ toast('Escribe ELIMINAR para confirmar', { variant:'toast-danger', icon:icon('close') }); return; }
  const wipeAll = document.getElementById('wipeRow').classList.contains('checked');
  AUTH.eraseAccount();
  if(wipeAll){
    ['mesa_products','mesa_categories','mesa_sales','mesa_counter'].forEach(k => localStorage.removeItem(k));
    initDB();
  }
  closeModal();
  currentView = 'home';
  cart = [];
  authState = Object.assign(authState, { screen:'welcome', mode:'signup', phone:'', terms:false, code:'' });
  showAuth('welcome');
  toast('Cuenta eliminada');
}

/* ---------- Arranque de la app con sesión ---------- */
function bootApp(){
  initDB();
  applyPrintVars();
  paintChrome();
  render();
  tickClock();
  const u = currentUser();
  if(!AUTH.isLogged()){
    showAuth(u ? 'login' : 'welcome');
    if(u) authState.mode = 'login';
  }else if(u && u.pin){
    showAuth('lock');
  }
}

/* ---------- Encabezado del ticket con los datos del negocio ---------- */
function ticketBusiness(){
  const u = (typeof currentUser === 'function') ? currentUser() : null;
  const p = userPrefs();
  const b = (u && u.business) || {};
  if(p.bizOnTicket && b.name){
    return {
      title: b.name.toUpperCase(),
      sub: (b.type || 'Negocio') + ' · Ticket de venta',
      address: b.address ? escapeHtml(b.address) : ''
    };
  }
  return { title:'MESA', sub:'Restaurante · Ticket de venta', address:'' };
}

bootApp();
setInterval(tickClock, 30000);
</script>
</body>
</html>
