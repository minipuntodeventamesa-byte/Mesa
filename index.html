function mdiPasteFromClipboard(inputId){
  if(navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(t => { const el = document.getElementById(inputId); if(el){ el.value = t; el.dispatchEvent(new Event('input')); } })
      .catch(() => toast('Mantén presionado el cuadro y elige “Pegar”'));
  }else toast('Mantén presionado el cuadro y elige “Pegar”');
}
function mdiRunCompare(id){
  const el = document.getElementById('mdiCompareText');
  const text = el ? el.value : '';
  mdiUI.text = text;
  const o = MDI.get(id); if(!o) return;
  const parsed = mdiParseMessage(text);
  if(!parsed.lines.length && !parsed.payload){ toast('No encontramos productos en ese texto', { subtitle:'Copia el mensaje completo del cliente', icon:icon('alert'), variant:'toast-danger' }); return; }
  let lines = parsed.lines;
  if(!lines.length && parsed.payload){ try{ const d = mdiDecode(parsed.payload); parsed.lines = d.original.map(l => ({ name:l.name, sizeLabel:l.sizeLabel || '', qty:l.qty, amount:round2(l.price * l.qty), note:l.note })); parsed.code = d.code; }catch(e){} }
  const diffs = mdiCompare(o, parsed);
  mdiUI.result = { diffs, lines: parsed.lines, parsed };
  MDI.update(id, x => { x.waCheck = { at:new Date().toISOString(), ok:!diffs.length, n:diffs.length }; });
  vibrate(diffs.length ? [18, 50, 18] : 12);
  mdiOpen(id, true);
}
function mdiApplyWhatsapp(id){
  const r = mdiUI.result; if(!r) return;
  const nuevas = mdiLinesFromParsed({ lines:r.lines });
  MDI.update(id, o => { o.lines = nuevas; });
  mdiUI.result = null;
  toast('Pedido actualizado con lo del WhatsApp', { icon:icon('check'), variant:'toast-success', subtitle:'Revisa los productos antes de confirmar' });
  mdiRefresh();
}

/* ---------- Editar productos del pedido ---------- */
function mdiSet(id, key, val){ MDI.update(id, o => { o[key] = val; }); vibrate(8); mdiOpen(id, true); }
function mdiStepLine(id, i, dir){
  const o = MDI.get(id); if(!o || o.status !== 'nuevo') return;
  const l = o.lines[i]; if(!l) return;
  const step = mdiLineStep(l);
  MDI.update(id, x => {
    const ln = x.lines[i];
    ln.qty = r3(ln.qty + dir * step);
    if(ln.qty < step - 1e-9) x.lines.splice(i, 1);
  });
  vibrate(8);
  mdiRefresh();
}
function mdiUseCatalogPrice(id, i){
  MDI.update(id, o => { const l = o.lines[i]; const p = l && findProduct(l.productId); if(!p) return; l.price = l.sizeId ? (((p.sizes || []).find(s => s.id === l.sizeId) || {}).price || l.price) : p.price; });
  mdiRefresh();
}
function mdiRestore(id){
  if(!window.confirm('¿Regresar el pedido a como lo mandó el cliente? Se pierden los cambios que hiciste.')) return;
  MDI.update(id, o => { o.lines = (o.original || []).map(l => Object.assign({}, l)); });
  mdiRefresh();
}

let mdiLe = null;   // línea que se está editando
function mdiEditLine(id, i){
  const o = MDI.get(id); if(!o) return;
  const l = i >= 0 ? o.lines[i] : null;
  const prods = DB.getProducts().filter(p => p.active || (l && p.id === l.productId));
  if(!prods.length){ toast('Primero agrega productos a tu catálogo'); return; }
  let p = l && l.productId ? findProduct(l.productId) : null;
  if(!p && l){ const m = mdiMatchProduct(l.name, l.sizeLabel); if(m) p = m.p; }
  p = p || prods[0];
  const size = hasSizes(p) ? ((l && p.sizes.find(s => s.id === l.sizeId)) || p.sizes[0]) : null;
  mdiLe = { id, i, productId:p.id, sizeId:size ? size.id : null, qty: l ? l.qty : productStep(p),
            price: l && l.productId === p.id ? l.price : (size ? size.price : p.price), note: l ? (l.note || '') : '' };
  mdiRenderLineEditor();
}
function mdiRenderLineEditor(){
  const e = mdiLe; if(!e) return;
  const p = findProduct(e.productId);
  const cats = DB.getCategories();
  const prods = DB.getProducts().filter(x => x.active || x.id === e.productId);
  const group = c => prods.filter(x => c ? x.category === c.id : !cats.some(k => k.id === x.category));
  const opt = x => `<option value="${x.id}" ${x.id === e.productId ? 'selected' : ''}>${escapeHtml(x.name)}</option>`;
  const u = hasSizes(p) ? null : productUnit(p);
  openModal(`
    <div class="sheet-header">
      <h2>${e.i >= 0 ? 'Cambiar producto' : 'Agregar producto'}</h2>
      <button class="sheet-close" onclick="mdiLe=null; mdiOpen('${e.id}')">${icon('close')}</button>
    </div>

      <select id="mdiLeProd" onchange="mdiLeProduct(this.value)">
        ${cats.map(c => { const g = group(c); return g.length ? `<optgroup label="${escapeHtml(c.emoji + ' ' + c.name)}">${g.map(opt).join('')}</optgroup>` : ''; }).join('')}
        ${group(null).length ? `<optgroup label="Sin categoría">${group(null).map(opt).join('')}</optgroup>` : ''}
      </select>
    </div>
    ${hasSizes(p) ? `
      <div class="field">

          ${p.sizes.map(s => `<option value="${s.id}" ${s.id === e.sizeId ? 'selected' : ''}>${escapeHtml(s.label)} · ${formatMoney(s.price)}</option>`).join('')}
        </select>
      </div>` : ''}
    <div class="two-fields" style="margin-bottom:16px;">
      <div class="field">
        <label for="mdiLeQty">Cantidad${u && !u.plain ? ' (' + u.short + ')' : ''}</label>
        <input id="mdiLeQty" type="number" inputmode="decimal" min="0" step="${hasSizes(p) ? 1 : productStep(p)}" value="${e.qty}">
      </div>
      <div class="field">
        <label for="mdiLePrice">Precio ${u && !u.plain ? 'por ' + u.short : 'c/u'}</label>
        <input id="mdiLePrice" type="number" inputmode="decimal" min="0" step="0.5" value="${e.price}">
      </div>
    </div>

      <label for="mdiLeNote">Nota (opcional)</label>
      <input id="mdiLeNote" type="text" maxlength="160" value="${escapeHtml(e.note)}" placeholder="Ej. color azul, sin cebolla, talla M…">

    <div class="sheet-actions">
      ${e.i >= 0 ? `<button class="btn danger" onclick="mdiRemoveLine()">${icon('trash')}</button>` : ''}

      <button class="btn primary block" onclick="mdiSaveLine()">Guardar</button>
    </div>
  `, { dismissible:false });
}
function mdiLeKeep(){
  const q = document.getElementById('mdiLeQty'), pr = document.getElementById('mdiLePrice'), n = document.getElementById('mdiLeNote');
  if(q) mdiLe.qty = parseFloat(q.value) || mdiLe.qty;
  if(pr) mdiLe.price = parseFloat(pr.value);
  if(n) mdiLe.note = n.value;
}
function mdiLeProduct(pid){
  mdiLeKeep();
  const p = findProduct(pid); if(!p) return;
  const size = hasSizes(p) ? p.sizes[0] : null;
  mdiLe.productId = pid; mdiLe.sizeId = size ? size.id : null;
  mdiLe.price = size ? size.price : p.price;
  mdiLe.qty = hasSizes(p) ? Math.max(1, Math.round(mdiLe.qty)) : productStep(p);
  mdiRenderLineEditor();
}
function mdiLeSize(sid){
  mdiLeKeep();
  const p = findProduct(mdiLe.productId); const s = p && p.sizes.find(x => x.id === sid);
  if(s){ mdiLe.sizeId = s.id; mdiLe.price = s.price; }
  mdiRenderLineEditor();
}
function mdiSaveLine(){
  mdiLeKeep();
  const e = mdiLe; const p = findProduct(e.productId);
  if(!p){ toast('Elige un producto'); return; }
  if(!(e.qty > 0)){ toast('Escribe una cantidad mayor a 0'); return; }
  if(isNaN(e.price) || e.price < 0){ toast('Escribe un precio válido'); return; }
  const size = e.sizeId ? p.sizes.find(s => s.id === e.sizeId) : null;
  const line = mdiCleanLine({ productId:p.id, name:p.name, sizeId:size ? size.id : null, sizeLabel:size ? size.label : null,
    unit:size ? 'pieza' : (p.unit || 'pieza'), qty:size ? Math.round(e.qty) || 1 : e.qty, price:e.price, note:e.note });
  MDI.update(e.id, o => { if(e.i >= 0) o.lines[e.i] = line; else o.lines.push(line); });
  mdiLe = null;
  toast(e.i >= 0 ? 'Producto cambiado' : 'Producto agregado', { icon:icon('check'), variant:'toast-success' });
  mdiOpen(e.id);
}
function mdiRemoveLine(){
  const e = mdiLe;
  MDI.update(e.id, o => { o.lines.splice(e.i, 1); });
  mdiLe = null;
  mdiOpen(e.id);
}

/* ---------- Confirmar: entra a Historial y Ventas ---------- */
function mdiAttachUser(sale){
  if(typeof multiUser === 'function' && multiUser()){
    const me = activeUser(); const sh = currentShift();
    if(me){ sale.userId = me.id; sale.userName = me.name; sale.userRole = me.role; }
    if(sh) sale.shiftId = sh.id;
  }
  return sale;
}
function mdiConfirm(id){
  const o = MDI.get(id);
  if(!o || o.status !== 'nuevo') return;
  if(!o.lines.length){ toast('El pedido no tiene productos'); return; }
  const inventario = DB.getProducts();
  if(o.lines.some(l => !inventario.find(p => p.id === l.productId))){ toast('Hay productos que no están en tu catálogo', { variant:'toast-danger', icon:icon('alert') }); return; }
  const uso = stockUseByProduct(o.lines, inventario);
  const faltan = stockProblems(uso, inventario);
  if(faltan.length){
    vibrate(40);
    toast('No hay existencias suficientes', { icon:icon('alert'), variant:'toast-danger', subtitle:faltan[0], duration:3000 });
    return;
  }
  const t = mdTotals(o.lines);
  const sale = mdiAttachUser({
    id: 'v' + Date.now(),
    number: DB.nextSaleNumber(),
    date: new Date().toISOString(),
    items: o.lines.map(l => {
      const p = inventario.find(x => x.id === l.productId);
      const size = l.sizeId && p && p.sizes ? p.sizes.find(s => s.id === l.sizeId) : null;
      const factor = size && size.unitQty != null ? size.unitQty : 1;
      return {
        productId: l.productId,
        name: (p ? p.name : l.name) + (l.sizeLabel ? ' · ' + l.sizeLabel : ''),
        price: l.price,
        cost: (p && p.cost != null) ? round2(p.cost * factor) : null,
        qty: l.qty,
        sizeLabel: l.sizeLabel || null,
        unit: l.sizeLabel ? 'pieza' : (l.unit || 'pieza'),
        note: l.note || ''
      };
    }),
    subtotal: t.subtotal, iva: t.iva, total: t.total,
    serviceType: o.service || 'llevar',
    table: '',
    paymentMethod: o.payment || 'efectivo',
    cash: null, change: null,
    cancelled: false,
    origin: 'menu',
    menuOrderId: o.id,
    menuCode: o.code,
    customerName: (o.customer && o.customer.name) || '',
    orderedAt: o.createdAt,
    menuModified: mdiIsModified(o)
  });
  const sales = DB.getSales(); sales.push(sale); DB.saveSales(sales);
  const desc = deductStock(uso, inventario);
  if(desc.cambio) DB.saveProducts(inventario);
  MDI.update(id, x => { x.status = 'confirmado'; x.saleId = sale.id; x.decidedAt = new Date().toISOString(); x.decidedBy = sale.userName || ''; });
  vibrate([15, 60, 15]);
  toast('Pedido confirmado', { icon:icon('check'), variant:'toast-success', subtitle:'Venta ' + orderNumberLabel(sale.number) + ' · Historial y Ventas', duration:2600 });
  if(desc.alertas.length) setTimeout(() => toast(desc.alertas.length === 1 ? 'Te queda poco de un producto' : 'Te queda poco de ' + desc.alertas.length + ' productos', { icon:icon('alert'), variant:'toast-danger', subtitle: desc.alertas.map(a => a.name + ' (' + a.txt + ')').join(', ') }), 2700);
  mdiUI = { id, compare:false, text:'', result:null };
  mdiOpen(id);
  if(currentView === 'menu' || currentView === 'home') renderBgKeepModal();
  mdiPaintBadge();
}

function mdiOpenPaste(){

    </div>

function mdiImportPasted(){
  const text = (document.getElementById('mdiPasteText') || {}).value || '';
  const parsed = mdiParseMessage(text);
  let o = null;
  if(parsed.payload){ try{ o = mdiDecode(parsed.payload); }catch(e){ o = null; } }
  if(!o){
    if(!parsed.lines.length){ toast('No encontramos productos en ese mensaje', { icon:icon('alert'), variant:'toast-danger', subtitle:'Pega el mensaje completo del cliente' }); return; }
    const lines = mdiLinesFromParsed(parsed);
    const now = new Date().toISOString();
    o = { id:'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), code:parsed.code || mdiNewCode(), createdAt:now,
          customer:{ name:parsed.name || '' }, original:lines, lines:lines.map(l => Object.assign({}, l)), status:'nuevo', service:'llevar', payment:'efectivo' };
  }
  if(!o.waText) o.waText = String(text).replace(/\r/g, '').slice(0, 4000);
  const r = mdiReceive(o, 'pegado');
  if(r.isNew && parsed.lines.length){
    const diffs = mdiCompare(r.order, parsed);
    MDI.update(r.order.id, x => { x.waCheck = { at:new Date().toISOString(), ok:!diffs.length, n:diffs.length }; });
  }
  closeModal();
  mdiFilter = 'nuevo';
  if(currentView !== 'menu') goTo('menu'); else render();
  toast(r.isNew ? 'Pedido agregado' : 'Ese pedido ya estaba registrado', { icon:icon('check'), variant:'toast-success', subtitle:r.order.code });
  mdiOpen(r.order.id);
}

  const win = window.open(url, '_blank');

};

/* ---------- Estadísticas propias del Menú Digital ---------- */
function mdiStatsHTML(){
  const orders = MDI.all();
  const all = visibleSales();
  const menuSales = all.filter(s => saleIsMenu(s) && !s.cancelled);
  const totalSales = all.filter(s => !s.cancelled);
  const now = new Date();
  const sum = a => a.reduce((x, s) => x + s.total, 0);
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const head = `
    <h1 class="page-title">Ventas</h1>
    <p class="page-sub">Pedidos hechos en tu Menú Digital</p>
    ${statsOriginSegHTML()}`;
  if(!orders.length && !menuSales.length){
    return head + `
      <div class="empty-state">
        ${illustration('chartEmpty')}
        <div class="empty-title">Aún no hay pedidos del Menú Digital</div>
        <div class="empty-text">Cuando confirmes los pedidos que te lleguen por WhatsApp, aquí verás sus ventas, gráficas y estadísticas.</div>
      </div>
      <button class="btn primary block" onclick="goTo('menu')">${icon('menuBook')} Ir al Menú Digital</button>`;
  }
  const conf = orders.filter(o => o.status === 'confirmado');
  const rech = orders.filter(o => o.status === 'rechazado');
  const pend = orders.filter(o => o.status === 'nuevo');
  const decididos = conf.length + rech.length;
  const modificados = conf.filter(o => mdiIsModified(o)).length;
  const hoy = menuSales.filter(s => isSameDay(new Date(s.date), now));
  const semana = menuSales.filter(s => isSameWeek(new Date(s.date), now));
  const mes = menuSales.filter(s => isSameMonth(new Date(s.date), now));
  const ticket = menuSales.length ? sum(menuSales) / menuSales.length : 0;
  const share = pct(sum(menuSales), sum(totalSales));

  /* Pedidos por hora del día (todos los que llegaron) */
  const horas = new Array(24).fill(0);
  orders.forEach(o => { horas[new Date(o.createdAt).getHours()]++; });
  const conDatos = horas.map((n, h) => n ? h : -1).filter(h => h >= 0);
  const h0 = conDatos.length ? Math.max(0, Math.min(...conDatos) - 1) : 8;
  const h1 = conDatos.length ? Math.min(23, Math.max(...conDatos) + 1) : 22;
  const rango = []; for(let h = h0; h <= h1; h++) rango.push(h);
  const maxH = Math.max(1, ...rango.map(h => horas[h]));
  const pico = rango.reduce((a, h) => horas[h] > horas[a] ? h : a, rango[0]);
  const hLabel = h => (h % 12 || 12) + (h < 12 ? 'am' : 'pm');

  /* Productos más pedidos en el menú */
  const pm = {};
  menuSales.forEach(s => s.items.forEach(it => {
    const k = it.productId + '|' + (it.sizeLabel || '');
    if(!pm[k]) pm[k] = { name:it.name, qty:0, revenue:0, unit:it.unit };
    pm[k].qty += it.qty; pm[k].revenue += it.price * it.qty;
  }));
  const top = Object.values(pm).sort((a, b) => b.revenue - a.revenue).slice(0, 5);

  const motivos = {};
  rech.forEach(o => { const k = o.rejectReason || 'Sin motivo'; motivos[k] = (motivos[k] || 0) + 1; });
  const maxMot = Math.max(1, ...Object.values(motivos));

  return head + `
    <div class="stat-grid">
      <div class="stat-card md-stat">
        <div class="stat-label">Pedidos recibidos</div>
        <div class="stat-value">${orders.length}</div>
        <div class="stat-label" style="margin-top:4px;">${orders.filter(o => isSameDay(new Date(o.createdAt), now)).length} hoy</div>
      </div>
      <div class="stat-card md-stat">
        <div class="stat-label">Confirmados</div>
        <div class="stat-value" style="color:var(--success);">${conf.length}</div>
        <div class="stat-label" style="margin-top:4px;">${pct(conf.length, decididos)}% de los revisados</div>
      </div>
      <div class="stat-card md-stat">
        <div class="stat-label">Rechazados</div>
        <div class="stat-value" style="color:var(--accent-2);">${rech.length}</div>
        <div class="stat-label" style="margin-top:4px;">${pct(rech.length, decididos)}% de los revisados</div>
      </div>
      <div class="stat-card md-stat">
        <div class="stat-label">Por revisar</div>
        <div class="stat-value">${pend.length}</div>
        <div class="stat-label" style="margin-top:4px;">${pend.length ? '<a href="#" onclick="event.preventDefault(); mdiFilter=\'nuevo\'; goTo(\'menu\'); setTimeout(() => { const s = document.getElementById(\'mdiSection\'); if(s) s.scrollIntoView({ block:\'start\' }); }, 60);">Revisar ahora →</a>' : 'Todo al día'}</div>
      </div>
    </div>

    <div class="section-title">Ventas del Menú Digital</div>
    <div class="stat-grid">
      <div class="stat-card md-stat"><div class="stat-label">Hoy</div><div class="stat-value">${formatMoney(sum(hoy))}</div><div class="stat-label" style="margin-top:4px;">${hoy.length} pedido${hoy.length === 1 ? '' : 's'}</div></div>
      <div class="stat-card md-stat"><div class="stat-label">Esta semana</div><div class="stat-value">${formatMoney(sum(semana))}</div><div class="stat-label" style="margin-top:4px;">${semana.length} pedido${semana.length === 1 ? '' : 's'}</div></div>
      <div class="stat-card md-stat"><div class="stat-label">Este mes</div><div class="stat-value">${formatMoney(sum(mes))}</div><div class="stat-label" style="margin-top:4px;">${mes.length} pedido${mes.length === 1 ? '' : 's'}</div></div>
      <div class="stat-card md-stat"><div class="stat-label">Ticket promedio</div><div class="stat-value">${formatMoney(ticket)}</div><div class="stat-label" style="margin-top:4px;">${menuSales.length} en total</div></div>
      <div class="stat-card wide md-stat">
        <div style="flex:1; min-width:0;">
          <div class="stat-label">Parte de tus ventas que llega por el Menú Digital</div>
          <div class="stat-value">${share}%</div>
          <div class="bar-track" style="margin-top:10px;"><div class="bar-fill" style="width:${share}%; background:var(--sec-menu);"></div></div>
          <div class="stat-label" style="margin-top:6px;">${formatMoney(sum(menuSales))} de ${formatMoney(sum(totalSales))} vendidos en total</div>
        </div>
      </div>
    </div>

    <div class="section-title">Gráficas del Menú Digital</div>
    <div id="statsCharts" class="md-charts">${statsChartsHTML()}</div>

    <div class="section-title">¿A qué hora piden?</div>
    <div class="card">
      <div class="chart-head">
        <div><div class="chart-title">Pedidos por hora</div><div class="chart-sub">Todos los pedidos recibidos</div></div>
        <div class="chart-value" style="font-size:16px;">${conDatos.length ? 'Más a las ' + hLabel(pico) : '—'}</div>
      </div>
      <div class="chart-plot">
        ${rango.map(h => `<div class="chart-col ${h === pico && horas[h] ? 'sel' : ''}" title="${hLabel(h)}: ${horas[h]} pedido${horas[h] === 1 ? '' : 's'}"><span class="vbar md ${horas[h] ? '' : 'zero'}" style="${horas[h] ? 'height:' + Math.max(horas[h] / maxH * 100, 5) + '%' : ''}"></span></div>`).join('')}
      </div>
      <div class="chart-x">${rango.map(h => `<span class="${h === pico ? 'sel' : ''}">${(h - h0) % (rango.length > 12 ? 2 : 1) === 0 ? hLabel(h) : ''}</span>`).join('')}</div>
    </div>

    <div class="section-title">Cómo se resuelven los pedidos</div>
    <div class="card">
      ${[['✅ Confirmados', conf.length, 'var(--success)'], ['✏️ Confirmados con cambios', modificados, 'var(--sec-menu)'], ['❌ Rechazados', rech.length, 'var(--accent-2)'], ['⏳ Por revisar', pend.length, 'var(--ink-faint)']].map(r => `
        <div class="bar-row">
          <div class="bar-row-top"><span>${r[0]}</span><span class="bv">${r[1]} · ${pct(r[1], orders.length)}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct(r[1], orders.length)}%; background:${r[2]};"></div></div>
        </div>`).join('')}
    </div>

    ${top.length ? `
      <div class="section-title">Lo más pedido en el Menú Digital</div>
      <div class="card">
        ${top.map((p, i) => `
          <div class="top-product-row">
            <div class="top-product-rank">${i + 1}</div>
            <div class="top-product-name">${escapeHtml(p.name)}<div class="top-product-qty">${escapeHtml(p.unit && !unitOf(p.unit).plain ? fmtQty(p.qty, p.unit) : fmtNum(p.qty))} pedidos</div></div>
            <div class="top-product-rev">${formatMoney(p.revenue)}</div>
          </div>`).join('')}
      </div>` : ''}

    ${rech.length ? `
      <div class="section-title">Motivos de rechazo</div>
      <div class="card">
        ${Object.entries(motivos).sort((a, b) => b[1] - a[1]).map(([k, v]) => `
          <div class="bar-row">
            <div class="bar-row-top"><span>${escapeHtml(k)}</span><span class="bv">${v}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${v / maxMot * 100}%; background:var(--accent-2);"></div></div>
          </div>`).join('')}
      </div>` : ''}

    <button class="btn ghost block" style="margin-top:18px;" onclick="mdiFilter='todos'; goTo('menu'); setTimeout(() => { const s = document.getElementById('mdiSection'); if(s) s.scrollIntoView({ block:'start' }); }, 60);">${icon('inbox')} Ver pedidos entrantes</button>
  `;
}

/* =========================================================
   8. COBRAR: TICKET O COTIZACIÓN
   -------------------------------------------------------------
   · Negocio de productos: al cobrar sale el ticket de siempre.
   · Servicios, o productos y servicios: al tocar "Cobrar" se elige
       🧾 Ticket      → se cobra y sale el ticket.
       📋 Cotización  → NO se cobra ni descuenta existencias: se
                        guarda un presupuesto para el cliente, que
                        después se puede cobrar desde Historial.
========================================================= */
const QUOTES_KEY = 'mesa_quotes';
const QUOTE_COUNTER_KEY = 'mesa_quote_counter';
const QUOTE_VIGENCIAS = [7, 15, 30];
const QT = {
  all(){ try{ const l = JSON.parse(localStorage.getItem(QUOTES_KEY) || '[]'); return Array.isArray(l) ? l : []; }catch(e){ return []; } },
  save(list){ try{ localStorage.setItem(QUOTES_KEY, JSON.stringify(list)); }catch(e){ toast('No se pudo guardar la cotización', { variant:'toast-danger', icon:icon('alert') }); } },
  get(id){ return QT.all().find(q => q.id === id) || null; },
  update(id, fn){ const l = QT.all(); const q = l.find(x => x.id === id); if(!q) return null; fn(q); QT.save(l); return q; }
};
function quoteFolio(n){ return quotePrefs().prefix + String(n).padStart(4, '0'); }
function quoteCounter(){ return parseInt(localStorage.getItem(QUOTE_COUNTER_KEY) || '0', 10) || 0; }
function quoteNextNumber(){
  const n = quoteCounter() + 1;
  try{ localStorage.setItem(QUOTE_COUNTER_KEY, String(n)); }catch(e){}
  return n;
}
function quoteValidUntil(q){ const d = new Date(q.date); d.setDate(d.getDate() + (q.validDays || 15)); return d; }

/* ---------- Cómo se ve la cotización (Mi cuenta › Preferencias › Editar cotización) ---------- */
const QUOTE_PREFS_KEY = 'mesa_quote_prefs';
const QUOTE_LEGAL_DEFAULT = 'Precios sujetos a cambio sin previo aviso después de la fecha de vigencia. Esta cotización no es un comprobante de pago.';
const QUOTE_THANKS_DEFAULT = '¡Gracias por su preferencia!';
const QUOTE_COLORS = [
  { hex:'#4F46E5', name:'Índigo' },  { hex:'#2563EB', name:'Azul' },  { hex:'#0E9384', name:'Turquesa' },
  { hex:'#16A34A', name:'Verde' },   { hex:'#DC2626', name:'Rojo' },  { hex:'#EA580C', name:'Naranja' },
  { hex:'#DB2777', name:'Rosa' },    { hex:'#7C3AED', name:'Morado' },{ hex:'#8B5E3C', name:'Café' },
  { hex:'#1F2937', name:'Negro' },
];
/* El título cambia también las etiquetas del documento */
const QUOTE_TITLES = {
  cotizacion:  { word:'COTIZACIÓN',  name:'Cotización',  para:'Cotización para',  datos:'Datos de la cotización', otra:'Presupuesto' },
  presupuesto: { word:'PRESUPUESTO', name:'Presupuesto', para:'Presupuesto para', datos:'Datos del presupuesto',  otra:'Cotización' },
};
function quoteDefaultPrefs(){
  return {
    color:null,               /* null = el de la app (o el de tu Menú Digital) */
    title:'cotizacion',
    prefix:'C-',
    validDays:15,
    notes:'',                 /* notas que ya vienen escritas en cada cotización nueva */
    thanks:QUOTE_THANKS_DEFAULT,
    legal:QUOTE_LEGAL_DEFAULT,
    email:'',
    showLogo:true, showLetra:true, showIva:true, showSign:false,
    signName:''
  };
}
function quotePrefs(){
  let c = {};
  try{ c = JSON.parse(localStorage.getItem(QUOTE_PREFS_KEY) || '{}') || {}; }catch(e){ c = {}; }
  const p = Object.assign(quoteDefaultPrefs(), c);
  if(!QUOTE_TITLES[p.title]) p.title = 'cotizacion';
  if(QUOTE_VIGENCIAS.indexOf(p.validDays) < 0) p.validDays = 15;
  p.prefix = String(p.prefix == null ? 'C-' : p.prefix);
  return p;
}
function saveQuotePrefs(p){
  try{ localStorage.setItem(QUOTE_PREFS_KEY, JSON.stringify(p)); }
  catch(e){ toast('No se pudo guardar', { variant:'toast-danger', icon:icon('alert') }); }
}
function quoteTitle(){ return QUOTE_TITLES[quotePrefs().title]; }
function quoteStatus(q){
  if(q.status === 'vendida') return { id:'vendida', label:'Cobrada', cls:'ok' };
  if(quoteValidUntil(q) < new Date()) return { id:'vencida', label:'Vencida', cls:'no' };
  return { id:'pendiente', label:'Pendiente', cls:'nuevo' };
}

/* ---------- Al tocar "Cobrar" ---------- */
let quoteToCharge = null;   // cotización que se está cobrando desde Historial
function muRealCobro(){
  const antes = DB.getSales().length;
  _muConfirmarCobro();
  const sales = DB.getSales();
  if(sales.length > antes){
    const sale = sales[sales.length - 1];
    sale.origin = sale.origin || 'caja';
    const q = quoteToCharge ? QT.get(quoteToCharge) : null;
    if(q && q.items.every(it => sale.items.some(si => si.productId === it.productId))){
      sale.quoteId = q.id; sale.quoteFolio = q.folio;
      if(q.customer && q.customer.name) sale.customerName = q.customer.name;
      QT.update(q.id, x => { x.status = 'vendida'; x.saleId = sale.id; x.soldAt = sale.date; });
    }
    quoteToCharge = null;
    DB.saveSales(sales);
    lastTicketSale = sale;
    /* El ticket ya estaba pintado: se repinta para que diga de qué cotización viene */
    const tp = document.getElementById('ticket-print');
    if(tp && sale.quoteFolio) tp.innerHTML = ticketHTML(sale);
    /* El carrito ya quedó vacío: la pantalla de atrás también */
    if(currentView === 'sale') renderBgKeepModal();
  }
}

/* Cobrar: los productos de la cotización pasan al carrito */
function chargeQuote(id){
  const q = QT.get(id); if(!q) return;
  const prods = DB.getProducts();
  const faltan = q.items.filter(it => !prods.some(p => p.id === it.productId));
  if(faltan.length){ toast('Hay productos que ya no están en tu catálogo', { icon:icon('alert'), variant:'toast-danger', subtitle:faltan.map(f => f.baseName || f.name).join(', ') }); return; }
  if(cart.length && !window.confirm('Tu carrito tiene productos. ¿Cambiarlos por los de la cotización ' + q.folio + '?')) return;
  cart = q.items.map(it => {
    const line = { productId:it.productId, qty:it.qty };
    if(it.sizeId){ line.sizeId = it.sizeId; line.sizeLabel = it.sizeLabel; }
    line.unitPrice = it.price;   /* se respeta el precio que se cotizó */
    return line;
  });
  quoteToCharge = q.id;
  closeModal();
  goTo('sale');
  openCartSheet('checkout');
  toast('Cobrando la cotización ' + q.folio, { icon:icon('check'), variant:'toast-success toast-top', subtitle:formatMoney(q.total) });
}

  const q = QT.get(id); if(!q) return;
  if(!window.confirm('¿Eliminar la cotización ' + q.folio + '? No se puede deshacer.')) return;
  QT.save(QT.all().filter(x => x.id !== id));
  closeModal(); render();
  toast('Cotización eliminada');
}

/* ---------- Importe con letra ---------- */
function numLetras(n){
  const U = ['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
  const D = ['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const C = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  const dec = x => x < 30 ? U[x] : D[Math.floor(x / 10)] + (x % 10 ? ' Y ' + U[x % 10] : '');
  const cen = x => x === 100 ? 'CIEN' : (C[Math.floor(x / 100)] + (x % 100 ? ' ' + dec(x % 100) : '')).trim();
  const apocope = s => s.replace(/VEINTIUNO$/, 'VEINTIÚN').replace(/UNO$/, 'UN');
  const miles = x => { if(x < 1000) return cen(x); const m = Math.floor(x / 1000), r = x % 1000; return ((m === 1 ? 'MIL' : apocope(cen(m)) + ' MIL') + (r ? ' ' + cen(r) : '')).trim(); };
  const millones = x => { if(x < 1e6) return miles(x); const m = Math.floor(x / 1e6), r = x % 1e6; return ((m === 1 ? 'UN MILLÓN' : apocope(miles(m)) + ' MILLONES') + (r ? ' ' + miles(r) : '')).trim(); };
  return n === 0 ? 'CERO' : millones(n);
}
function totalConLetra(x){
  const v = round2(x);
  const ent = Math.floor(v);
  const cts = Math.round((v - ent) * 100);
  let t = numLetras(ent);
  t = t.replace(/VEINTIUNO$/, 'VEINTIÚN').replace(/UNO$/, 'UN');
  const de = /(MILLÓN|MILLONES)$/.test(t) ? ' DE' : '';
  return t + de + (ent === 1 ? ' PESO ' : ' PESOS ') + String(cts).padStart(2, '0') + '/100 M.N.';
}

/* En el celular la vista previa queda arriba: este botón te regresa a ella */
function qePeek(){
  const box = document.getElementById('invPreview'), sh = document.querySelector('#modal-layer .modal-sheet');
  if(box && sh) sh.scrollTo({ top:Math.max(0, sh.scrollTop + box.getBoundingClientRect().top - sh.getBoundingClientRect().top - 16), behavior:'smooth' });
}
function updateQuoteEditorPreview(){
  const sc = document.getElementById('invScale'); if(!sc) return;

}

/* ---------- Editar una cotización que ya hiciste ---------- */
let quoteEditId = null, quoteEditDraft = null;
function openQuoteEdit(id){
  const q = QT.get(id); if(!q) return;
  quoteEditId = id;
  quoteEditDraft = {
    name:q.customer.name || '', phone:q.customer.phone || '', validDays:q.validDays || 15, notes:q.notes || '',
    renew: quoteStatus(q).id === 'vencida',
    items:q.items.map(it => Object.assign({}, it))
  };
  renderQuoteEdit(false);
}
function quoteEditTotals(){
  const sub = round2(quoteEditDraft.items.reduce((a, it) => a + it.price * it.qty, 0));
  const iva = round2(sub * IVA_RATE);
  return { subtotal:sub, iva, total:round2(sub + iva) };
}
function quoteEditPlain(it){ return !!it.sizeLabel || !it.unit || unitOf(it.unit).plain; }
function quoteEditFrac(it){ return !quoteEditPlain(it) && !!unitOf(it.unit).frac; }
function renderQuoteEdit(keep){
  const q = QT.get(quoteEditId), d = quoteEditDraft;
  if(!q || !d) return;
  const t = quoteEditTotals();
  muSheet(`
    <div class="sheet-header">
      <div class="sheet-header-left" style="min-width:0;">
        <button class="sheet-back" onclick="quoteEditKeep(); openQuote('${q.id}')" aria-label="Volver">${icon('chevronLeft')}</button>
        <h2>Editar ${escapeHtml(q.folio)}</h2>
      </div>
      <button class="sheet-close" onclick="closeModal(); render();" aria-label="Cerrar">${icon('close')}</button>
    </div>

    <div class="section-title" style="margin-top:0;">Productos</div>
    <div class="qe-items">
      ${d.items.map((it, i) => `
        <div class="qe-item">
          <div class="qe-item-top">
            <span class="qe-item-name">${escapeHtml(it.name.replace(/\s*\(EJEMPLO[^)]*\)/, ''))}</span>
            <button type="button" class="qe-del" onclick="quoteEditKeep(); quoteEditRemove(${i})" aria-label="Quitar">${icon('trash')}</button>
          </div>
          <div class="qe-item-row">
            <label><span>Cantidad${quoteEditPlain(it) ? '' : ' (' + escapeHtml(unitOf(it.unit).short || it.unit) + ')'}</span>
              <input type="number" inputmode="decimal" min="0" step="${quoteEditFrac(it) ? 'any' : 1}" value="${it.qty}" oninput="quoteEditLine(${i}, 'qty', this.value)"></label>
            <label><span>Precio</span>
              <input type="number" inputmode="decimal" min="0" step="0.01" value="${it.price}" oninput="quoteEditLine(${i}, 'price', this.value)"></label>
            <b id="qeLine${i}">${formatMoney(it.price * it.qty)}</b>
          </div>
        </div>`).join('')}
      <div class="q-item total"><span>Total con IVA</span><b id="qeTotal">${formatMoney(t.total)}</b></div>
    </div>

    <div class="field">
      <label for="qeName">Cliente</label>
      <input id="qeName" type="text" maxlength="80" value="${escapeHtml(d.name)}" placeholder="Nombre del cliente o empresa">
    </div>
    <div class="field">
      <label for="qePhone">WhatsApp del cliente (opcional)</label>
      <input id="qePhone" type="tel" inputmode="numeric" maxlength="16" value="${escapeHtml(d.phone)}" placeholder="Para mandarle la cotización">
    </div>
    <div class="field">
      <label>Vigencia</label>
      <div class="seg qe-seg" style="margin-bottom:0;">
        ${QUOTE_VIGENCIAS.map(v => `<button class="${d.validDays === v ? 'active' : ''}" onclick="quoteEditKeep(); quoteEditDraft.validDays=${v}; renderQuoteEdit(true);">${v} días</button>`).join('')}
      </div>
    </div>
    <div class="toggle-row qe-renew">
      <span class="acc-ico blue">${icon('clock')}</span>
      <span class="acc-txt"><span class="acc-label">Poner la fecha de hoy</span><span class="acc-sub">La vigencia empieza a contar desde hoy.</span></span>
      <label class="switch"><input id="qeRenew" type="checkbox" ${d.renew ? 'checked' : ''}><span class="track"></span></label>
    </div>
    <div class="field">
      <label for="qeNotesEdit">Notas (opcional)</label>
      <textarea id="qeNotesEdit" class="md-textarea" rows="3" maxlength="400">${escapeHtml(d.notes)}</textarea>
    </div>

    <div class="sheet-actions">
      <button class="btn ghost block" onclick="openQuote('${q.id}')">Cancelar</button>
      <button class="btn primary block" onclick="saveQuoteEdit()">Guardar cambios</button>
    </div>
  `, { dismissible:false, keep:keep }, '');
}
function quoteEditLine(i, key, val){
  const it = quoteEditDraft && quoteEditDraft.items[i]; if(!it) return;
  const n = parseFloat(String(val).replace(',', '.'));
  it[key] = (isFinite(n) && n >= 0) ? n : 0;
  const l = document.getElementById('qeLine' + i); if(l) l.textContent = formatMoney(it.price * it.qty);
  const t = document.getElementById('qeTotal'); if(t) t.textContent = formatMoney(quoteEditTotals().total);
}
function quoteEditRemove(i){
  if(quoteEditDraft.items.length <= 1){ toast('La cotización necesita al menos un producto', { icon:icon('alert') }); return; }
  quoteEditDraft.items.splice(i, 1);
  vibrate(8);
  renderQuoteEdit(true);
}
function quoteEditKeep(){
  const d = quoteEditDraft; if(!d) return;
  const v = id => { const el = document.getElementById(id); return el ? el.value : null; };
  const n = v('qeName'), ph = v('qePhone'), no = v('qeNotesEdit');
  if(n !== null) d.name = n;
  if(ph !== null) d.phone = ph;
  if(no !== null) d.notes = no;
  const r = document.getElementById('qeRenew'); if(r) d.renew = r.checked;
}
function saveQuoteEdit(){
  quoteEditKeep();
  const d = quoteEditDraft;
  if(d.items.some(it => !(it.qty > 0))){ toast('Pon una cantidad mayor a 0', { icon:icon('alert'), subtitle:'O quita ese producto con el bote de basura' }); return; }
  const t = quoteEditTotals();
  const q = QT.update(quoteEditId, x => {
    x.customer = { name:d.name.trim().slice(0, 80), phone:d.phone.replace(/\D/g, '').slice(0, 15) };
    x.notes = d.notes.trim().slice(0, 400);
    x.validDays = d.validDays;
    x.items = d.items.map(it => Object.assign({}, it, { qty:r3(it.qty), price:round2(it.price) }));
    x.subtotal = t.subtotal; x.iva = t.iva; x.total = t.total;
    x.editedAt = new Date().toISOString();
    if(d.renew){ x.createdAt = x.createdAt || x.date; x.date = x.editedAt; }
  });
  quoteEditDraft = null;
  if(!q){ closeModal(); render(); return; }
  vibrate([15, 50, 15]);
  openQuote(q.id);
  toast('Cambios guardados', { icon:icon('check'), variant:'toast-success', subtitle:q.folio + ' · ' + formatMoney(q.total) });
  if(currentView === 'history') renderBgKeepModal();
}

/* Si se sale sin cobrar la cotización, deja de estar "en cobro" */
const _muAfterSaleClosed = afterSaleClosed;
afterSaleClosed = function(){ quoteToCharge = null; _muAfterSaleClosed(); };

/* =========================================================
   9. HISTORIAL › COTIZACIONES
========================================================= */
let historyMode = 'ventas';   // ventas | cotizaciones
function setHistoryMode(m){ historyMode = m; vibrate(8); render(); }
function quotesVisible(){ return docMode() !== 'ticket' || QT.all().length > 0; }
const _muRenderHistoryShell2 = renderHistoryShell;
renderHistoryShell = function(){
  let html = _muRenderHistoryShell2();
  if(!quotesVisible()){ historyMode = 'ventas'; return html; }
  const qs = QT.all();
  const pend = qs.filter(q => quoteStatus(q).id === 'pendiente').length;
  const seg = `<div class="seg hist-seg" role="tablist">
      <button role="tab" class="${historyMode === 'ventas' ? 'active' : ''}" onclick="setHistoryMode('ventas')">${icon('receipt')} Ventas</button>
      <button role="tab" class="${historyMode === 'cotizaciones' ? 'active' : ''}" onclick="setHistoryMode('cotizaciones')">📋 Cotizaciones${pend ? ` <span class="seg-count">${pend}</span>` : ''}</button>
    </div>`;
  html = html.replace(/(<p class="page-sub">[\s\S]*?<\/p>)/, '$1' + seg);
  if(historyMode !== 'cotizaciones') return html;
  let head = html.slice(0, html.indexOf(seg) + seg.length);
  head = head.replace(/(<p class="page-sub">)[\s\S]*?(<\/p>)/, '$1Presupuestos que les diste a tus clientes$2');
  return head + quotesListHTML(qs);
};
function quotesListHTML(qs){
  const lista = qs.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  if(!lista.length){
    return `<div class="empty-state">
      ${illustration('docsEmpty')}
      <div class="empty-title">Aún no hay cotizaciones</div>
      <div class="empty-text">Agrega productos en Nueva venta, toca Cobrar y elige Cotización. No se cobra: es un presupuesto para tu cliente.</div>
    </div>`;
  }
  return lista.map(q => {
    const st = quoteStatus(q);
    const hasta = quoteValidUntil(q).toLocaleDateString('es-MX', { day:'numeric', month:'short' });
    return `<button class="sale-row ${st.id === 'vencida' ? 'cancelled' : ''}" onclick="openQuote('${q.id}')">
      <div class="sale-row-badge q">📋</div>
      <div class="sale-row-main">
        <div class="sale-row-num">${escapeHtml(q.folio)} <span class="mdi-pill ${st.cls}">${st.label}</span></div>
        <div class="sale-row-who">${escapeHtml(q.customer.name || 'Cliente sin nombre')}</div>
        <div class="sale-row-meta">${formatDateTime(q.date)} · ${st.id === 'vendida' ? 'cobrada' : 'válida hasta ' + hasta}</div>
      </div>
      <div class="sale-row-right"><div class="sale-row-total">${formatMoney(q.total)}</div></div>
    </button>`;
  }).join('');
}

/* Pantalla de bienvenida con la marca nueva */
const _muAuthWelcomeHTML = authWelcomeHTML;
authWelcomeHTML = function(){
  return _muAuthWelcomeHTML().replace('<div class="auth-hero">', `<div class="auth-hero"><div class="auth-brand"><span class="auth-brand-mark">${ICONS.logo}</span><span><b>${APP_NAME}</b><small>Punto de venta para cualquier negocio</small></span></div>`);
};

/* =========================================================
   10. ARRANQUE: menú del cliente, pedido que llega por link o la app
========================================================= */
let mdiPendingOpen = null;
const _muHideAuth = hideAuth;
hideAuth = function(){
  _muHideAuth();
  applyGiroLabels();
  if(mdiPendingOpen){ const fn = mdiPendingOpen; mdiPendingOpen = null; setTimeout(fn, 250); }
};

/* Si el negocio nunca tocó los productos de ejemplo de restaurante
   (hotcakes y malteadas), se cambian por ejemplos para cualquier giro. */
function muMigrateDemo(){
  try{
    const ps = JSON.parse(localStorage.getItem('mesa_products') || 'null');
    const cs = JSON.parse(localStorage.getItem('mesa_categories') || 'null');
    if(!Array.isArray(ps) || !ps.length || !Array.isArray(cs) || !cs.length) return;
    const soloEjemplos = ps.every(p => p.demo && /^demo[1-4]$/.test(p.id) && /Hotcakes|Malteada/.test(p.name));
    const catsEjemplo = cs.every(c => c.demo && (c.id === 'hotcakes' || c.id === 'malteadas'));
    if(!soloEjemplos || !catsEjemplo) return;
    localStorage.setItem('mesa_products', JSON.stringify(defaultProducts()));
    localStorage.setItem('mesa_categories', JSON.stringify(defaultCategories()));
  }catch(e){}
}

(function(){
  applyGiroLabels();
  muMigrateDemo();
  const route = dmRoute();
  if(route){ bootMenu(route); return; }

  /* Link "registrar en caja" que viene en el mensaje de WhatsApp */
  let llegado = null, malo = false;
  const m = location.hash.match(/^#pedido\/([A-Za-z0-9_-]+)/);
  if(m){
    try{ llegado = mdiReceive(mdiDecode(m[1]), 'link'); }catch(e){ malo = true; }
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ location.hash = ''; }
  }

  bootApp();
  mdiWatch();
  mdiPaintBadge();
  /* "hace 5 min" se mantiene al día */
  setInterval(() => { if(currentView === 'menu' && !document.querySelector('#modal-layer .modal-sheet')){ const y = window.scrollY; render(); window.scrollTo(0, y); } }, 60000);

  if(malo) setTimeout(() => toast('Ese link de pedido no es válido', { icon:icon('alert'), variant:'toast-danger', subtitle:'Pide al cliente que lo reenvíe o pega su mensaje' }), 400);
  if(llegado){
    const abrir = () => {
      mdiFilter = 'nuevo';
      goTo('menu');
      mdiOpen(llegado.order.id);
      toast(llegado.isNew ? 'Pedido ' + llegado.order.code + ' registrado' : 'Este pedido ya estaba registrado', { icon:icon('inbox'), variant:'toast-success toast-top', subtitle:'Revísalo y confírmalo o recházalo' });
    };
    if(document.body.classList.contains('auth-open')) mdiPendingOpen = abrir;
    else setTimeout(abrir, 60);
  }
})();
