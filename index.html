<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mesa · Punto de venta</title>
<style>
  :root{
    --bg:#F4F6FB;
    --surface:#FFFFFF;
    --surface-alt:#F0F2F8;
    --surface-soft:#FFF4D9;
    --ink:#16213E;
    --ink-soft:#8A93AC;
    --ink-faint:#C9CEDD;
    --accent:#FFD666;
    --accent-strong:#F5BF3C;
    --accent-soft:#FFF0C2;
    --accent-ink:#16213E;
    --accent-2:#E1594C;
    --success:#33A873;
    --success-bg:#E7F7EF;
    --whatsapp:#25D366;
    --whatsapp-ink:#075E24;
    --danger-bg:#FBEAE8;
    --border:#E8EBF2;
    --nav-bg:#FFFFFF;
    --nav-ink:#A2A9BC;
    --nav-active-bg:#FFD666;
    /* Identidad de color por sección del menú inferior */
    --sec-home:#25D366;
    --sec-home-soft:#E5FAEC;
    --sec-home-ink:#0E7A3D;
    --sec-sale:#25D366;
    --sec-sale-soft:#E5FAEC;
    --sec-sale-ink:#0E7A3D;
    --sec-history:#2E7DC0;
    --sec-history-soft:#E7F2FB;
    --sec-history-ink:#1D5D8F;
    --sec-stats:#6C4FCB;
    --sec-stats-soft:#EFEAFB;
    --sec-stats-ink:#4B3593;
    --sec-products:#C9A876;
    --sec-products-soft:#F7EFE1;
    --sec-products-ink:#7A5A32;
    --radius-card:16px;
    --radius-btn:12px;
    --radius-chip:999px;
    --radius-sheet:24px;
    --shadow-card:0 2px 14px rgba(22,33,62,0.06);
    --shadow-sheet:0 -10px 30px rgba(22,33,62,0.16);
    --shadow-pop:0 10px 26px rgba(22,33,62,0.14);
    --mono: 'SFMono-Regular', ui-monospace, 'Courier New', Courier, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  button, input, select{ font-family:inherit; }
  button{cursor:pointer;}
  :focus-visible{ outline:2px solid var(--accent-strong); outline-offset:2px; }
  svg{ display:block; }

  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px;
    background:var(--bg);
  }
  .brand{display:flex; align-items:center; gap:11px;}
  .brand-mark{
    width:42px; height:42px; border-radius:13px;
    background:var(--sec-home);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(37,211,102,0.35);
    transition:background .2s ease, box-shadow .2s ease;
  }
  .brand-mark svg{ width:21px; height:21px; }
  .brand-name{ font-size:21px; font-weight:800; letter-spacing:0.1px; color:var(--ink); }
  .topbar-clock{ font-family:var(--sans); font-weight:600; font-size:13px; color:var(--ink-soft); text-align:right; line-height:1.35; }

  /* ---------- Main view ---------- */
  .view{
    flex:1;
    overflow-y:auto;
    padding:6px 18px 110px;
  }
  .view::-webkit-scrollbar{ width:0; }

  h1.page-title{ font-size:24px; margin:6px 0 3px; font-weight:800; color:var(--ink); letter-spacing:-0.2px; display:flex; align-items:center; gap:10px; }
  h1.page-title::before{ content:''; display:block; width:5px; height:22px; border-radius:3px; background:var(--ink-faint); flex-shrink:0; }
  p.page-sub{ font-size:14px; color:var(--ink-soft); margin:0 0 20px; font-weight:500; }

  /* ---------- Identidad visual por sección (encabezado, acentos, íconos) ---------- */
  body[data-section="home"] h1.page-title::before{ background:var(--sec-home); }
  body[data-section="sale"] h1.page-title::before{ background:var(--sec-sale); }
  body[data-section="history"] h1.page-title::before{ background:var(--sec-history); }
  body[data-section="stats"] h1.page-title::before{ background:var(--sec-stats); }
  body[data-section="products"] h1.page-title::before{ background:var(--sec-products); }

  body[data-section="home"] #view .section-title::before{ background:var(--sec-home); }
  body[data-section="sale"] #view .section-title::before{ background:var(--sec-sale); }
  body[data-section="history"] #view .section-title::before{ background:var(--sec-history); }
  body[data-section="stats"] #view .section-title::before{ background:var(--sec-stats); }
  body[data-section="products"] #view .section-title::before{ background:var(--sec-products); }

  body[data-section="stats"] #view .stat-card,
  body[data-section="stats"] #view .card{ border-top:3px solid var(--sec-stats); }
  body[data-section="home"] #view .stat-icon{ background:var(--sec-home-soft); }
  body[data-section="history"] #view .card{ border-top:3px solid var(--sec-history); }
  body[data-section="products"] #view .prod-row{ border-left:3px solid var(--sec-products); }

  body[data-section="history"] #view .search-box svg{ color:var(--sec-history); }
  body[data-section="history"] .filter-chip.active:not(.is-danger){
    background:var(--sec-history); color:#fff; box-shadow:0 4px 10px rgba(46,125,192,0.3);
  }

  body[data-section="sale"] .btn.primary{ background:var(--sec-sale); color:#fff; }
  body[data-section="sale"] .opt-card.active{ border-color:var(--sec-sale); background:var(--sec-sale-soft); color:var(--ink); }

  body[data-section="products"] .btn.primary{ background:var(--sec-products); color:var(--ink); }
  body[data-section="products"] .btn.ghost{ border-color:var(--sec-products); color:var(--sec-products-ink); }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:sticky; bottom:0; z-index:20;
    display:flex;
    background:var(--nav-bg);
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -1px 0 var(--border), 0 -8px 24px rgba(22,33,62,0.05);
  }
  .navbtn{
    flex:1;
    background:none; border:none;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 4px;
    color:var(--ink-soft);
    border-radius:14px;
    transition:background .15s ease, color .15s ease;
  }
  .navbtn .navicon{ width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
  .navbtn .navicon svg{ width:22px; height:22px; }
  .navbtn span:last-child{ font-size:11px; font-weight:700; letter-spacing:.1px; }
  .navbtn.active{ color:var(--ink); background:var(--nav-active-bg); }
  .navbtn.active[data-view="home"]{ background:var(--sec-home-soft); color:var(--sec-home-ink); }
  .navbtn.active[data-view="sale"]{ background:var(--sec-sale-soft); color:var(--sec-sale-ink); }
  .navbtn.active[data-view="history"]{ background:var(--sec-history-soft); color:var(--sec-history-ink); }
  .navbtn.active[data-view="stats"]{ background:var(--sec-stats-soft); color:var(--sec-stats-ink); }
  .navbtn.active[data-view="products"]{ background:var(--sec-products-soft); color:var(--sec-products-ink); }
  .navbtn:active{ transform:scale(0.95); }
  .navbtn[data-view="account"]{ display:none; }
  .navbtn.active[data-view="account"]{ background:var(--accent-soft); color:#8A6A18; }

  /* ---------- Cards / generic ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:18px;
    box-shadow:var(--shadow-card);
  }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:16px 16px 15px; box-shadow:var(--shadow-card); position:relative; overflow:hidden;
  }
  .stat-icon{
    width:36px; height:36px; border-radius:11px; background:var(--surface-soft);
    display:flex; align-items:center; justify-content:center; margin-bottom:10px;
  }
  .stat-icon svg{ width:18px; height:18px; }
  .stat-card .stat-label{ font-size:13px; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; justify-content:space-between; }
  .stat-card .stat-value{ font-family:var(--sans); font-size:23px; font-weight:800; margin-top:6px; color:var(--ink); letter-spacing:-0.3px; }
  .stat-card.wide{ grid-column:1 / -1; }
  .stat-card.wide{ display:flex; align-items:center; justify-content:space-between; }
  .stat-card.wide .stat-icon{ margin-bottom:0; }
  .stat-card-row{ display:flex; align-items:center; gap:13px; }
  .stat-card-chev{ color:var(--ink-faint); }
  .stat-card-chev svg{ width:18px; height:18px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border:none; border-radius:var(--radius-btn);
    padding:14px 18px; font-size:15px; font-weight:700;
    background:var(--surface-alt); color:var(--ink);
  }
  .btn:active{ transform:scale(0.98); }
  .btn.primary{ background:var(--accent-strong); color:var(--accent-ink); }
  .btn.whatsapp{ background:var(--whatsapp); color:#fff; }
  .btn.dark{ background:var(--ink); color:#fff; }
  .btn.danger{ background:var(--danger-bg); color:var(--accent-2); }
  .btn.block{ width:100%; }
  .btn.ghost{ background:transparent; border:1.5px solid var(--border); }
  .btn:disabled{ opacity:.45; }
  .btn svg{ width:16px; height:16px; }

  .cta-home{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg, #A9F0C6, var(--sec-home));
    color:var(--ink);
    border-radius:20px; padding:20px 20px; margin-bottom:20px;
    border:none; width:100%; text-align:left;
    box-shadow:0 10px 24px rgba(37,211,102,0.35);
  }
  .cta-home-left{ display:flex; align-items:center; gap:14px; }
  .cta-home-icon{
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.55);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cta-home-icon svg{ width:20px; height:20px; }
  .cta-home .cta-title{ font-size:17.5px; font-weight:800; }
  .cta-home .cta-sub{ font-size:12.5px; color:rgba(22,33,62,0.65); margin-top:2px; font-weight:600; }
  .cta-home .cta-arrow{ color:var(--ink); flex-shrink:0; }
  .cta-home .cta-arrow svg{ width:22px; height:22px; }

  .section-title{ font-size:15px; font-weight:800; color:var(--ink); margin:24px 0 12px; display:flex; align-items:center; gap:8px; }
  .section-title::before{ content:''; display:block; width:4px; height:16px; border-radius:3px; background:var(--accent-strong); }
  .section-title:first-child{ margin-top:0; }

  .empty-state{ text-align:center; padding:36px 20px 20px; color:var(--ink-soft); }
  .empty-illustration{ display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .empty-illustration svg{ width:132px; height:132px; }
  .empty-state .empty-title{ font-size:16px; font-weight:800; color:var(--ink); margin-bottom:5px;}
  .empty-state .empty-text{ font-size:13.5px; line-height:1.55; max-width:280px; margin:0 auto; }

  /* ---------- Category chips ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    border:1.5px solid var(--border); background:var(--surface);
    padding:10px 16px; border-radius:var(--radius-chip);
    font-size:13.5px; font-weight:700; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .chip.active{ color:var(--ink); border-color:transparent; }

  /* ---------- Product grid ---------- */
  .product-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .product-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:0; overflow:hidden; text-align:left; box-shadow:var(--shadow-card);
    display:flex; flex-direction:column;
  }
  .product-card.in-cart{ border-color:var(--whatsapp); border-width:2px; box-shadow:0 4px 16px rgba(37,211,102,0.32); }
  .product-card .pc-tap{ display:flex; flex-direction:column; cursor:pointer; }
  .product-card .pc-tap:active{ opacity:.85; }
  .product-card .pc-top{ height:5px; }
  .product-card .pc-photo{
    width:100%; aspect-ratio:4 / 4.6; background:var(--surface-alt); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .product-card .pc-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .product-card .pc-photo.is-placeholder svg{ width:34px; height:34px; }
  .product-card .pc-inner{ padding:12px 13px 4px; display:flex; flex-direction:column; }
  .product-card .pc-name{
    font-size:13.5px; font-weight:700; margin:0; line-height:1.3; height:34px;
    color:var(--ink); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; text-overflow:ellipsis;
  }
  .product-card .pc-cat{ font-size:10.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- Barra inferior de precio / cantidad de la tarjeta ---------- */
  .product-card .pc-pricebar, .product-card .pc-qtybar{
    padding:8px 13px 13px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .product-card .pc-price{ font-family:var(--sans); font-size:15px; font-weight:800; color:var(--ink); }
  .product-card .pc-qty-total{ font-family:var(--sans); font-size:13.5px; font-weight:800; color:var(--ink); text-align:right; }
  .qty-control.mini{ padding:3px; flex-shrink:0; }
  .qty-control.mini .qty-btn{ width:23px; height:23px; font-size:14px; }
  .qty-control.mini .qty-val{ font-size:12.5px; min-width:13px; }

  /* ---------- Cart mini bar ---------- */
  .cartbar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:88px; z-index:15;
    width:100%; max-width:528px; padding:0 18px;
  }
  .cartbar-inner{
    background:var(--ink); color:#fff; border-radius:20px;
    padding:12px 16px 12px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 14px 30px rgba(22,33,62,0.42);
    border:2px solid rgba(37,211,102,0.5);
    width:100%;
    animation:cartbarPop .32s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes cartbarPop{
    from{ transform:scale(0.9) translateY(8px); opacity:0; }
    to{ transform:scale(1) translateY(0); opacity:1; }
  }
  .cartbar-left{ display:flex; align-items:center; gap:11px; min-width:0; }
  .cartbar-icon{
    width:38px; height:38px; border-radius:50%; background:var(--sec-sale);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
  }
  .cartbar-icon svg{ width:18px; height:18px; color:#fff; }
  .cartbar-count{
    position:absolute; top:-5px; right:-5px;
    background:var(--accent-2); color:#fff; font-size:11px; font-weight:800;
    border-radius:999px; min-width:19px; height:19px; padding:0 4px;
    display:inline-flex; align-items:center; justify-content:center;
    border:2px solid var(--ink); line-height:1;
  }
  .cartbar-label{ font-weight:800; font-size:14.5px; white-space:nowrap; }
  .cartbar-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .cartbar-thumbs{ display:flex; align-items:center; }
  .cartbar-thumb{
    width:26px; height:26px; border-radius:50%; overflow:hidden;
    background:var(--surface-alt); border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    margin-left:-9px; flex-shrink:0;
  }
  .cartbar-thumb:first-child{ margin-left:0; }
  .cartbar-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cartbar-thumb svg{ width:12px; height:12px; color:var(--ink-soft); }
  .cartbar-total{ font-weight:800; font-size:15.5px; }
  .cartbar-chevron{
    width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cartbar-chevron svg{ width:13px; height:13px; }

  /* ---------- Modal / sheet ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(16,22,42,0.45);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:400; animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-sheet{
    background:var(--bg); width:100%; max-width:560px;
    max-height:92dvh; overflow-y:auto;
    border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
    box-shadow:var(--shadow-sheet);
    animation:slideUp .18s ease;
    padding:10px 20px 28px;
  }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet-grip{ width:38px; height:4px; background:var(--ink-faint); border-radius:99px; margin:8px auto 16px; }
  .modal-center{ align-items:center; }
  .modal-sheet.modal-card{ border-radius:var(--radius-sheet); margin:0 18px; max-height:88dvh; }

  .sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-header h2{ font-size:18px; margin:0; font-weight:800; color:var(--ink); }
  .sheet-header-left{ display:flex; align-items:center; gap:10px; }
  .sheet-close{ background:var(--surface-alt); border:none; width:32px; height:32px; border-radius:50%; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sheet-close svg{ width:14px; height:14px; }
  .cart-total-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--ink); color:#fff;
    padding:6px 12px 6px 6px; border-radius:999px;
    font-size:13px; font-weight:800; white-space:nowrap;
  }
  .cart-total-pill .ctp-icon{
    width:22px; height:22px; border-radius:50%; background:var(--sec-sale);
    color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cart-total-pill .ctp-icon svg{ width:13px; height:13px; }

  /* ---------- Cart list ---------- */
  .cart-item{ display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
  .cart-item:last-child{ border-bottom:none; }
  .cart-item-info{ flex:1; min-width:0; }
  .cart-item-name{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .cart-item-price{ font-size:12px; color:var(--ink-soft); margin-top:2px; font-weight:600; }
  .qty-control{ display:flex; align-items:center; gap:8px; background:var(--surface-alt); border-radius:999px; padding:4px; }
  .qty-btn{ width:27px; height:27px; border-radius:50%; border:none; background:var(--surface); font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; color:var(--ink); box-shadow:0 1px 3px rgba(22,33,62,0.12); }
  .qty-val{ font-size:13.5px; font-weight:800; min-width:16px; text-align:center; color:var(--ink); }
  .cart-item-remove{ background:none; border:none; color:var(--accent-2); font-size:15px; padding:4px 2px; display:flex; }
  .cart-item-remove svg{ width:16px; height:16px; }
  .cart-item-subtotal{ font-size:13px; font-weight:800; width:58px; text-align:right; color:var(--ink); }

  .totals{ margin-top:16px; padding-top:12px; border-top:1px dashed var(--border); }
  .totals-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--ink-soft); font-weight:600; }
  .totals-row.grand{ color:var(--ink); font-size:18px; font-weight:800; padding-top:9px; }
  .totals-row .v{ font-weight:700; }

  /* ---------- Option groups (service/payment) ---------- */
  .opt-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:16px; }
  .opt-card{
    border:1.5px solid var(--border); background:var(--surface); border-radius:13px;
    padding:13px 6px; text-align:center; font-size:12.5px; font-weight:700; color:var(--ink-soft);
  }
  .opt-card .opt-emoji{ display:block; font-size:19px; margin-bottom:5px; }
  .opt-card.active{ border-color:var(--accent-strong); background:var(--accent-soft); color:var(--ink); }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .field input, .field select{
    width:100%; border:1.5px solid var(--border); border-radius:12px;
    padding:13px 14px; font-size:15px; background:var(--surface); color:var(--ink); font-weight:600;
  }
  .field input:focus, .field select:focus{ border-color:var(--accent-strong); }
  .field-hint{ font-size:12px; margin-top:7px; font-weight:700; }
  .field-hint.ok{ color:var(--success); }
  .field-hint.warn{ color:var(--accent-2); }

  .switch{ display:flex; align-items:center; }
  .switch input{ display:none; }
  .switch .track{
    width:40px; height:24px; border-radius:99px; background:var(--border); position:relative; transition:background .15s;
  }
  .switch .track::after{
    content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .switch input:checked + .track{ background:var(--success); }
  .switch input:checked + .track::after{ left:18px; }

  /* ---------- History rows ---------- */
  .search-box{
    display:flex; align-items:center; gap:9px; background:var(--surface); border:1.5px solid var(--border);
    border-radius:13px; padding:12px 15px; margin-bottom:14px; box-shadow:var(--shadow-card);
  }
  .search-box svg{ width:17px; height:17px; color:var(--ink-soft); flex-shrink:0; }
  .search-box input{ border:none; outline:none; background:none; flex:1; font-size:14px; color:var(--ink); font-weight:500; }
  .filter-chip{
    flex:0 0 auto; font-size:13.5px; font-weight:700; padding:10px 16px; border-radius:999px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft);
    white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .filter-chip.active{ background:var(--accent-strong); color:var(--ink); border-color:transparent; box-shadow:0 4px 10px rgba(245,191,60,0.3); }
  .filter-chip.active.is-danger{ background:var(--accent-2); color:#fff; box-shadow:0 4px 10px rgba(225,89,76,0.3); }

  /* ---------- Historial: botón compacto de Filtros ---------- */
  .filters-trigger-row{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .filters-trigger-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1.5px solid var(--border);
    padding:11px 17px; border-radius:999px; font-size:14px; font-weight:700; color:var(--ink);
    box-shadow:var(--shadow-card);
  }
  .filters-trigger-btn .fti-icon{ width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .filters-trigger-btn .fti-icon svg{ width:18px; height:18px; }
  .filters-trigger-badge{
    background:var(--sec-history); color:#fff; font-size:11px; font-weight:800;
    border-radius:999px; min-width:19px; height:19px; padding:0 5px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .filters-clear-btn{ background:none; border:none; color:var(--ink-soft); font-size:13.5px; font-weight:700; padding:8px 2px; }
  .filters-clear-btn:active{ opacity:.6; }

  /* ---------- Historial: grupos de filtros dentro del modal ---------- */
  .filter-modal-group{ margin-bottom:22px; }
  .filter-modal-group:last-child{ margin-bottom:6px; }
  .filter-modal-label{ display:flex; align-items:center; gap:9px; font-size:14px; font-weight:800; color:var(--ink); margin-bottom:12px; }
  .filter-modal-label .fml-icon{
    width:28px; height:28px; border-radius:9px; background:var(--sec-history-soft); color:var(--sec-history);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .filter-modal-label .fml-icon svg{ width:15px; height:15px; }
  .filter-pill-row{ display:flex; flex-wrap:wrap; gap:9px; }

  /* ---------- Historial: gráfico de ventas ---------- */
  .hist-chart-card{ margin-bottom:18px; }
  .hist-chart-card .bar-row:last-child{ margin-bottom:0; }

  .sale-row{
    display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-card); padding:14px 15px; margin-bottom:10px; text-align:left; width:100%;
    box-shadow:var(--shadow-card);
  }
  .sale-row.cancelled{ opacity:.55; }
  .sale-row-badge{
    width:42px; height:42px; border-radius:12px; background:var(--surface-soft); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
  }
  .sale-row-main{ flex:1; min-width:0; }
  .sale-row-num{ font-size:13.5px; font-weight:800; color:var(--ink); }
  .sale-row-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-weight:600; }
  .sale-row-right{ text-align:right; }
  .sale-row-total{ font-size:15px; font-weight:800; color:var(--ink); }
  .tag{ display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px; margin-top:4px; }
  .tag.cancel{ background:var(--danger-bg); color:var(--accent-2); }

  /* ---------- Ticket ---------- */
  .ticket{ font-family:var(--mono); background:var(--surface); border-radius:16px; padding:22px 18px; border:1.5px dashed var(--ink-faint); }
  .ticket-center{ text-align:center; }
  .ticket h3{ margin:0 0 2px; font-size:16px; letter-spacing:1px; color:var(--ink); }
  .ticket .ticket-sub{ font-size:11px; color:var(--ink-soft); margin-bottom:10px; }
  .ticket hr{ border:none; border-top:1px dashed var(--ink-faint); margin:10px 0; }
  .ticket-line{ display:flex; justify-content:space-between; font-size:12.5px; margin:2px 0; color:var(--ink); }
  .ticket-item-row{ font-size:12.5px; margin:5px 0; }
  .ticket-item-row .ti-name{ display:flex; justify-content:space-between; color:var(--ink); }
  .ticket-item-qty{ color:var(--ink-soft); }
  .ticket-total{ font-size:15px; font-weight:700; }
  .ticket-meta{ font-size:11.5px; color:var(--ink-soft); margin:1px 0; }

  /* ---------- Products view ---------- */
  .prod-row{ display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:10px 13px; margin-bottom:9px; box-shadow:var(--shadow-card); }
  .prod-row .pr-photo{ width:44px; height:44px; border-radius:11px; background:var(--surface-alt); flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .prod-row .pr-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .prod-row .pr-photo svg{ width:19px; height:19px; }
  .prod-row .pr-info{ flex:1; min-width:0; }
  .prod-row .pr-name{ font-size:13.5px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prod-row .pr-price{ font-size:12px; color:var(--ink-soft); margin-top:2px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prod-row .pr-actions{ display:flex; align-items:center; gap:6px; }
  .icon-btn{ background:var(--surface-alt); border:none; width:32px; height:32px; border-radius:10px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; }
  .icon-btn svg{ width:14px; height:14px; }
  .cat-header{ display:flex; align-items:center; gap:8px; margin:22px 0 11px; }
  .cat-header:first-child{ margin-top:0; }
  .cat-header .cat-emoji{ font-size:16px; }
  .cat-header .cat-name{ font-size:14.5px; font-weight:800; color:var(--ink); }
  .cat-header .cat-count{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }

  /* ---------- Gestión de categorías ---------- */
  .catmgr-row{ display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:10px 12px; margin-bottom:8px; }
  .catmgr-dot{ width:30px; height:30px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .catmgr-name{ flex:1; font-size:13.5px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .catmgr-count{ font-size:11px; color:var(--ink-soft); font-weight:600; margin-right:2px; }
  .catmgr-actions{ display:flex; gap:6px; }

  /* ---------- Uploader de foto de producto ---------- */
  .photo-upload{
    width:100%; height:150px; border-radius:14px; border:1.5px dashed var(--ink-faint);
    background:var(--surface-alt); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; color:var(--ink-soft); font-size:12.5px; font-weight:700; overflow:hidden; position:relative; cursor:pointer;
  }
  .photo-upload img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
  .photo-upload svg{ width:26px; height:26px; }
  .photo-upload .photo-upload-hint{ position:relative; z-index:1; }
  .photo-upload.has-image .photo-upload-hint{ display:none; }
  .photo-upload-remove{
    position:absolute; top:8px; right:8px; z-index:2; background:rgba(22,33,62,0.65); color:#fff;
    border:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  .photo-upload-remove svg{ width:13px; height:13px; }

  .fab-row{ display:flex; justify-content:flex-end; margin-bottom:6px; }

  /* ---------- Bars for stats ---------- */
  .bar-row{ margin-bottom:13px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-row-top{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--ink); }
  .bar-row-top .bv{ color:var(--ink-soft); font-weight:600; }
  .bar-track{ height:9px; background:var(--surface-alt); border-radius:999px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; }

  .top-product-row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--border); }
  .top-product-row:last-child{ border-bottom:none; }
  .top-product-rank{ width:24px; height:24px; border-radius:8px; background:var(--surface-soft); font-size:11px; font-weight:800; color:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .top-product-name{ flex:1; font-size:13px; font-weight:700; color:var(--ink); }
  .top-product-qty{ font-size:11px; color:var(--ink-soft); font-weight:600; }
  .top-product-rev{ font-size:13px; font-weight:800; color:var(--ink); }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:150px; transform:translate(-50%, 10px) scale(0.96);
    background:var(--surface); color:var(--ink);
    border:1px solid var(--border);
    padding:12px 16px; border-radius:16px; z-index:200; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1);
    max-width:86%; text-align:left;
    box-shadow:var(--shadow-pop);
    display:flex; align-items:center; gap:12px;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0) scale(1); }
  .toast.toast-top{
    top:calc(82px + env(safe-area-inset-top)); bottom:auto;
    transform:translate(-50%, -10px) scale(0.96);
  }
  .toast.toast-top.show{ transform:translate(-50%,0) scale(1); }
  .toast-icon{
    width:36px; height:36px; border-radius:50%; background:var(--surface-alt); color:var(--ink);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .toast-icon svg{ width:16px; height:16px; }
  .toast.toast-success .toast-icon{ background:var(--whatsapp); color:#fff; }
  .toast.toast-danger .toast-icon{ background:var(--danger-bg); color:var(--accent-2); }
  .toast-text{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .toast-title{ font-size:13.5px; font-weight:800; color:var(--ink); line-height:1.3; }
  .toast-sub{ font-size:12px; font-weight:600; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }

  /* ---------- Existencias (inventario) ---------- */
  .stock-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px;
    background:var(--surface-alt); color:var(--ink-soft); white-space:nowrap;
  }
  .stock-badge svg{ width:11px; height:11px; }
  .stock-badge.ok{ background:var(--success-bg); color:var(--success); }
  .stock-badge.low{ background:var(--accent-soft); color:#8A6000; }
  .stock-badge.out{ background:var(--danger-bg); color:var(--accent-2); }

  .product-card{ position:relative; }
  .product-card.is-out .pc-photo{ filter:grayscale(1); opacity:.5; }
  .product-card.is-out .pc-name, .product-card.is-out .pc-price{ color:var(--ink-soft); }
  .product-card .pc-flag{
    position:absolute; top:11px; right:9px; z-index:2;
    font-size:10px; font-weight:800; padding:4px 9px; border-radius:999px;
    background:var(--accent-2); color:#fff; box-shadow:0 2px 8px rgba(22,33,62,.25);
  }
  .product-card .pc-flag.low{ background:var(--accent-strong); color:#4A3400; }
  .product-card .pc-stock{ font-size:10.5px; font-weight:700; margin-top:3px; color:var(--ink-soft); }
  .product-card .pc-stock.low{ color:#8A6000; }
  .product-card .pc-stock.out{ color:var(--accent-2); }
  .prod-row .pr-stock{ display:flex; gap:6px; margin-top:5px; }

  .two-fields{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .two-fields .field{ margin-bottom:0; }

  /* Aviso (existencias bajas) */
  .alert-card{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--accent-soft); border:1px solid #F0DCA0;
    border-radius:var(--radius-card); padding:13px 14px; margin-bottom:4px; color:var(--ink);
  }
  .alert-card.danger{ background:var(--danger-bg); border-color:#F3CFCA; }
  .alert-ico{
    width:38px; height:38px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.7); color:#8A6000;
  }
  .alert-card.danger .alert-ico{ color:var(--accent-2); }
  .alert-ico svg{ width:19px; height:19px; }
  .alert-txt{ flex:1; min-width:0; }
  .alert-title{ display:block; font-size:13.5px; font-weight:800; }
  .alert-sub{ display:block; font-size:12px; font-weight:600; color:rgba(22,33,62,.7); margin-top:2px; }
  /* El título y su explicación siempre en renglones distintos */
  .acc-label, .acc-sub{ display:block; }

  /* ---------- Pendientes ---------- */
  .todo-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-card); box-shadow:var(--shadow-card); padding:13px 15px 6px;
  }
  .todo-add{ display:flex; gap:8px; margin-bottom:6px; }
  .todo-add input{
    flex:1; min-width:0; border:1.5px solid var(--border); border-radius:12px;
    padding:12px 13px; font-size:14px; font-weight:600; background:var(--surface); color:var(--ink);
  }
  .todo-add input:focus{ border-color:var(--accent-strong); outline:none; }
  .todo-add button{
    width:46px; flex-shrink:0; border:none; border-radius:12px;
    background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .todo-add button svg{ width:19px; height:19px; }
  .todo-item{ display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--border); }
  .todo-item:last-child{ border-bottom:none; }
  .todo-check{
    width:25px; height:25px; border-radius:8px; flex-shrink:0;
    border:1.8px solid var(--ink-faint); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:transparent; padding:0;
  }
  .todo-check svg{ width:14px; height:14px; }
  .todo-item.done .todo-check{ background:var(--whatsapp); border-color:var(--whatsapp); color:#fff; }
  .todo-text{
    flex:1; min-width:0; background:none; border:none; padding:0; text-align:left;
    font-size:14px; font-weight:600; color:var(--ink); line-height:1.4; word-break:break-word;
  }
  .todo-item.done .todo-text{ text-decoration:line-through; color:var(--ink-soft); }
  .todo-del{ background:none; border:none; color:var(--ink-faint); padding:4px; display:flex; flex-shrink:0; }
  .todo-del svg{ width:15px; height:15px; }
  .todo-empty{ font-size:13px; font-weight:600; color:var(--ink-soft); text-align:center; padding:14px 0 16px; }
  .todo-foot{ display:flex; justify-content:space-between; align-items:center; padding:9px 0 8px; }
  .todo-foot span{ font-size:12px; font-weight:700; color:var(--ink-soft); }
  .todo-foot button{ background:none; border:none; font-size:12.5px; font-weight:800; color:var(--accent-2); padding:4px; }
  .section-title .title-count{ margin-left:auto; font-size:12px; font-weight:700; color:var(--ink-soft); }

  /* =========================================================
     IMPRESION DE TICKETS (termica de 58/80 mm u hoja normal)
     ---------------------------------------------------------
     Antes la app se escondia con visibility:hidden, que SIGUE
     ocupando su espacio: por eso el ticket salia en 3 hojas.
     Ahora la app se apaga con display:none y solo se imprime
     #printRoot, con el ancho exacto del papel. El tamano se
     elige en Mi cuenta -> Impresion de tickets (esa pantalla
     inyecta la regla @page desde applyPrintVars()).
  ========================================================= */
  .no-print{}
  #printRoot{ display:none; }

  @media print{
    html, body{
      background:#fff !important; margin:0 !important; padding:0 !important;
      width:auto !important; height:auto !important; overflow:visible !important;
    }
    body > *{ display:none !important; }
    body > #printRoot{ display:block !important; }
    .no-print{ display:none !important; }
    #printRoot{
      color:#000; background:#fff;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .p-ticket{ box-shadow:none !important; }
  }

  /* Hoja del ticket: se ve igual al imprimir y en la vista previa */
  .p-ticket{
    width:var(--print-w, 72mm);
    max-width:100%;
    margin:0 auto;
    padding:0 var(--print-pad, 1.5mm);
    background:#fff; color:#000;
    font-family:var(--mono);
    font-size:var(--print-size, 12px);
    line-height:var(--print-lh, 1.35);
  }
  .p-copy + .p-copy{ page-break-before:always; break-before:page; }
  .p-center{ text-align:center; }
  .p-logo{ display:block; width:60%; max-width:38mm; margin:0 auto 2mm; }
  .p-title{
    font-size:calc(var(--print-size, 12px) + 3px); font-weight:800;
    letter-spacing:.5px; text-transform:uppercase; margin:0 0 1mm; word-break:break-word;
  }
  .p-sub, .p-meta{ margin:0; }
  .p-sep{ border:0; border-top:1px dashed #000; margin:2mm 0; }
  .p-row{ display:flex; justify-content:space-between; gap:8px; }
  .p-row .p-r{ text-align:right; white-space:nowrap; }
  .p-item{ margin:0 0 1.4mm; }
  .p-item .p-name{ display:flex; justify-content:space-between; gap:8px; font-weight:700; }
  .p-item .p-name span:first-child{ word-break:break-word; }
  .p-item .p-qty{ padding-left:2mm; }
  .p-total{ font-size:calc(var(--print-size, 12px) + 3px); font-weight:800; }
  .p-foot{ margin-top:2mm; text-align:center; word-break:break-word; }
  .p-cancel{ margin-top:2mm; padding:1.5mm; border:1.5px solid #000; text-align:center; font-weight:800; }
  .p-feed{ height:var(--print-feed, 10mm); }

  /* Pantalla de configuracion de impresion */
  .print-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:16px; }
  .print-grid .opt-card{ padding:12px 8px; }
  .print-grid .opt-emoji svg{ width:18px; height:18px; margin:0 auto; }
  .opt-note{ display:block; font-size:10.5px; font-weight:600; color:var(--ink-faint); margin-top:3px; }
  .field input[type=range]{
    padding:0; border:none; background:none; width:100%; height:30px; accent-color:var(--ink);
  }
  .field label b{ float:right; color:var(--ink); font-weight:800; }
  .print-preview{
    background:#E7EAF3; border:1px solid var(--border); border-radius:14px;
    padding:14px 10px; max-height:300px; overflow:auto;
  }
  .print-preview .p-ticket{ box-shadow:0 2px 12px rgba(22,33,62,.18); padding-top:4mm; padding-bottom:2mm; }
  .print-tip{
    font-size:12px; font-weight:600; color:var(--ink-soft); line-height:1.5;
    background:var(--surface-alt); border-radius:12px; padding:11px 13px; margin:14px 0 0;
  }

  @media (min-width:640px){
    .product-grid{ grid-template-columns:1fr 1fr 1fr; }
  }

  /* =========================================================
     ADAPTACIÓN A PC / TABLET
     Todo lo de arriba es el diseño de celular y queda intacto:
     estas reglas solo se activan desde 700px de ancho en adelante,
     así que en el teléfono no cambia nada (ni diseño ni funciones).
  ========================================================= */
  @media (min-width:700px){
    body{ background:#E7EAF3; }

    .app{
      max-width:1400px;
      display:grid;
      grid-template-columns:108px 1fr;
      grid-template-rows:auto 1fr;
      grid-template-areas:
        "nav topbar"
        "nav view";
    }

    /* ---- Topbar con más aire ---- */
    .topbar{ grid-area:topbar; padding:24px 36px 12px; }

    /* ---- Contenido principal ---- */
    .view{ grid-area:view; padding:20px 36px 140px; }

    /* ---- Barra inferior -> menú lateral fijo ---- */
    .bottomnav{
      grid-area:nav;
      position:sticky; top:0; bottom:auto;
      height:100dvh;
      flex-direction:column;
      justify-content:flex-start;
      align-items:stretch;
      gap:8px;
      padding:28px 10px 20px;
      box-shadow:1px 0 0 var(--border), 8px 0 24px rgba(22,33,62,0.05);
    }
    .navbtn{ flex:0 0 auto; padding:13px 4px; }
    .navbtn[data-view="account"]{ display:flex; margin-top:auto; }
    .navbtn .navicon{ margin:0 auto; }
    .navbtn span:last-child{ font-size:11.5px; }

    /* ---- Rejillas: aprovechar el ancho extra ---- */
    .stat-grid{ grid-template-columns:repeat(4,1fr); }
    .opt-grid{ grid-template-columns:repeat(3,1fr); max-width:520px; }

    /* ---- Nueva venta en PC: tarjetas bien pequeñas, ~8 por fila ---- */
    .product-grid{
      grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
      gap:8px;
      max-width:1240px;
    }
    .product-card .pc-photo{ aspect-ratio:4 / 3.2; }
    .product-card .pc-photo.is-placeholder svg{ width:20px; height:20px; }
    .product-card .pc-inner{ padding:7px 8px 2px; }
    .product-card .pc-cat{ font-size:8.5px; margin-bottom:2px; }
    .product-card .pc-name{
      font-size:11px; line-height:1.25; height:26px;
    }
    .product-card .pc-pricebar, .product-card .pc-qtybar{ padding:5px 8px 8px; gap:4px; }
    .product-card .pc-price{ font-size:12px; }
    .product-card .pc-qty-total{ font-size:11px; }
    .product-card .qty-control.mini{ padding:2px; }
    .product-card .qty-control.mini .qty-btn{ width:19px; height:19px; font-size:12px; }
    .product-card .qty-control.mini .qty-val{ font-size:11px; min-width:10px; }

    /* ---- Carrito flotante y notificaciones: recentrar respecto al contenido (a la derecha del menú lateral) ---- */
    .cartbar{ left:calc(50% + 54px); bottom:28px; max-width:620px; }
    .toast{ left:calc(50% + 54px); }

    /* ---- Modales: diálogo centrado en vez de hoja inferior ---- */
    .modal-overlay{ padding-left:108px; align-items:center; }
    body.auth-open .modal-overlay{ padding-left:0; }
    .modal-sheet{
      border-radius:var(--radius-sheet);
      max-width:480px;
      max-height:86vh;
      animation:modalPopIn .18s ease;
    }
    .modal-sheet.modal-card{ margin:0; }
    .sheet-grip{ display:none; }
    @keyframes modalPopIn{
      from{ transform:translateY(10px) scale(.98); opacity:0; }
      to{ transform:translateY(0) scale(1); opacity:1; }
    }
  }

  @media (min-width:1100px){
    .stat-grid{ grid-template-columns:repeat(4,1fr); }
  }
  }

  /* =========================================================
     BLOQUE NUEVO — ACCESO (bienvenida, registro, código) Y MI CUENTA
     Usa los mismos tokens de color/radios del resto de la app.
  ========================================================= */
  .auth-layer{
    position:fixed; inset:0; z-index:300;
    background:var(--surface);
    display:none;
  }
  .auth-layer.show{ display:block; }
  /* Con el acceso abierto la app se oculta por completo: son dos mundos
     separados, nunca se ven al mismo tiempo. */
  body.auth-open{ overflow:hidden; }
  body.auth-open .app{ display:none; }
  body.auth-open .toast{ z-index:500; }
  .auth-screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    background:var(--surface);
    overflow-y:auto;
    animation:authEnter .3s cubic-bezier(.22,.9,.3,1);
  }
  .auth-screen::-webkit-scrollbar{ width:0; }
  @keyframes authEnter{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:none; }
  }
  .auth-body{
    width:100%; max-width:460px; margin:0 auto;
    padding:0 22px calc(28px + env(safe-area-inset-bottom));
    flex:1; display:flex; flex-direction:column;
  }
  .auth-top{
    width:100%; max-width:460px; margin:0 auto;
    padding:calc(14px + env(safe-area-inset-top)) 22px 4px;
    display:flex; align-items:center; gap:10px; min-height:56px;
  }
  .auth-back{
    width:42px; height:42px; border-radius:14px; border:none;
    background:var(--surface-alt); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .auth-back svg{ width:20px; height:20px; }
  .auth-back:active{ transform:scale(.94); }

  .auth-title{
    font-size:25px; font-weight:800; letter-spacing:-.4px;
    color:var(--ink); margin:0 0 10px; line-height:1.24;
  }
  .auth-sub{
    font-size:15px; font-weight:500; color:var(--ink-soft);
    margin:0 0 26px; line-height:1.55;
  }
  .auth-actions{ margin-top:auto; display:flex; flex-direction:column; gap:12px; padding-top:22px; }
  .btn.xl{ padding:17px 20px; font-size:16.5px; border-radius:16px; }
  .btn.dark.xl{ box-shadow:0 8px 20px rgba(22,33,62,.22); }
  .btn.outline{
    background:var(--surface); border:1.8px solid var(--ink); color:var(--ink);
  }

  /* ---- Bienvenida ---- */
  .auth-hero{
    position:relative; flex:1; min-height:330px;
    background:linear-gradient(160deg,#20325C 0%, #16213E 62%, #101A31 100%);
    display:flex; align-items:flex-end; justify-content:center;
    padding-top:calc(10px + env(safe-area-inset-top));
    overflow:hidden;
  }
  .auth-hero svg{ width:100%; max-width:460px; height:auto; }
  .auth-hero-flag{
    position:absolute; top:calc(16px + env(safe-area-inset-top)); left:20px;
  }
  .auth-sheet{
    background:var(--surface);
    border-radius:30px 30px 0 0;
    margin-top:-26px; position:relative; z-index:2;
    padding:30px 0 0;
    box-shadow:0 -12px 34px rgba(16,26,49,.22);
  }
  .auth-sheet .auth-body{ padding-bottom:calc(24px + env(safe-area-inset-bottom)); }

  /* ---- Selector de país ---- */
  .country-chip{
    display:inline-flex; align-items:center; gap:9px;
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:999px; padding:8px 14px 8px 10px;
    font-size:15px; font-weight:700; color:var(--ink);
    box-shadow:var(--shadow-card);
  }
  .country-chip .flag{ font-size:20px; line-height:1; }
  .country-chip svg{ width:16px; height:16px; color:var(--ink-soft); }

  .phone-row{
    display:flex; align-items:stretch; gap:10px;
  }
  .phone-code{
    display:flex; align-items:center; gap:7px;
    border:1.6px solid var(--border); border-radius:14px;
    padding:0 13px; background:var(--surface);
    font-size:15.5px; font-weight:800; color:var(--ink); flex-shrink:0;
  }
  .phone-code .flag{ font-size:20px; }
  .phone-code svg{ width:14px; height:14px; color:var(--ink-soft); }
  .phone-input{
    flex:1; border:1.6px solid var(--border); border-radius:14px;
    padding:15px 16px; font-size:17px; font-weight:700; letter-spacing:.6px;
    color:var(--ink); background:var(--surface); width:100%;
  }
  .phone-input:focus{ border-color:var(--accent-strong); outline:none; }
  .phone-input::placeholder{ color:var(--ink-faint); font-weight:600; letter-spacing:.4px; }

  .country-list{ max-height:52vh; overflow-y:auto; margin:4px -4px 0; }
  .country-item{
    display:flex; align-items:center; gap:12px; width:100%;
    background:none; border:none; border-radius:14px;
    padding:13px 12px; text-align:left; color:var(--ink);
  }
  .country-item:active{ background:var(--surface-alt); }
  .country-item .flag{ font-size:23px; }
  .country-item .cname{ flex:1; font-size:15px; font-weight:700; }
  .country-item .cdial{ font-size:14px; font-weight:800; color:var(--ink-soft); }
  .country-item.active{ background:var(--accent-soft); }

  /* ---- Términos ---- */
  .terms-row{
    display:flex; align-items:flex-start; gap:12px;
    margin:20px 0 4px; cursor:pointer;
  }
  .terms-box{
    width:24px; height:24px; border-radius:8px; flex-shrink:0; margin-top:1px;
    border:1.8px solid var(--ink-faint); background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .terms-box svg{ width:14px; height:14px; color:var(--accent-ink); opacity:0; transform:scale(.6); transition:opacity .15s ease, transform .15s ease; }
  .terms-row.checked .terms-box{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .terms-row.checked .terms-box svg{ opacity:1; transform:scale(1); }
  .terms-text{ font-size:13.5px; line-height:1.6; color:var(--ink-soft); font-weight:600; }
  .terms-text b{ color:var(--ink); font-weight:800; text-decoration:underline; }

  /* ---- Código de verificación ---- */
  .otp-row{ display:flex; gap:9px; justify-content:space-between; margin:6px 0 18px; }
  .otp-cell{
    flex:1; min-width:0; aspect-ratio:1 / 1.18;
    border:1.8px solid var(--border); border-radius:15px;
    background:var(--surface-alt);
    font-size:24px; font-weight:800; text-align:center; color:var(--ink);
    padding:0; -moz-appearance:textfield;
  }
  .otp-cell::-webkit-outer-spin-button,
  .otp-cell::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .otp-cell:focus{ border-color:var(--accent-strong); background:var(--surface); outline:none; }
  .otp-cell.filled{ background:var(--surface); border-color:var(--ink-faint); }
  .otp-row.error .otp-cell{ border-color:var(--accent-2); animation:otpShake .32s ease; }
  @keyframes otpShake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
  }
  .otp-help{ font-size:13.5px; font-weight:600; color:var(--ink-soft); text-align:center; }
  .otp-help button{
    background:none; border:none; color:var(--ink); font-weight:800;
    font-size:13.5px; text-decoration:underline; padding:0;
  }
  .otp-help button:disabled{ color:var(--ink-faint); text-decoration:none; }
  .demo-code{
    background:var(--accent-soft); border:1px dashed var(--accent-strong);
    border-radius:14px; padding:12px 14px; margin-bottom:18px;
    font-size:13px; font-weight:700; color:var(--ink); line-height:1.5;
  }
  .demo-code span{ font-family:var(--mono); font-size:17px; letter-spacing:3px; }

  .auth-illu{ display:flex; justify-content:center; margin:6px 0 28px; }
  .auth-illu svg{ width:190px; height:190px; }

  .auth-foot{
    text-align:center; font-size:14px; font-weight:600;
    color:var(--ink-soft); margin-top:18px;
  }
  .auth-foot button{
    background:none; border:none; color:var(--ink); font-weight:800; font-size:14px;
    text-decoration:underline; padding:0;
  }

  /* ---- Bloqueo por PIN ---- */
  .pin-dots{ display:flex; gap:14px; justify-content:center; margin:26px 0 8px; }
  .pin-dot{ width:16px; height:16px; border-radius:50%; background:var(--surface-alt); border:1.8px solid var(--border); transition:background .15s, transform .15s; }
  .pin-dot.on{ background:var(--accent-strong); border-color:var(--accent-strong); transform:scale(1.12); }

  /* =========================================================
     MI CUENTA
  ========================================================= */
  .topbar-right{ display:flex; align-items:center; gap:12px; }
  .user-chip{
    display:flex; align-items:center; gap:9px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:5px 13px 5px 5px;
    box-shadow:var(--shadow-card); color:var(--ink);
    max-width:190px; transition:border-color .18s ease, transform .15s ease;
  }
  .user-chip:active{ transform:scale(.96); }
  .user-chip.active{ border-color:var(--accent-strong); background:var(--accent-soft); }
  .user-chip .chip-name{
    font-size:13.5px; font-weight:800; letter-spacing:-.1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .user-chip .avatar-btn{ pointer-events:none; }
  @media (max-width:380px){
    .user-chip .chip-name{ display:none; }
    .user-chip{ padding:5px; }
  }

  /* Tarjeta de usuario del menú lateral (PC) */
  .nav-user{ display:none; }

  .avatar-btn{
    width:38px; height:38px; border-radius:50%; border:2px solid transparent;
    background:var(--ink); color:#fff; padding:0; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800; letter-spacing:.3px;
    transition:border-color .18s ease, transform .15s ease;
  }
  .avatar-btn img{ width:100%; height:100%; object-fit:cover; }
  .avatar-btn svg{ width:19px; height:19px; }
  .avatar-btn .ini{ font-size:14px; font-weight:800; }
  .avatar-btn:active{ transform:scale(.93); }
  .avatar-btn.active{ border-color:var(--accent-strong); }

  .profile-hero{
    background:linear-gradient(140deg,#24395F 0%, #16213E 78%);
    border-radius:22px; padding:22px 20px;
    color:#fff; box-shadow:0 12px 28px rgba(22,33,62,.24);
    display:flex; align-items:center; gap:16px;
  }
  .profile-avatar{
    width:70px; height:70px; border-radius:50%; flex-shrink:0; overflow:hidden;
    background:var(--accent-strong); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:25px; font-weight:800;
    box-shadow:0 6px 16px rgba(0,0,0,.28);
  }
  .profile-avatar img{ width:100%; height:100%; object-fit:cover; }
  .profile-avatar svg{ width:30px; height:30px; }
  .profile-meta{ min-width:0; flex:1; }
  .profile-name{ font-size:19.5px; font-weight:800; letter-spacing:-.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .profile-phone{ font-size:14px; font-weight:600; color:rgba(255,255,255,.72); margin-top:3px; }
  .profile-biz{
    display:inline-flex; align-items:center; gap:6px; margin-top:9px;
    background:rgba(255,255,255,.12); border-radius:999px;
    padding:5px 11px; font-size:12px; font-weight:700; color:#fff;
  }
  .profile-biz svg{ width:13px; height:13px; }

  .acc-list{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-card); box-shadow:var(--shadow-card); overflow:hidden;
  }
  .acc-row{
    display:flex; align-items:center; gap:14px; width:100%;
    background:none; border:none; border-bottom:1px solid var(--border);
    padding:15px 16px; text-align:left; color:var(--ink);
    transition:background .15s ease;
  }
  .acc-row:last-child{ border-bottom:none; }
  .acc-row:active{ background:var(--surface-alt); }
  .acc-ico{
    width:40px; height:40px; border-radius:13px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-alt); color:var(--ink);
  }
  .acc-ico svg{ width:19px; height:19px; }
  .acc-ico.gold{ background:var(--accent-soft); color:#8A6A18; }
  .acc-ico.blue{ background:var(--sec-history-soft); color:var(--sec-history-ink); }
  .acc-ico.green{ background:var(--sec-home-soft); color:var(--sec-home-ink); }
  .acc-ico.violet{ background:var(--sec-stats-soft); color:var(--sec-stats-ink); }
  .acc-ico.red{ background:var(--danger-bg); color:var(--accent-2); }
  .acc-txt{ flex:1; min-width:0; }
  .acc-label{ font-size:15px; font-weight:700; color:var(--ink); }
  .acc-sub{ font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc-row .acc-chev{ color:var(--ink-faint); flex-shrink:0; }
  .acc-row .acc-chev svg{ width:18px; height:18px; }
  .acc-row.danger .acc-label{ color:var(--accent-2); }

  .photo-picker{
    display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:22px;
  }

    width:104px; height:104px; border-radius:50%; overflow:hidden;
    background:var(--surface-alt); border:2px dashed var(--ink-faint);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); position:relative;
  }
  .photo-picker-circle.has-image{ border-style:solid; border-color:var(--accent-strong); }
  .photo-picker-circle img{ width:100%; height:100%; object-fit:cover; }
  .photo-picker-circle svg{ width:28px; height:28px; }
  .photo-picker-actions{ display:flex; gap:9px; }
  .photo-picker-actions .btn{ padding:10px 15px; font-size:13.5px; }

  .toggle-row{
    display:flex; align-items:center; gap:14px;
    padding:14px 0; border-bottom:1px solid var(--border);
  }
  .toggle-row:last-of-type{ border-bottom:none; }
  .toggle-row .acc-txt{ flex:1; }
  .toggle-row .acc-sub{ white-space:normal; }

  @media (min-width:700px){
    .profile-hero{ padding:26px 24px; }
  }

  /* ---- Acceso en pantallas grandes: panel doble ---- */
  @media (min-width:900px){
    .auth-screen{
      display:grid;
      grid-template-columns:1.05fr 1fr;
      grid-template-areas:'side main';
      overflow:hidden;
    }
    .auth-screen::before{
      content:''; grid-area:side;
      background:linear-gradient(160deg,#20325C 0%, #16213E 62%, #101A31 100%);
    }
    .auth-screen > .auth-hero{
      grid-area:side; align-self:center; justify-self:center;
      background:none; min-height:0; width:100%; padding:0 40px;
    }
    .auth-screen > .auth-hero svg{ max-width:560px; }
    .auth-screen > .auth-sheet,
    .auth-screen > .auth-top,
    .auth-screen > .auth-body{ grid-area:main; }
    .auth-screen > .auth-sheet{
      margin:0; border-radius:0; box-shadow:none;
      align-self:center; width:100%; padding:0;
      background:none;
    }
    .auth-screen > .auth-top{ align-self:start; background:none; }
    .auth-screen > .auth-body{
      align-self:center; overflow-y:auto; max-height:100dvh;
      padding-top:24px; padding-bottom:24px;
    }
    /* La pantalla de bienvenida no necesita la ilustración duplicada */
    .auth-screen .auth-illu{ display:none; }
    .auth-side-brand{
      position:absolute; top:32px; left:36px; z-index:3;
      display:flex; align-items:center; gap:10px;
      color:#fff; font-size:20px; font-weight:800;
    }

      width:36px; height:36px; border-radius:11px; background:var(--accent-strong);
      display:flex; align-items:center; justify-content:center;

  @media (max-width:899px){
    .auth-side-brand{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){
    .auth-screen{ animation:none; }
    .otp-row.error .otp-cell{ animation:none; }
  }

  /* ---- Encabezados y acciones dentro de las hojas modales nuevas ---- */
  .sheet-title{ font-size:18.5px; font-weight:800; color:var(--ink); margin:0 0 8px; letter-spacing:-.2px; }
  .sheet-text{ font-size:14px; font-weight:500; color:var(--ink-soft); line-height:1.6; margin:0 0 18px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:20px; }
  .sheet-actions .btn{ flex:1; }

  /* ---------- Ventas: gráficas (barras y líneas) ---------- */
  .seg{ display:flex; gap:2px; background:var(--surface-alt); border-radius:999px; padding:4px; margin-bottom:14px; max-width:380px; }
  .seg button{
    flex:1; border:none; background:none; padding:9px 6px; border-radius:999px;
    font-size:13.5px; font-weight:700; color:var(--ink-soft);
    transition:background .15s ease, color .15s ease;
  }
  .seg button.active{ background:var(--surface); color:var(--sec-stats-ink); box-shadow:0 1px 3px rgba(22,33,62,0.12); }
  .chart-grid{ display:grid; gap:12px; margin-bottom:18px; }
  .chart-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .chart-title{ font-size:13px; font-weight:600; color:var(--ink-soft); }
  .chart-sub{ font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-top:2px; }
  .chart-value{ font-size:21px; font-weight:800; color:var(--ink); letter-spacing:-0.3px; text-align:right; }
  .chart-plot{
    position:relative; height:150px; display:flex; align-items:stretch; gap:4px;

    background-size:100% 50%;
  }
  .chart-col{
    flex:1; min-width:0; position:relative; padding:0; border:none; background:none;
    display:flex; align-items:flex-end; justify-content:center; -webkit-tap-highlight-color:transparent;
  }
  .vbar{ width:68%; max-width:26px; border-radius:6px 6px 3px 3px; background:var(--sec-stats); opacity:.4; }
  .chart-col.sel .vbar{ opacity:1; }
  .vbar.zero{ height:3px; background:var(--border); opacity:1; }
  .line-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .chart-col .dot{
    position:absolute; left:50%; transform:translate(-50%,50%);

  .chart-x span.sel{ color:var(--ink); }
  @media (min-width:900px){
    .chart-grid{ grid-template-columns:1fr 1fr; }
    .chart-plot{ height:180px; }
  }
</style>

<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-name">Mesa</span>
    </div>

function initDB(){
  if(localStorage.getItem('mesa_products') === null){ DB.saveProducts(defaultProducts()); }
  if(localStorage.getItem('mesa_categories') === null){ DB.saveCategories(defaultCategories()); }
  if(localStorage.getItem('mesa_sales') === null){ DB.saveSales([]); }
  if(localStorage.getItem('mesa_counter') === null){ localStorage.setItem('mesa_counter','0'); }

  // Productos de demostración guardados antes de existir el precio de producción:
  // se les pone el simulado UNA vez (solo si nunca tuvieron dato: undefined).
  // Si tú lo dejaste vacío a propósito (null) o lo cambiaste, no se toca.
  const list = DB.getProducts();
  let changed = false;
  list.forEach(p => {
    if(p.cost === undefined && DEMO_COSTS[p.id] !== undefined){ p.cost = DEMO_COSTS[p.id]; changed = true; }
    // Productos guardados antes de que existiera el inventario:
    // quedan SIN control de existencias (stock = null) hasta que el
    // dueño lo active desde el formulario del producto.
    if(p.stock === undefined){ p.stock = null; changed = true; }
    if(p.minStock === undefined){ p.minStock = 2; changed = true; }
  });
  if(changed) DB.saveProducts(list);

  if(localStorage.getItem('mesa_todos') === null){
    DB.saveTodos([
      { id:'t1', text:'Comprar refrescos', done:false, date:new Date().toISOString() },
      { id:'t2', text:'Pagar al proveedor', done:false, date:new Date().toISOString() }
    ]);
  }
}

/* =========================================================
   EXISTENCIAS (inventario)
   ---------------------------------------------------------
   stock = null  -> el producto NO lleva control (venta libre)
   stock = 0     -> agotado: no se puede vender
   stock <= minStock -> queda poco: se avisa en la app
========================================================= */
function stockInfo(p){
  const control = !!p && p.stock !== null && p.stock !== undefined;
  const stock   = control ? Number(p.stock) : Infinity;
  const min     = control ? (p.minStock == null ? 2 : Number(p.minStock)) : 0;
  const level   = !control ? 'off' : (stock <= 0 ? 'out' : (stock <= min ? 'low' : 'ok'));
  const label   = !control ? ''
                : (stock <= 0 ? 'Agotado'
                : (stock <= min ? 'Quedan ' + stock : stock + ' disponibles'));
  return { control, stock, min, level, label };
}
function inCartQty(productId){
  const it = cart.find(c => c.productId === productId);
  return it ? it.qty : 0;
}
/** Piezas que todavía se pueden agregar al carrito. */
function freeStock(p){
  const st = stockInfo(p);
  if(!st.control) return Infinity;
  return Math.max(0, st.stock - inCartQty(p.id));
}
function lowStockProducts(){
  return DB.getProducts().filter(p => {
    if(!p.active) return false;
    const st = stockInfo(p);
    return st.control && st.level !== 'ok';
  });
}
function stockBadge(p){
  const st = stockInfo(p);
  if(!st.control) return '';
  const ico = st.level === 'out' ? icon('alert') : icon('boxes');
  return '<span class="stock-badge ' + st.level + '">' + ico + st.label + '</span>';
}

/* ---------- Helpers ---------- */
function formatMoney(n){
  n = round2(n);
  return '$' + n.toLocaleString('es-MX', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function formatDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('es-MX', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function formatDateShort(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX', { day:'2-digit', month:'short' });
}
function findProduct(id){ return DB.getProducts().find(p => p.id === id); }
function categoryOf(id){ return DB.getCategories().find(c => c.id === id) || UNCATEGORIZED; }
function serviceOf(id){ return SERVICE_TYPES.find(s => s.id === id) || SERVICE_TYPES[0]; }
function paymentOf(id){ return PAYMENT_METHODS.find(p => p.id === id) || PAYMENT_METHODS[0]; }
function orderNumberLabel(n){ return '#' + String(n).padStart(4,'0'); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function startOfWeek(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // lunes=0
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() - day);
  return date;
}
function isSameWeek(a,b){ return startOfWeek(a).getTime() === startOfWeek(b).getTime(); }
function isSameMonth(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth(); }

function toast(msg, opts){
  opts = opts || {};
  const t = document.getElementById('toast');
  t.innerHTML = (opts.icon ? `<span class="toast-icon">${opts.icon}</span>` : '') +
    `<span class="toast-text">
      <span class="toast-title">${msg}</span>
      ${opts.subtitle ? `<span class="toast-sub">${escapeHtml(opts.subtitle)}</span>` : ''}
    </span>`;
  t.className = 'toast show' + (opts.variant ? ' ' + opts.variant : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.classList.remove('show'); }, opts.duration || 1900);
}

/* ---------- Vibración / haptics ----------
   navigator.vibrate funciona en Android (Chrome/WebView). Safari e iOS no
   implementan la Vibration API para páginas web (limitación de la
   plataforma, no del código): ahí esta función simplemente no hace nada,
   sin generar errores. Nota: si estás probando esto dentro de la vista
   previa del chat, algunos navegadores/iframes bloquean la vibración por
   política de permisos; para probarla de verdad, abre el archivo .html
   directamente en el navegador del teléfono Android. */
function vibrate(pattern){
  try{
    if(typeof userPrefs === 'function' && userPrefs().haptics === false) return;
    if(navigator.vibrate){ navigator.vibrate(pattern); }
  }catch(e){ /* silencioso */ }
}

  else if(currentView === 'sale') el.innerHTML = renderSale();
  else if(currentView === 'history'){ el.innerHTML = renderHistoryShell(); renderHistoryList(); }
  else if(currentView === 'stats') el.innerHTML = renderStats();
  else if(currentView === 'products') el.innerHTML = renderProducts();
  else if(currentView === 'account') el.innerHTML = renderAccount();
  const chip = document.getElementById('userChip');
  if(chip) chip.classList.toggle('active', currentView === 'account');
}

/* =========================================================
   PENDIENTES (mini lista de tareas del negocio)
   Se guardan igual que los productos y las ventas, en este
   dispositivo, así que siguen ahí al volver a abrir la app.
========================================================= */
function todoListHTML(){
  const todos = DB.getTodos().slice().sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
  if(todos.length === 0){
    return `<div class="todo-empty">Sin pendientes por ahora.<br>Escribe uno arriba: “comprar servilletas”, “pagar al proveedor”…</div>`;
  }
  const porHacer = todos.filter(t => !t.done).length;
  const hayHechos = todos.some(t => t.done);
  return todos.map(t => `
    <div class="todo-item ${t.done ? 'done' : ''}">
      <button class="todo-check" onclick="toggleTodo('${t.id}')" aria-label="Marcar">${icon('check')}</button>
      <button class="todo-text" onclick="editTodo('${t.id}')">${escapeHtml(t.text)}</button>
      <button class="todo-del" onclick="deleteTodo('${t.id}')" aria-label="Borrar">${icon('trash')}</button>
    </div>
  `).join('') + `
    <div class="todo-foot">
      <span>${porHacer === 0 ? '¡Todo listo!' : porHacer + (porHacer === 1 ? ' pendiente' : ' pendientes')}</span>
      ${hayHechos ? `<button onclick="clearDoneTodos()">Borrar terminados</button>` : ''}
    </div>`;
}

/* Solo repinta la lista: así no se pierde lo que estás escribiendo. */
function refreshTodos(){
  const box = document.getElementById('todoList');
  if(box){
    box.innerHTML = todoListHTML();
    const count = document.getElementById('todoCount');
    const porHacer = DB.getTodos().filter(t => !t.done).length;
    if(count) count.textContent = porHacer + ' por hacer';
  } else if(currentView === 'home'){
    render();
  }
}

function addTodo(){
  const input = document.getElementById('todoInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text){ input.focus(); return; }
  const todos = DB.getTodos();
  todos.unshift({ id:'t' + Date.now(), text: text, done:false, date:new Date().toISOString() });
  DB.saveTodos(todos);
  input.value = '';
  vibrate(10);
  refreshTodos();
  input.focus();
}

function toggleTodo(id){
  const todos = DB.getTodos();
  const t = todos.find(x => x.id === id);
  if(!t) return;
  t.done = !t.done;
  DB.saveTodos(todos);
  vibrate(t.done ? [10, 40, 10] : 10);
  refreshTodos();
}

function deleteTodo(id){
  DB.saveTodos(DB.getTodos().filter(t => t.id !== id));
  vibrate(10);
  refreshTodos();
  toast('Pendiente eliminado');
}

function clearDoneTodos(){
  DB.saveTodos(DB.getTodos().filter(t => !t.done));
  vibrate(10);
  refreshTodos();
  toast('Listo, borramos los terminados', { icon:icon('check'), variant:'toast-success' });
}

function editTodo(id){
  const t = DB.getTodos().find(x => x.id === id);
  if(!t) return;
  openModal(`
    <h3 class="sheet-title">Editar pendiente</h3>
    <div class="field">
      <label>¿Qué tienes que hacer?</label>
      <input id="todoEdit" type="text" maxlength="80" value="${escapeHtml(t.text)}"
             onkeydown="if(event.key === 'Enter'){ event.preventDefault(); saveTodoEdit('${t.id}'); }">
    </div>
    <div class="sheet-actions">
      <button class="btn danger block" onclick="closeModal(); deleteTodo('${t.id}');">${icon('trash')} Eliminar</button>
      <button class="btn primary block" onclick="saveTodoEdit('${t.id}')">Guardar</button>
    </div>
  `, { dismissible:true });
  setTimeout(function(){
    const el = document.getElementById('todoEdit');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 60);
}

function saveTodoEdit(id){
  const el = document.getElementById('todoEdit');
  if(!el) return;
  const text = el.value.trim();
  if(!text){ toast('Escribe el pendiente'); return; }
  const todos = DB.getTodos();
  const t = todos.find(x => x.id === id);
  if(!t) return;
  t.text = text;
  DB.saveTodos(todos);
  closeModal();
  refreshTodos();
  toast('Pendiente actualizado', { icon:icon('check'), variant:'toast-success' });
}

            <div class="pc-photo ${p.image ? '' : 'is-placeholder'}">

            </div>
            <div class="pc-inner">
              <div class="pc-cat">${escapeHtml(cat.name)}</div>

              ${st.control ? `<div class="pc-stock ${st.level}">${agotado ? 'Sin existencias' : st.stock + ' en existencia'}</div>` : ''}

            </div>
          ` : `

              <div class="pc-price">${formatMoney(p.price)}</div>
            </div>
          `}
        </div>`;
      }).join('')}
    </div>`;

  const cartCount = cart.reduce((a,c)=>a+c.qty,0);
  const totals = computeTotals();
  const cartThumbs = cart.slice(0,2).map(c => findProduct(c.productId)).filter(Boolean);

  return `

            </span>
            <span class="cartbar-total">${formatMoney(totals.total)}</span>
            <span class="cartbar-chevron">${icon('chevronRight')}</span>
          </span>
        </button>
      </div>
    ` : ''}
  `;

function addToCart(productId){
  const p = findProduct(productId);
  if(!p) return;
  const st = stockInfo(p);

  // Sin existencias: no se puede vender.
  if(st.control && st.stock <= 0){
    vibrate(40);
    toast('Se acabó este producto', {
      icon: icon('alert'), variant:'toast-danger toast-top',
      subtitle: p.name + ' · agrega existencias para venderlo', duration: 2200
    });
    return;
  }
  // Ya está todo lo disponible dentro del carrito.
  if(st.control && inCartQty(productId) >= st.stock){
    vibrate(40);
    toast('Solo te quedan ' + st.stock, {
      icon: icon('alert'), variant:'toast-danger toast-top',
      subtitle: p.name, duration: 2000
    });
    return;
  }

  const item = cart.find(c => c.productId === productId);
  if(item){ item.qty += 1; } else { cart.push({ productId, qty:1 }); }

  const restan = st.control ? (st.stock - inCartQty(productId)) : null;
  const pocas  = st.control && restan <= st.min;

  vibrate(25);
  toast('Producto agregado al carrito', {
    icon: pocas ? icon('alert') : icon('check'),
    variant: pocas ? 'toast-danger toast-top' : 'toast-success toast-top',
    subtitle: p.name + (st.control ? ' · quedan ' + restan : ''),
    duration: pocas ? 1800 : 1100
  });
  render();
}

function changeQtyFromGrid(productId, delta){
  const p = findProduct(productId);
  const st = stockInfo(p);
  if(delta > 0 && st.control && inCartQty(productId) >= st.stock){
    vibrate(40);
    toast(st.stock <= 0 ? 'Se acabó este producto' : 'Solo te quedan ' + st.stock, {
      icon: icon('alert'), variant:'toast-danger toast-top',
      subtitle: p ? p.name : '', duration: 1800
    });
    return;
  }
  const item = cart.find(c => c.productId === productId);
  if(item){
    item.qty += delta;
    if(item.qty <= 0){ cart = cart.filter(c => c.productId !== productId); }
  } else if(delta > 0){
    cart.push({ productId, qty:1 });
  }
  vibrate(10);
  render();
}

function computeTotals(){
  const subtotal = cart.reduce((a,c) => {
    const p = findProduct(c.productId);
    return a + (p ? p.price * c.qty : 0);
  }, 0);
  const iva = subtotal * IVA_RATE;
  const total = subtotal + iva;
  return { subtotal: round2(subtotal), iva: round2(iva), total: round2(total) };
}

/* ---------- Carrito / checkout (modal) ---------- */
function openModal(html, opts){
  opts = opts || {};
  const layer = document.getElementById('modal-layer');
  layer.innerHTML = `<div class="modal-overlay ${opts.center?'modal-center':''}" id="modalOverlay">
      <div class="modal-sheet ${opts.card?'modal-card':''}">
        ${opts.grip !== false ? '<div class="sheet-grip"></div>' : ''}
        ${html}
      </div>
    </div>`;
  if(opts.dismissible !== false){
    document.getElementById('modalOverlay').addEventListener('click', function(e){
      if(e.target.id === 'modalOverlay') closeModal();
    });
  }
}
function closeModal(){ document.getElementById('modal-layer').innerHTML = ''; }

function openCartSheet(step){
  if(cart.length === 0 && step !== 'cart'){ step = 'cart'; }
  openModal(cartSheetHTML(step), { dismissible:true });
}
