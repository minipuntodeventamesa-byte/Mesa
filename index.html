  .md-swatch span.c svg{ width:18px; height:18px; opacity:0; }
  .md-swatch.active span.c{ box-shadow:0 0 0 2.5px var(--ink); transform:scale(1.06); }
  .md-swatch.active span.c svg{ opacity:1; }
  .md-swatch.active{ color:var(--ink); }
  .md-custom-color{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:9px 12px; margin-bottom:16px; }
  .md-custom-color input[type=color]{ width:40px; height:40px; border:none; border-radius:10px; padding:0; background:none; cursor:pointer; flex-shrink:0; }
  .md-custom-color input[type=color]::-webkit-color-swatch-wrapper{ padding:0; }
  .md-custom-color input[type=color]::-webkit-color-swatch{ border:none; border-radius:10px; }
  .md-custom-color .t{ flex:1; min-width:0; }
  .md-custom-color .t b{ display:block; font-size:14px; }
  .md-custom-color .t span{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); font-family:var(--mono); margin-top:2px; }
  .md-preview{ background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-card); padding:14px; margin-bottom:18px; }
  .md-preview-k{ font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.3px; margin-bottom:10px; }
  .md-pv-top{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .md-pv-mark{ width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
  .md-pv-mark svg{ width:17px; height:17px; }
  .md-pv-name{ font-size:15px; font-weight:800; }
  .md-pv-chips{ display:flex; gap:6px; margin-bottom:12px; }
  .md-pv-chip{ font-size:12px; font-weight:700; padding:7px 12px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft); }
  .md-pv-card{ display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:13px; padding:10px 12px; border:2px solid; }

  body[data-section="sale"] .opt-card.active{ border-color:var(--brand); background:var(--brand-soft); color:var(--brand-ink); }
  .filter-chip.active{ background:var(--brand); color:#fff; box-shadow:0 4px 10px rgba(var(--brand-rgb),.28); }
  .section-title::before{ background:var(--brand); }
  .field input:focus, .field select:focus, .md-textarea:focus, .todo-add input:focus{ border-color:var(--brand); outline:none; }
  .user-chip.active{ border-color:var(--brand); background:var(--brand-soft); }
  .avatar-btn.active{ border-color:var(--brand); }
  .todo-item.done .todo-check{ background:var(--brand); border-color:var(--brand); }
  .todo-add button{ background:var(--brand); }
  body[data-section="sale"] .chip.active{ color:#fff; }
  .navbtn.active{ background:var(--brand-soft); color:var(--brand-ink); }
  .navbtn.active[data-view="account"]{ background:var(--brand-soft); color:var(--brand-ink); }
  body[data-section="products"] #view .prod-row{ border-left-color:var(--sec-products); }

  /* ---------- Inicio ---------- */
  .cta-home{
    background:linear-gradient(125deg, var(--brand) 0%, #6A4BEA 55%, var(--brand-2) 100%);
    color:#fff; box-shadow:0 14px 30px rgba(var(--brand-rgb),.34);
    position:relative; overflow:hidden;
  }
  .cta-home::after{
    content:''; position:absolute; right:-40px; top:-60px; width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 70%); pointer-events:none;
  }
  .cta-home .cta-sub{ color:rgba(255,255,255,.82); }
  .cta-home .cta-arrow{ color:#fff; }
  .cta-home-icon{ background:rgba(255,255,255,.2); color:#fff; }
  body[data-section="home"] #view .stat-icon{ background:var(--brand-soft); color:var(--brand-ink); }

  /* ---------- Nueva venta ---------- */
  .product-card.in-cart{ border-color:var(--brand); box-shadow:0 6px 18px rgba(var(--brand-rgb),.25); }
  .cartbar-inner{ border-color:rgba(var(--brand-rgb),.55); }
  .cartbar-icon, .cart-total-pill .ctp-icon{ background:var(--brand); }
  .doc-note{
    display:flex; gap:10px; align-items:flex-start; background:var(--brand-soft); color:var(--brand-ink);
    border-radius:13px; padding:11px 13px; font-size:12.5px; font-weight:600; line-height:1.45; margin:0 0 14px;
  }
  .doc-note svg{ width:19px; height:19px; flex-shrink:0; }
  .doc-note b{ display:block; font-size:13.5px; }

  /* ---------- Mi cuenta ---------- */
  .profile-hero{ background:linear-gradient(135deg,#3E38C8 0%, #2A2685 70%, #211F63 100%); box-shadow:0 14px 30px rgba(42,38,133,.3); }
  .profile-avatar{ background:#fff; color:var(--brand-ink); }
  .auth-hero{ background:linear-gradient(160deg,#2C2F7E 0%, #1C1F52 62%, #13153A 100%); }
  @media (min-width:900px){
    .auth-screen::before{ background:linear-gradient(160deg,#2C2F7E 0%, #1C1F52 62%, #13153A 100%); }
    .auth-side-brand .mark{ background:linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow:0 4px 10px rgba(var(--brand-rgb),.35); }
  }

  /* ---------- Información del negocio: logo y comprobante ---------- */
  .biz-logo-row{
    display:flex; gap:14px; align-items:center; margin-bottom:18px;
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px;
  }
  .biz-logo{
    width:80px; height:80px; border-radius:18px; border:1.5px dashed var(--ink-faint); background:var(--surface-alt);
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft); overflow:hidden; flex-shrink:0; cursor:pointer;
  }
  .biz-logo svg{ width:26px; height:26px; }
  .biz-logo.has-image{ border-style:solid; border-color:var(--border); background:#fff; }
  .biz-logo img{ width:100%; height:100%; object-fit:contain; }
  .biz-logo-txt{ min-width:0; }
  .biz-logo-txt b{ display:block; font-size:14.5px; }
  .biz-logo-txt > span{ display:block; font-size:12px; color:var(--ink-soft); font-weight:600; line-height:1.4; margin-top:2px; }
  .biz-logo-actions{ display:flex; gap:6px; margin-top:8px; }
  .biz-logo-actions .btn{ padding:8px 12px; font-size:12.5px; }
  .doc-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px; }
  .doc-opt{
    border:1.5px solid var(--border); background:var(--surface); border-radius:14px; padding:12px 7px;
    text-align:center; display:flex; flex-direction:column; gap:3px; align-items:center; color:var(--ink); font-family:inherit;
    transition:border-color .15s, background .15s, box-shadow .15s;
  }
  .doc-opt .doc-emoji{ font-size:21px; line-height:1.2; }
  .doc-opt b{ font-size:12.5px; }
  .doc-opt span:last-child{ font-size:10.5px; color:var(--ink-soft); font-weight:600; line-height:1.3; }
  .doc-opt.active{ border-color:var(--brand); background:var(--brand-soft); box-shadow:0 0 0 3px rgba(var(--brand-rgb),.12); }

  /* ---------- Aviso de pedidos en Inicio y en el menú inferior ---------- */
  .navbtn{ position:relative; }
  .nav-badge{
    position:absolute; top:3px; left:calc(50% + 5px); min-width:18px; height:18px; padding:0 5px;
    border-radius:999px; background:var(--accent-2); color:#fff; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--nav-bg); line-height:1;
    animation:cartbarPop .3s cubic-bezier(.34,1.56,.64,1);
  }
  .mdi-home-card{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; color:var(--ink);
    background:linear-gradient(120deg, var(--sec-menu-soft), #FFFFFF 85%);
    border:1px solid #D5D7FB; border-radius:var(--radius-card); padding:13px 14px; margin-top:16px;
    box-shadow:0 8px 20px rgba(var(--brand-rgb),.12);
  }
  .mdi-home-ico{
    position:relative; width:42px; height:42px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(135deg, var(--brand), var(--brand-2)); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .mdi-home-ico svg{ width:20px; height:20px; }
  .mdi-home-ico span{
    position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; padding:0 5px; border-radius:999px;
    background:var(--accent-2); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;
    border:2px solid #fff;
  }

  /* ---------- Pedidos entrantes (lista) ---------- */
  .mdi-title{ scroll-margin-top:calc(var(--topbar-h, 74px) + 8px); }
  .mdi-count{ margin-left:auto; font-size:11.5px; font-weight:800; color:#fff; background:var(--accent-2); padding:3px 10px; border-radius:999px; }
  .mdi-today{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-bottom:12px; }
  .mdi-today > div{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 11px; box-shadow:var(--shadow-card); min-width:0; }
  .mdi-today span{ display:block; font-size:11px; font-weight:700; color:var(--ink-soft); }
  .mdi-today b{ display:block; font-size:17px; font-weight:800; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mdi-today b.warn{ color:var(--accent-2); }
  .mdi-today small{ display:block; font-size:10.5px; color:var(--ink-soft); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mdi-tabs{ display:flex; gap:6px; overflow-x:auto; margin:0 -18px 12px; padding:2px 18px; scrollbar-width:none; }
  .mdi-tabs::-webkit-scrollbar{ display:none; }
  .mdi-tabs button{
    flex:0 0 auto; border:1.5px solid var(--border); background:var(--surface); border-radius:999px;
    padding:8px 11px; font-size:12.5px; font-weight:700; color:var(--ink-soft); display:inline-flex; gap:5px; align-items:center;
  }
  .mdi-tabs button span{ background:var(--surface-alt); color:var(--ink); font-size:11px; font-weight:800; border-radius:999px; padding:1px 7px; }
  .mdi-tabs button.active{ background:var(--ink); color:#fff; border-color:transparent; }
  .mdi-tabs button.active span{ background:rgba(255,255,255,.2); color:#fff; }
  .mdi-list{ display:grid; grid-template-columns:minmax(0,1fr); gap:10px; }
  .mdi-card{
    width:100%; text-align:left; font-family:inherit; color:var(--ink);
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--ink-faint);
    border-radius:16px; padding:12px 14px; box-shadow:var(--shadow-card);
    display:flex; flex-direction:column; gap:6px; transition:transform .12s ease; min-width:0;
  }
  .mdi-card:active{ transform:scale(.985); }
  .mdi-card.st-nuevo{ border-left-color:var(--accent-strong); }
  .mdi-card.st-ok{ border-left-color:var(--success); }
  .mdi-card.st-no{ border-left-color:var(--accent-2); }
  .mdi-card.st-no .mdi-name, .mdi-card.st-no .mdi-card-foot b{ color:var(--ink-soft); }
  .mdi-card-top{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .mdi-code{ font-family:var(--mono); font-weight:800; font-size:13px; letter-spacing:.4px; }
  .mdi-time{ margin-left:auto; font-size:11.5px; font-weight:700; color:var(--ink-soft); }
  .mdi-pill{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; padding:3px 8px;
    border-radius:999px; background:var(--surface-alt); color:var(--ink-soft); white-space:nowrap;
  }
  .mdi-pill svg{ width:11px; height:11px; }
  .mdi-pill.nuevo{ background:var(--accent-soft); color:#8A6000; }
  .mdi-pill.ok{ background:var(--success-bg); color:#1F7F55; }
  .mdi-pill.no{ background:var(--danger-bg); color:var(--accent-2); }
  .mdi-pill.mod{ background:var(--brand-soft); color:var(--brand-ink); }
  .mdi-pill.wa{ background:#E3F8EA; color:#0E7A3D; }
  .mdi-name{ display:flex; align-items:center; gap:6px; font-size:14.5px; font-weight:800; }
  .mdi-name svg{ width:15px; height:15px; color:var(--ink-soft); flex-shrink:0; }
  .mdi-items{ font-size:12.5px; font-weight:600; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mdi-card-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12px; font-weight:700; color:var(--ink-soft); padding-top:7px; border-top:1px dashed var(--border); }
  .mdi-card-foot b{ font-size:16px; color:var(--ink); white-space:nowrap; }
  .mdi-empty{
    text-align:center; background:var(--surface); border:1.5px dashed var(--border); border-radius:16px;
    padding:26px 20px; display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .mdi-empty-ico{ width:54px; height:54px; border-radius:17px; background:var(--sec-menu-soft); color:var(--sec-menu-ink); display:flex; align-items:center; justify-content:center; margin-bottom:6px; }
  .mdi-empty-ico svg{ width:26px; height:26px; }
  .mdi-empty b{ font-size:15px; }
  .mdi-empty span:last-child{ font-size:13px; color:var(--ink-soft); line-height:1.5; max-width:330px; font-weight:500; }
  .mdi-foot-actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .mdi-foot-actions .btn{ padding:12px 8px; font-size:13px; background:var(--surface); }

  /* ---------- Pedido: detalle ---------- */
  .mdi-meta{ display:flex; flex-direction:column; gap:5px; margin:-6px 0 14px; font-size:13px; color:var(--ink-soft); font-weight:600; }
  .mdi-meta span{ display:flex; align-items:center; gap:7px; }
  .mdi-meta b{ color:var(--ink); font-size:14.5px; }
  .mdi-meta svg{ width:15px; height:15px; flex-shrink:0; }
  .sheet-header-left .mdi-pill{ font-size:11px; }
  .mdi-banner{ display:flex; gap:10px; align-items:flex-start; border-radius:14px; padding:12px 13px; margin-bottom:14px; font-size:13px; font-weight:600; line-height:1.45; }
  .mdi-banner svg{ width:18px; height:18px; flex-shrink:0; margin-top:1px; }
  .mdi-banner b{ display:block; font-size:14px; font-weight:800; }
  .mdi-banner.ok{ background:var(--success-bg); color:#1F6B49; }
  .mdi-banner.no{ background:var(--danger-bg); color:#8A3A32; }
  .mdi-banner.warn{ background:var(--accent-soft); color:#6B4A00; margin-top:4px; }
  .mdi-compare{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:18px; box-shadow:var(--shadow-card); }
  .mdi-compare-head{ display:flex; gap:12px; align-items:center; }
  .mdi-compare-head .acc-sub{ white-space:normal; }
  .mdi-compare-ico{ width:40px; height:40px; border-radius:13px; background:#E3F8EA; color:#12A150; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mdi-compare-ico svg{ width:21px; height:21px; }
  .mdi-wa-details{ margin-top:12px; }
  .mdi-wa-details summary{ font-size:13px; font-weight:800; color:var(--sec-menu-ink); cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px; }
  .mdi-wa-details summary::-webkit-details-marker{ display:none; }
  .mdi-wa-details summary::before{ content:'▸'; font-size:12px; transition:transform .15s; }
  .mdi-wa-details[open] summary::before{ transform:rotate(90deg); }
  .mdi-wa-bubble{
    margin-top:9px; background:#DCF8C6; border-radius:14px 14px 14px 4px; padding:10px 12px;
    font-size:12.5px; line-height:1.55; color:#1B2A1B; max-height:240px; overflow:auto; font-weight:500; word-break:break-word;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
  }
  .mdi-compare-actions{ display:grid; grid-template-columns:1fr 1.5fr; gap:8px; margin-top:8px; }
  .mdi-compare-actions .btn{ padding:11px 10px; font-size:13.5px; }
  .mdi-result{ margin-top:12px; border-radius:12px; padding:11px 12px; font-size:12.5px; line-height:1.5; }
  .mdi-result > b{ display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:800; }
  .mdi-result > b svg{ width:16px; height:16px; }
  .mdi-result.ok{ background:var(--success-bg); color:#1F6B49; }
  .mdi-result.ok span{ display:block; margin-top:2px; }
  .mdi-result.warn{ background:var(--accent-soft); color:#5E4100; }
  .mdi-result ul{ margin:6px 0 0; padding-left:18px; }
  .mdi-result li{ margin:4px 0; }
  .mdi-block-title{ display:flex; align-items:center; justify-content:space-between; font-size:15px; font-weight:800; margin:4px 0 10px; }
  .mdi-lines{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:2px 12px; box-shadow:var(--shadow-card); overflow:hidden; }
  .mdi-line{ display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); align-items:flex-start; }
  .mdi-line:last-child{ border-bottom:none; }
  .mdi-line.changed{ background:linear-gradient(90deg, var(--brand-soft), rgba(238,239,255,0) 75%); margin:0 -12px; padding-left:12px; padding-right:12px; }
  .mdi-line.unknown{ background:linear-gradient(90deg, var(--danger-bg), rgba(251,234,232,0) 75%); margin:0 -12px; padding-left:12px; padding-right:12px; }
  .mdi-thumb{ width:44px; height:44px; border-radius:12px; overflow:hidden; background:var(--surface-alt); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); }
  .mdi-thumb img{ width:100%; height:100%; object-fit:cover; }
  .mdi-thumb svg{ width:20px; height:20px; }
  .mdi-line-main{ flex:1; min-width:0; }
  .mdi-line-name{ font-size:13.5px; font-weight:700; line-height:1.3; word-break:break-word; }
  .mdi-tag{ display:inline-block; font-size:10px; font-weight:800; padding:1px 7px; border-radius:999px; background:var(--brand); color:#fff; vertical-align:1px; }
  .mdi-line-sub{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:2px; }
  .mdi-warn{ display:block; margin-top:6px; font-size:11.5px; font-weight:700; color:var(--accent-2); line-height:1.4; }
  .mdi-warn svg{ display:inline-block; width:13px; height:13px; vertical-align:-2px; margin-right:3px; }
  .mdi-warn.soft{ color:#8A6000; }
  .mdi-warn button{ margin-left:4px; border:none; background:var(--brand-soft); color:var(--brand-ink); font-weight:800; font-size:11px; border-radius:999px; padding:3px 10px; font-family:inherit; }
  .mdi-line-right{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
  .mdi-line-right .qty-control.mini .qty-btn svg{ width:12px; height:12px; }
  .mdi-line-right .qty-val{ white-space:nowrap; }
  .mdi-line-amt{ font-size:13.5px; font-weight:800; white-space:nowrap; }
  .mdi-edit{ border:none; background:var(--surface-alt); color:var(--ink-soft); width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .mdi-edit svg{ width:14px; height:14px; }
  .mdi-qty-ro{ font-size:13px; font-weight:800; color:var(--ink-soft); white-space:nowrap; }
  .mdi-removed{ margin-top:10px; font-size:12.5px; color:#8A3A32; background:var(--danger-bg); border-radius:12px; padding:9px 12px; line-height:1.45; font-weight:600; }
  .mdi-line-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .mdi-line-actions .btn{ flex:1 1 40%; padding:11px 10px; font-size:13.5px; background:var(--surface); }
  .mdi-decide{
    display:grid; grid-template-columns:1fr 1.9fr; gap:10px; margin:18px -20px -28px; padding:12px 20px calc(18px + env(safe-area-inset-bottom));
    position:sticky; bottom:-28px; background:linear-gradient(to top, var(--bg) 78%, rgba(243,244,250,0)); z-index:2;
  }
  .mdi-decide .btn{ padding:15px 10px; }
  .btn.mdi-confirm{ background:var(--success); color:#fff; box-shadow:0 8px 18px rgba(51,168,115,.32); }
  .btn.mdi-confirm:disabled{ box-shadow:none; }
  .mdi-after{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .mdi-after .btn{ flex:1 1 45%; padding:12px 10px; font-size:13.5px; }
  .mdi-after .btn.ghost{ background:var(--surface); }

  /* ---------- Historial, ticket y ventas ---------- */
  .tag.md{ background:var(--sec-menu-soft); color:var(--sec-menu-ink); margin:0 0 0 4px; vertical-align:1px; }
  .tag.fact{ background:var(--brand-soft); color:var(--brand-ink); margin:0 0 0 4px; vertical-align:1px; }
  .sale-row-badge.md{ background:var(--sec-menu-soft); }
  .ticket-origin{
    margin:8px 0 2px; font-size:11.5px; font-weight:700; line-height:1.45; font-family:var(--sans);
    background:var(--sec-menu-soft); color:var(--sec-menu-ink); border-radius:9px; padding:6px 9px;
  }
  .origin-seg{ max-width:440px; }
  .origin-seg button{ display:inline-flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; }
  .origin-seg button svg{ width:15px; height:15px; }
  .origin-seg button.active{ color:var(--sec-stats-ink); }
  .vbar.md{ background:var(--sec-menu); }
  body[data-section="stats"] #view .stat-card.md-stat{ border-top-color:var(--sec-menu); }
  .md-stat a{ color:var(--sec-menu-ink); font-weight:800; text-decoration:none; }
  .chart-col.sel .dot{ background:var(--brand); border-color:var(--brand); }

  /* ---------- Cotización: formulario y vista previa ---------- */
  .inv-recent{ display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 0; }
  .inv-recent .filter-chip{ padding:7px 12px; font-size:12.5px; }
  .modal-sheet.inv-sheet{ max-width:560px; }
  .inv-preview{
    width:100%; overflow:hidden; border-radius:14px; background:#E4E7F0;
    box-shadow:inset 0 0 0 1px var(--border); position:relative;
  }
  .inv-scale{ width:816px; transform-origin:top left; }
  .inv-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .inv-actions .btn{ flex:1 1 40%; padding:12px 10px; font-size:13.5px; }
  .inv-actions .btn.ghost{ background:var(--surface); }
  .inv-actions .btn.block{ flex-basis:100%; }
  .inv-badge{
    width:100%; display:flex; align-items:center; gap:10px; text-align:left; font-family:inherit;
    background:var(--brand-soft); border:1px solid rgba(var(--brand-rgb),.18); color:var(--brand-ink);
    border-radius:14px; padding:10px 12px; margin-bottom:12px;
  }
  .inv-badge svg{ width:18px; height:18px; flex-shrink:0; }
  .inv-badge span{ flex:1; font-size:12px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .inv-badge b{ display:block; font-size:13.5px; }
  @media (min-width:700px){ .modal-sheet.inv-sheet{ max-width:760px; } }

  /* ---------- Cotización: el documento (hoja carta) ---------- */
  .invdoc{
    width:816px; min-height:1056px; box-sizing:border-box; background:#fff; color:#1B2033;
    font-family:var(--sans); font-size:12.5px; line-height:1.45; padding:0 56px 40px;

<div id="splash" aria-hidden="true">
  <span class="splash-mark"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.3 8.6h13.4l-1.05 10.9a1.7 1.7 0 0 1-1.7 1.5H8.05a1.7 1.7 0 0 1-1.7-1.5L5.3 8.6Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M9 8.6V7.2a3 3 0 0 1 6 0v1.4" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="m9.3 14.3 1.9 1.9 3.6-3.9" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span class="splash-name">Vendo</span>
</div>
<script>
/* El logo solo se muestra cuando se ABRE Mesa. Si la página se recarga
   (o se regresa con el botón de atrás), el splash se quita de inmediato,
   antes de que se alcance a ver. */
(function(){
  var sp = document.getElementById('splash');
  if(!sp) return;

  var yaSeVio = false;
  try{ yaSeVio = sessionStorage.getItem('mesaSplashVisto') === '1'; }catch(e){}

  var esRecarga = false;
  try{
    var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || null;
    var tipo = nav ? nav.type
                   : (performance.navigation && performance.navigation.type === 1 ? 'reload' : '');
    esRecarga = (tipo === 'reload' || tipo === 'back_forward');
  }catch(e){}

  if(yaSeVio || esRecarga){ sp.remove(); return; }

  try{ sessionStorage.setItem('mesaSplashVisto','1'); }catch(e){}

  sp.addEventListener('animationend', function(ev){
    if(ev.animationName === 'splash-out' && sp.parentNode) sp.remove();
  });
})();
</script>

<script>
/* Mide el alto real del encabezado y de la barra inferior (en iPhone cambia
   al deslizar porque Safari esconde su barra y aparece la franja inferior)
   para que el carrito y el índice de categorías nunca queden tapados. */
(function(){
  function medir(){
    var root = document.documentElement;
    var top = document.querySelector('.topbar');
    var nav = document.querySelector('.bottomnav');
    if(top) root.style.setProperty('--topbar-h', top.getBoundingClientRect().height + 'px');
    if(nav){
      var abajo = window.matchMedia('(min-width:700px)').matches ? 0 : nav.getBoundingClientRect().height;
      root.style.setProperty('--nav-h', abajo + 'px');
    }
  }
  function iniciar(){
    medir();
    if(window.ResizeObserver){
      var ro = new ResizeObserver(medir);
      document.querySelectorAll('.topbar, .bottomnav').forEach(function(el){ ro.observe(el); });
    }
    window.addEventListener('resize', medir);
    window.addEventListener('orientationchange', medir);
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', medir);
      window.visualViewport.addEventListener('scroll', medir);
    }
    window.addEventListener('scroll', medir, { passive:true });

function initDB(){

  if(localStorage.getItem('mesa_categories') === null){ DB.saveCategories(defaultCategories()); }
  if(localStorage.getItem('mesa_sales') === null){ DB.saveSales([]); }
  if(localStorage.getItem('mesa_counter') === null){ localStorage.setItem('mesa_counter','0'); }

  // Productos de demostración guardados antes de existir el precio de producción:
  // se les pone el simulado UNA vez (solo si nunca tuvieron dato: undefined).
  // Si tú lo dejaste vacío a propósito (null) o lo cambiaste, no se toca.
  const list = DB.getProducts();
  let changed = false;
  list.forEach(p => {
    if(p.cost === undefined && DEMO_COSTS[p.id] !== undefined){ p.cost = DEMO_COSTS[p.id]; changed = true; }
    // Productos guardados antes de que existiera el inventario:
    // quedan SIN control de existencias (stock = null) hasta que el
    // dueño lo active desde el formulario del producto.
    if(p.stock === undefined){ p.stock = null; changed = true; }
    if(p.minStock === undefined){ p.minStock = 2; changed = true; }
    // Tamaños/presentaciones (medio litro, litro, 2 litros, por kilo, etc.):
    // productos guardados antes de que existiera esta opción quedan sin ella.
    if(p.sizesOn === undefined){ p.sizesOn = false; changed = true; }
    if(p.sizeUnit === undefined || !SIZE_UNITS[p.sizeUnit]){ p.sizeUnit = 'litro'; changed = true; }
    if(!Array.isArray(p.sizes)){ p.sizes = []; changed = true; }
  });
  if(changed) DB.saveProducts(list);

  /* Pendientes de arranque. Se ponen la primera vez, y también una
     única vez si la lista quedó vacía por pruebas anteriores. Después
     de eso ya no vuelven a aparecer solos. */
  if(localStorage.getItem('mesa_todos_seed') === null){
    if(DB.getTodos().length === 0){
      DB.saveTodos([
        { id:'t1', text:'Comprar refrescos', done:false, date:new Date().toISOString() },
        { id:'t2', text:'Pagar al proveedor', done:false, date:new Date().toISOString() }
      ]);
    }
    localStorage.setItem('mesa_todos_seed', '1');
  }
}

/* =========================================================
   EXISTENCIAS (inventario)
   ---------------------------------------------------------
   stock = null  -> el producto NO lleva control (venta libre)
   stock = 0     -> agotado: no se puede vender
   stock <= minStock -> queda poco: se avisa en la app
========================================================= */
function stockInfo(p){
  const control = !!p && p.stock !== null && p.stock !== undefined;
  const stock   = control ? Number(p.stock) : Infinity;
  const min     = control ? (p.minStock == null ? 2 : Number(p.minStock)) : 0;
  const level   = !control ? 'off' : (stock <= 0 ? 'out' : (stock <= min ? 'low' : 'ok'));
  const label   = !control ? ''
                : (stock <= 0 ? 'Agotado'
                : (stock <= min ? 'Quedan ' + fmtStock(p, stock) : fmtStock(p, stock) + ' disponibles'));
  return { control, stock, min, level, label };
}
function r3(n){ return Math.round((Number(n) + Number.EPSILON) * 1000) / 1000; }
/* Cuánto descuenta una línea de las existencias. Con tamaños, cada tamaño
   cuenta lo que mide (medio kilo = 0.5 kg, 2 metros = 2 m); sin tamaños,
   la cantidad vendida (piezas, kilos, litros o metros). */
function lineStockUse(p, line){
  if(line.sizeId && p && p.sizes){
    const sz = p.sizes.find(s => s.id === line.sizeId);
    return r3(line.qty * ((sz && sz.unitQty != null) ? sz.unitQty : 1));
  }
  return r3(line.qty);
}
function cartStockUse(productId){
  const p = findProduct(productId);
  return r3(cart.filter(c => c.productId === productId).reduce((a, c) => a + lineStockUse(p, c), 0));
}
/* Suma por producto lo que se va a descontar ({ productId: cantidad }). */
function stockUseByProduct(lines, inventario){
  const uso = {};
  lines.forEach(l => {
    const prod = inventario.find(x => x.id === l.productId);
    if(!prod) return;
    uso[l.productId] = r3((uso[l.productId] || 0) + lineStockUse(prod, l));
  });
  return uso;
}
function stockProblems(uso, inventario){
  const out = [];
  Object.keys(uso).forEach(pid => {
    const prod = inventario.find(x => x.id === pid);
    const st = stockInfo(prod);
    if(st.control && uso[pid] > st.stock + 1e-9){
      out.push(prod.name + ': pides ' + fmtStock(prod, uso[pid]) + ' y ' + (st.stock <= 0 ? 'ya no hay' : 'solo hay ' + fmtStock(prod, st.stock)));
    }
  });
  return out;
}
/* Descuenta del inventario (en memoria) y regresa los que quedaron bajos. */
function deductStock(uso, inventario){
  const alertas = [];
  let cambio = false;
  Object.keys(uso).forEach(pid => {
    const prod = inventario.find(x => x.id === pid);
    const st = stockInfo(prod);
    if(!st.control) return;
    prod.stock = Math.max(0, r3(st.stock - uso[pid]));
    cambio = true;
    if(prod.stock <= st.min) alertas.push({ name: prod.name, stock: prod.stock, txt: fmtStock(prod, prod.stock) });
  });
  return { alertas, cambio };
}
function inCartQty(productId){
  // Suma todas las líneas del carrito de este producto, sin importar
  // el tamaño elegido (medio litro, litro, etc.).
  return cart.filter(c => c.productId === productId).reduce((a,c) => a + c.qty, 0);
}
function cartLinePrice(c){
  if(c.unitPrice != null) return c.unitPrice;
  const p = findProduct(c.productId);
  return p ? p.price : 0;
}
function cartAmountForProduct(productId){
  return cart.filter(c => c.productId === productId).reduce((a,c) => a + (cartLinePrice(c) * c.qty), 0);
}
/** Piezas que todavía se pueden agregar al carrito. */
function freeStock(p){
  const st = stockInfo(p);
  if(!st.control) return Infinity;
  return Math.max(0, st.stock - inCartQty(p.id));
}
function lowStockProducts(){
  return DB.getProducts().filter(p => {
    if(!p.active) return false;
    const st = stockInfo(p);
    return st.control && st.level !== 'ok';
  });
}
function stockBadge(p){
  const st = stockInfo(p);
  if(!st.control) return '';
  const ico = st.level === 'out' ? icon('alert') : icon('boxes');
  return '<span class="stock-badge ' + st.level + '">' + ico + st.label + '</span>';
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function startOfWeek(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // lunes=0
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() - day);
  return date;
}
function isSameWeek(a,b){ return startOfWeek(a).getTime() === startOfWeek(b).getTime(); }
function isSameMonth(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth(); }

/* Marca/limpia un campo obligatorio con un mensaje de error debajo,
   sin depender del toast (para que el usuario vea justo qué falta). */
function setFieldError(fieldId, message){
  const field = document.getElementById(fieldId);
  if(!field) return;
  field.classList.add('has-error');
  let msg = field.querySelector('.field-error');
  if(!msg){
    msg = document.createElement('div');
    msg.className = 'field-error';
    field.appendChild(msg);
  }
  msg.textContent = message;
}
function clearFieldError(fieldId){
  const field = document.getElementById(fieldId);
  if(!field) return;
  field.classList.remove('has-error');
  const msg = field.querySelector('.field-error');
  if(msg) msg.remove();
}

function toast(msg, opts){
  opts = opts || {};
  const t = document.getElementById('toast');
  t.innerHTML = (opts.icon ? `<span class="toast-icon">${opts.icon}</span>` : '') +
    `<span class="toast-text">
      <span class="toast-title">${msg}</span>
      ${opts.subtitle ? `<span class="toast-sub">${escapeHtml(opts.subtitle)}</span>` : ''}
    </span>`;
  t.className = 'toast show' + (opts.variant ? ' ' + opts.variant : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.classList.remove('show'); }, opts.duration || 1900);
}

/* ---------- Vibración / haptics ----------
   navigator.vibrate funciona en Android (Chrome/WebView). Safari e iOS no
   implementan la Vibration API para páginas web (limitación de la
   plataforma, no del código): ahí esta función simplemente no hace nada,
   sin generar errores. Nota: si estás probando esto dentro de la vista
   previa del chat, algunos navegadores/iframes bloquean la vibración por
   política de permisos; para probarla de verdad, abre el archivo .html
   directamente en el navegador del teléfono Android. */
function vibrate(pattern){
  try{
    if(typeof userPrefs === 'function' && userPrefs().haptics === false) return;
    if(navigator.vibrate){ navigator.vibrate(pattern); }
  }catch(e){ /* silencioso */ }
}

      <button class="todo-check" onclick="toggleTodo('${t.id}')" aria-label="Marcar">${icon('check')}</button>

  `).join('') + `
    <div class="todo-foot">
      <span>${porHacer === 0 ? '¡Todo listo!' : porHacer + (porHacer === 1 ? ' pendiente' : ' pendientes')}</span>
      ${hayHechos ? `<button onclick="clearDoneTodos()">Borrar terminados</button>` : ''}
    </div>`;
}

/* Solo repinta la lista: así no se pierde lo que estás escribiendo. */
function refreshTodos(){
  const box = document.getElementById('todoList');
  if(box){
    box.innerHTML = todoListHTML();
    const count = document.getElementById('todoCount');
    const porHacer = DB.getTodos().filter(t => !t.done).length;
    if(count) count.textContent = porHacer + ' por hacer';
  } else if(currentView === 'home'){
    render();
  }
}

function addTodo(){
  const input = document.getElementById('todoInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text){ input.focus(); return; }
  const todos = DB.getTodos();
  todos.unshift({ id:'t' + Date.now(), text: text, done:false, date:new Date().toISOString() });
  DB.saveTodos(todos);
  input.value = '';
  vibrate(10);
  refreshTodos();
  input.focus();
}

function toggleTodo(id){
  const todos = DB.getTodos();
  const t = todos.find(x => x.id === id);
  if(!t) return;
  t.done = !t.done;
  DB.saveTodos(todos);
  vibrate(t.done ? [10, 40, 10] : 10);
  refreshTodos();
}

function deleteTodo(id){
  DB.saveTodos(DB.getTodos().filter(t => t.id !== id));
  vibrate(10);
  refreshTodos();
  toast('Pendiente eliminado');
}

function clearDoneTodos(){
  DB.saveTodos(DB.getTodos().filter(t => !t.done));
  vibrate(10);
  refreshTodos();
  toast('Listo, borramos los terminados', { icon:icon('check'), variant:'toast-success' });
}

function editTodo(id){
  const t = DB.getTodos().find(x => x.id === id);
  if(!t) return;
  openModal(`
    <h3 class="sheet-title">Editar pendiente</h3>
    <div class="field">
      <label>¿Qué tienes que hacer?</label>
      <input id="todoEdit" type="text" maxlength="80" value="${escapeHtml(t.text)}"
             onkeydown="if(event.key === 'Enter'){ event.preventDefault(); saveTodoEdit('${t.id}'); }">
    </div>
    <div class="sheet-actions">
      <button class="btn danger block" onclick="closeModal(); deleteTodo('${t.id}');">${icon('trash')} Eliminar</button>
      <button class="btn primary block" onclick="saveTodoEdit('${t.id}')">Guardar</button>
    </div>
  `, { dismissible:true });
  setTimeout(function(){
    const el = document.getElementById('todoEdit');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 60);
}

function saveTodoEdit(id){
  const el = document.getElementById('todoEdit');
  if(!el) return;
  const text = el.value.trim();
  if(!text){ toast('Escribe el pendiente'); return; }
  const todos = DB.getTodos();
  const t = todos.find(x => x.id === id);
  if(!t) return;
  t.text = text;
  DB.saveTodos(todos);
  closeModal();
  refreshTodos();
  toast('Pendiente actualizado', { icon:icon('check'), variant:'toast-success' });
}

/* ---------- Aviso de existencias bajas (inicio y productos) ---------- */
function stockWarningCardHTML(){
  const bajos = lowStockProducts();
  if(bajos.length === 0) return '';
  const agotados = bajos.filter(p => stockInfo(p).level === 'out');
  const nombres = bajos.slice(0, 3).map(p => {
    const st = stockInfo(p);
    return p.name + (st.stock <= 0 ? ' (agotado)' : ' (' + fmtStock(p, st.stock) + ')');
  }).join(' · ') + (bajos.length > 3 ? ' y ' + (bajos.length - 3) + ' más' : '');

  const titulo = agotados.length
    ? (agotados.length === 1 ? 'Se acabó 1 producto' : 'Se acabaron ' + agotados.length + ' productos')
    : (bajos.length === 1 ? 'Te queda poco de 1 producto' : 'Te queda poco de ' + bajos.length + ' productos');

  return `
    <button class="alert-card ${agotados.length ? 'danger' : ''}" onclick="goTo('products')" style="margin-top:16px;">
      <span class="alert-ico">${icon('alert')}</span>
      <span class="alert-txt">
        <span class="alert-title">${titulo}</span>
        <span class="alert-sub">${escapeHtml(nombres)}</span>
      </span>
      <span class="acc-chev">${icon('chevronRight')}</span>

}

/* =========================================================
   VISTA: NUEVA VENTA
========================================================= */
function renderSale(){
  const categories = DB.getCategories();
  if(saleCategoryFilter !== 'todos' && !categories.some(c => c.id === saleCategoryFilter)){ saleCategoryFilter = 'todos'; }
  const products = DB.getProducts().filter(p => p.active);
  const list = saleCategoryFilter === 'todos' ? products : products.filter(p => p.category === saleCategoryFilter);

  const chips = `<div class="chip-row sticky-index">
      <button class="chip ${saleCategoryFilter==='todos'?'active':''}" style="${saleCategoryFilter==='todos'?'background:var(--sec-sale)':''}" onclick="setSaleCategory('todos')">Todos</button>
      ${categories.map(c => `
        <button class="chip ${saleCategoryFilter===c.id?'active':''}" style="${saleCategoryFilter===c.id?'background:var(--sec-sale)':''}" onclick="setSaleCategory('${c.id}')">${c.emoji} ${c.name}</button>
      `).join('')}
    </div>`;

  const grid = list.length === 0 ? `
      <div class="empty-state">
        ${illustration('boxEmpty')}
        <div class="empty-title">Sin productos aquí</div>
        <div class="empty-text">No hay productos activos en esta categoría.</div>
      </div>
    ` : `<div class="product-grid">
      ${list.map(p => {
        const cat = categoryOf(p.category);
        const hasSizes = !!(p.sizesOn && p.sizes && p.sizes.length);
        const qty = inCartQty(p.id);
        const st = stockInfo(p);
        const agotado = st.level === 'out';
        const sinMas = !hasSizes && st.control && (st.stock - qty) <= 0;   // ya no quedan piezas libres
        const tapAction = hasSizes ? `openSizePicker('${p.id}')` : `addToCart('${p.id}')`;
        return `<div class="product-card ${qty > 0 ? 'in-cart' : ''} ${agotado ? 'is-out' : ''}">
          ${agotado ? `<span class="pc-flag">Agotado</span>`
            : (st.level === 'low' ? `<span class="pc-flag low">Quedan ${fmtStock(p, st.stock)}</span>` : '')}
          <div class="pc-tap" onclick="${tapAction}">
            <div class="pc-top" style="background:${cat.color}"></div>
            <div class="pc-photo ${p.image ? '' : 'is-placeholder'}">
              ${p.image ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">` : icon('plateSet')}
            </div>
            <div class="pc-inner">
              <div class="pc-cat">${escapeHtml(cat.name)}</div>
              <div class="pc-name">${escapeHtml(p.name)}</div>
              ${st.control ? `<div class="pc-stock ${st.level}">${agotado ? 'Sin existencias' : fmtStock(p, st.stock) + ' en existencia'}</div>` : ''}
            </div>
          </div>
          ${hasSizes ? `
            <div class="pc-pricebar" onclick="openSizePicker('${p.id}')" style="cursor:pointer;">
              ${qty > 0
                ? `<div class="pc-qty-total">${qty} · ${formatMoney(cartAmountForProduct(p.id))}</div>`
                : `<div class="pc-price">Desde ${formatMoney(Math.min.apply(null, p.sizes.map(s => s.price)))}</div>`}
            </div>
          ` : qty > 0 ? `
            <div class="pc-qtybar">
              <div class="qty-control mini">
                <button class="qty-btn" onclick="changeQtyFromGrid('${p.id}', -1)">−</button>
                <span class="qty-val">${qty}</span>
                <button class="qty-btn" ${sinMas ? 'disabled style="opacity:.35"' : ''} onclick="changeQtyFromGrid('${p.id}', 1)">+</button>
              </div>
              <div class="pc-qty-total">${formatMoney(p.price * qty)}</div>
            </div>
          ` : `
            <div class="pc-pricebar">
              <div class="pc-price">${formatMoney(p.price)}${mdUnitSuffix(p)}</div>
            </div>
          `}
        </div>`;
      }).join('')}
    </div>`;

  const cartCount = cart.reduce((a,c)=>a+c.qty,0);
  const totals = computeTotals();
  const cartThumbs = cart.slice(0,2).map(c => findProduct(c.productId)).filter(Boolean);

  return `
    <h1 class="page-title">Nueva venta</h1>
    <p class="page-sub">Toca un producto para agregarlo al pedido</p>
    ${demoHintVisible() ? `
      <div class="alert-card" style="margin:14px 0 4px;">
        <span class="alert-ico">${icon('alert')}</span>
        <span class="alert-txt">
          <span class="alert-title">Estos productos son solo un ejemplo</span>
          <span class="alert-sub">Edítalos o bórralos en la sección de Productos y pon los tuyos con tus precios y tus fotos.</span>

    ${grid}
    ${cartCount > 0 ? `
      <div class="cartbar no-print">
        <button class="cartbar-inner" onclick="openCartSheet('cart')">
          <span class="cartbar-left">
            <span class="cartbar-icon">${icon('cart')}<span class="cartbar-count">${cartCount}</span></span>

            <span class="cartbar-chevron">${icon('chevronRight')}</span>
          </span>

function setSaleCategory(id){ saleCategoryFilter = id; render(); }

function addToCart(productId){
  const p = findProduct(productId);
  if(!p) return;
  if(p.sizesOn && p.sizes && p.sizes.length){ openSizePicker(productId); return; }
  const st = stockInfo(p);

  // Sin existencias: no se puede vender.
  if(st.control && st.stock <= 0){
    vibrate(40);
    toast('Se acabó este producto', {
      icon: icon('alert'), variant:'toast-danger toast-top',
      subtitle: p.name + ' · agrega existencias para venderlo', duration: 2200
    });
    return;
  }
  // Ya está todo lo disponible dentro del carrito.
  if(st.control && inCartQty(productId) >= st.stock){
    vibrate(40);
    toast('Solo te quedan ' + st.stock, {
      icon: icon('alert'), variant:'toast-danger toast-top',
      subtitle: p.name, duration: 2000
    });
    return;
  }

  const item = cart.find(c => c.productId === productId);
  if(item){ item.qty += 1; } else { cart.push({ productId, qty:1 }); }

  const restan = st.control ? (st.stock - inCartQty(productId)) : null;
  const pocas  = st.control && restan <= st.min;

  vibrate(25);
  toast('Producto agregado al carrito', {
    icon: pocas ? icon('alert') : icon('check'),
    variant: pocas ? 'toast-danger toast-top' : 'toast-success toast-top',
    subtitle: p.name + (st.control ? ' · quedan ' + restan : ''),
    duration: pocas ? 1800 : 1100
  });
  render();
}

function changeQtyFromGrid(productId, delta){
  const p = findProduct(productId);
  const st = stockInfo(p);
  if(delta > 0 && st.control && inCartQty(productId) >= st.stock){
    vibrate(40);
    toast(st.stock <= 0 ? 'Se acabó este producto' : 'Solo te quedan ' + st.stock, {
      icon: icon('alert'), variant:'toast-danger toast-top',
      subtitle: p ? p.name : '', duration: 1800
    });
    return;
  }
  const item = cart.find(c => c.productId === productId);
  if(item){
    item.qty += delta;
    if(item.qty <= 0){ cart = cart.filter(c => c.productId !== productId); }
  } else if(delta > 0){
    cart.push({ productId, qty:1 });
  }
  vibrate(10);
  render();
}

function computeTotals(){
  const subtotal = cart.reduce((a,c) => a + (cartLinePrice(c) * c.qty), 0);
  const iva = subtotal * IVA_RATE;
  const total = subtotal + iva;
  return { subtotal: round2(subtotal), iva: round2(iva), total: round2(total) };
}

/* ---------- Selector de tamaño (medio litro, litro, por kilo, etc.) ---------- */
function openSizePicker(productId){
  const p = findProduct(productId);
  if(!p || !p.sizesOn || !p.sizes || !p.sizes.length) return;
  const unitWord = sizeUnitOf(p.sizeUnit).many;
  const html = `
    <div class="sheet-header">
      <h2>¿Cuántos ${unitWord}?</h2>
      <button class="sheet-close" onclick="closeModal()">${icon('close')}</button>
    </div>
    <p class="page-sub" style="margin-top:-8px;">${escapeHtml(p.name)}</p>
    <div class="size-picker-list">
      ${p.sizes.map(s => {
        const qty = cartQtyForSize(productId, s.id);
        return `
        <div class="size-picker-row">
          <div class="size-picker-info">
            <div class="size-picker-label">${escapeHtml(s.label)}</div>
            <div class="size-picker-price">${formatMoney(s.price)}</div>
          </div>
          <div class="qty-control mini">
            <button class="qty-btn" onclick="changeSizeQty('${productId}','${s.id}', -1)">−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn" onclick="changeSizeQty('${productId}','${s.id}', 1)">+</button>
          </div>
        </div>`;
      }).join('')}
    </div>
    <button class="btn primary block" style="margin-top:16px;" onclick="closeModal(); renderBackgroundIfSale();">Listo</button>
  `;
  openModal(html, { dismissible:true });
}
function cartQtyForSize(productId, sizeId){
  const it = cart.find(c => c.productId === productId && c.sizeId === sizeId);
  return it ? it.qty : 0;
}
function changeSizeQty(productId, sizeId, delta){
  const p = findProduct(productId);
  const size = p && p.sizes.find(s => s.id === sizeId);
  if(!size) return;
  let item = cart.find(c => c.productId === productId && c.sizeId === sizeId);
  /* Con existencias, cada tamaño descuenta lo que mide (medio kilo = 0.5). */
  const stSz = stockInfo(p);
  if(delta > 0 && stSz.control){
    const extra = (size.unitQty != null ? size.unitQty : 1);
    if(cartStockUse(productId) + extra > stSz.stock + 1e-9){
      vibrate(40);
      toast(stSz.stock <= 0 ? 'Se acabó este producto' : 'Solo te quedan ' + fmtStock(p, stSz.stock), { icon:icon('alert'), variant:'toast-danger toast-top', subtitle:p.name, duration:1800 });
      return;
    }
  }
  if(!item){
    if(delta <= 0) return;
    item = { productId, sizeId, qty:0, unitPrice: size.price, sizeLabel: size.label };
    cart.push(item);
  }
  item.qty += delta;
  if(item.qty <= 0){ cart = cart.filter(c => c !== item); }
  vibrate(10);
  openSizePicker(productId);
  renderBackgroundIfSale();
}

/* ---------- Carrito / checkout (modal) ---------- */
function openModal(html, opts){
  opts = opts || {};
  const layer = document.getElementById('modal-layer');
  layer.innerHTML = `<div class="modal-overlay ${opts.center?'modal-center':''}" id="modalOverlay">
      <div class="modal-sheet ${opts.card?'modal-card':''}">
        ${opts.grip !== false ? '<div class="sheet-grip"></div>' : ''}
        ${html}
      </div>
    </div>`;
  if(opts.dismissible !== false){
    document.getElementById('modalOverlay').addEventListener('click', function(e){
      if(e.target.id === 'modalOverlay') closeModal();
    });
  }
}
function closeModal(){ document.getElementById('modal-layer').innerHTML = ''; }

function openCartSheet(step){
  if(cart.length === 0 && step !== 'cart'){ step = 'cart'; }
  openModal(cartSheetHTML(step), { dismissible:true });
}

function cartSheetHTML(step){
  const totals = computeTotals();
  if(step === 'checkout'){
    const cashNum = parseFloat(checkout.cash) || 0;
    const change = cashNum - totals.total;
    return `
      <div class="sheet-header">
        <h2>Cobrar pedido</h2>
        <button class="sheet-close" onclick="closeModal()">${icon('close')}</button>
      </div>

      <div class="section-title" style="margin-top:0;">Tipo de servicio</div>
      <div class="opt-grid">
        ${SERVICE_TYPES.map(s => `
          <button class="opt-card ${checkout.serviceType===s.id?'active':''}" onclick="setServiceType('${s.id}')">
            <span class="opt-emoji">${s.emoji}</span>${s.name}
          </button>
        `).join('')}
      </div>

      <div class="section-title">Método de pago</div>
      <div class="opt-grid">
        ${PAYMENT_METHODS.map(p => `
          <button class="opt-card ${checkout.paymentMethod===p.id?'active':''}" onclick="setPaymentMethod('${p.id}')">
            <span class="opt-emoji">${p.emoji}</span>${p.name}
          </button>
        `).join('')}
      </div>
      ${checkout.paymentMethod === 'efectivo' ? `
        <div class="field">
          <label>Efectivo recibido</label>
          <input id="cashInput" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0.00" value="${escapeHtml(checkout.cash)}" oninput="onCashInput(this.value)">
          <div class="field-hint ${cashNum >= totals.total ? 'ok' : 'warn'}" id="cashHint">
            ${cashNum > 0 ? (cashNum >= totals.total ? 'Cambio: ' + formatMoney(change) : 'Falta ' + formatMoney(totals.total - cashNum)) : 'Ingresa el monto entregado por el cliente'}
          </div>
        </div>
      ` : ''}

      <div class="totals">
        <div class="totals-row"><span>Subtotal</span><span class="v">${formatMoney(totals.subtotal)}</span></div>
        <div class="totals-row"><span>IVA (16%)</span><span class="v">${formatMoney(totals.iva)}</span></div>
        <div class="totals-row grand"><span>Total</span><span class="v">${formatMoney(totals.total)}</span></div>
      </div>

      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn ghost" onclick="openCartSheet('cart')">Volver</button>
        <button class="btn whatsapp block" onclick="confirmarCobro()">${icon('check')} Cobrar ${formatMoney(totals.total)}</button>
      </div>
    `;
  }

  // step === 'cart'
  return `
    <div class="sheet-header">
      <div class="sheet-header-left">
        <h2>Carrito</h2>
        ${cart.length > 0 ? `
          <div class="cart-total-pill">
            <span class="ctp-icon">${icon('person')}</span>
            <span>${formatMoney(totals.total)}</span>
          </div>
        ` : ''}
      </div>
      <button class="sheet-close" onclick="closeModal()">${icon('close')}</button>
    </div>
    ${cart.length === 0 ? `
      <div class="empty-state">
        ${illustration('cartEmpty')}
        <div class="empty-title">Carrito vacío</div>
        <div class="empty-text">Agrega productos desde el catálogo.</div>
      </div>
    ` : cart.map(c => {
      const p = findProduct(c.productId);
      if(!p) return '';
      const linePrice = cartLinePrice(c);
      const label = c.sizeLabel ? (p.name + ' · ' + c.sizeLabel) : p.name;
      const st = stockInfo(p);
      const stockNote = st.control ? ' · ' + fmtStock(p, st.stock) + ' en existencia' : '';
      const blockInc = !c.sizeId && st.control && c.qty >= st.stock;
      return `
        <div class="cart-item">
          <div class="cart-item-photo">
            ${p.image ? `<img src="${p.image}" alt="">` : `<span class="cart-item-photo-ph">${icon('plate')}</span>`}
          </div>
          <div class="cart-item-info">
            <div class="cart-item-name">${escapeHtml(label)}</div>
            <div class="cart-item-price">${formatMoney(linePrice)} c/u${stockNote}</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty('${p.id}', '${c.sizeId || ''}', -1)">−</button>
            <span class="qty-val">${c.qty}</span>
            <button class="qty-btn" ${blockInc ? 'disabled style="opacity:.35"' : ''} onclick="changeQty('${p.id}', '${c.sizeId || ''}', 1)">+</button>

      <button class="btn primary block" style="margin-top:16px;" onclick="openCartSheet('checkout')">Continuar</button>
    ` : ''}
  `;
}

function changeQty(productId, sizeId, delta){
  const sid = sizeId || null;
  const item = cart.find(c => c.productId === productId && (c.sizeId || null) === sid);
  if(!item) return;
  const p = findProduct(productId);
  if(!sid){
    const st = stockInfo(p);
    if(delta > 0 && st.control && item.qty >= st.stock){
      vibrate(40);
      toast('Solo te quedan ' + st.stock, { icon:icon('alert'), variant:'toast-danger toast-top', subtitle: p.name, duration:1800 });
      return;
    }
  }
  item.qty += delta;
  if(item.qty <= 0){ cart = cart.filter(c => c !== item); }
  vibrate(10);
  openCartSheet('cart');
  renderBackgroundIfSale();
}
function removeFromCart(productId, sizeId){
  const sid = sizeId || null;
  cart = cart.filter(c => !(c.productId === productId && (c.sizeId || null) === sid));
  vibrate(10);
  openCartSheet('cart');
  renderBackgroundIfSale();
}
function renderBackgroundIfSale(){ if(currentView === 'sale') render(); }

function setServiceType(id){ checkout.serviceType = id; openCartSheet('checkout'); }
function setPaymentMethod(id){ checkout.paymentMethod = id; openCartSheet('checkout'); }

function onCashInput(val){
  checkout.cash = val;
  const totals = computeTotals();
  const cashNum = parseFloat(val) || 0;
  const change = cashNum - totals.total;
  const hint = document.getElementById('cashHint');
  if(hint){
    hint.className = 'field-hint ' + (cashNum >= totals.total ? 'ok' : 'warn');
    hint.textContent = cashNum > 0 ? (cashNum >= totals.total ? 'Cambio: ' + formatMoney(change) : 'Falta ' + formatMoney(totals.total - cashNum)) : 'Ingresa el monto entregado por el cliente';
  }
}

function confirmarCobro(){
  if(cart.length === 0){ toast('El carrito está vacío'); return; }

  // Última revisión de existencias antes de cobrar.
  const inventario = DB.getProducts();
  const usoStock = stockUseByProduct(cart, inventario);
  const sinExistencias = stockProblems(usoStock, inventario);
  if(sinExistencias.length){
    vibrate(40);
    toast('No hay existencias suficientes', { icon:icon('alert'), variant:'toast-danger', subtitle: sinExistencias[0], duration:2600 });
    return;
  }

  const totals = computeTotals();
  if(checkout.paymentMethod === 'efectivo'){
    const cashNum = parseFloat(checkout.cash) || 0;
    if(cashNum < totals.total){ toast('El efectivo recibido es insuficiente'); return; }
  }

  const number = DB.nextSaleNumber();
  const sale = {
    id: 'v' + Date.now(),
    number: number,
    date: new Date().toISOString(),
    items: cart.map(c => {
      const p = findProduct(c.productId);
      const price = cartLinePrice(c);
      // El precio de producción del producto es "por litro/kilo". Si se vendió
      // por tamaño (medio litro, 2 litros...), el costo real de esa venta es
      // ese precio multiplicado por los litros/kilos que representa el tamaño,
      // no el precio de producción completo sin importar cuánto se vendió.
      const size = (c.sizeId && p && p.sizes) ? p.sizes.find(sz => sz.id === c.sizeId) : null;
      const unitFactor = (size && size.unitQty != null) ? size.unitQty : 1;
      const cost = (p && p.cost != null) ? round2(p.cost * unitFactor) : null;
      return {
        productId: p.id,
        name: p.name + (c.sizeLabel ? ' · ' + c.sizeLabel : ''),
        price: price,
        cost: cost,
        qty: c.qty,
        sizeLabel: c.sizeLabel || null,
        unit: c.sizeLabel ? 'pieza' : ((p && p.unit) || 'pieza')
      };
    }),
    subtotal: totals.subtotal,
    iva: totals.iva,
    total: totals.total,
    serviceType: checkout.serviceType,
    table: checkout.serviceType === 'comer' ? checkout.table : '',
    paymentMethod: checkout.paymentMethod,
    cash: checkout.paymentMethod === 'efectivo' ? (parseFloat(checkout.cash) || 0) : null,
    change: checkout.paymentMethod === 'efectivo' ? round2((parseFloat(checkout.cash) || 0) - totals.total) : null,
    cancelled: false
  };

  /* Si el negocio tiene varios usuarios, la venta queda a nombre de
     quien la cobró y dentro de su turno. Con un solo usuario la venta
     se guarda igual que siempre. */
  if(typeof multiUser === 'function' && multiUser()){
    const me = activeUser();
    const sh = currentShift();
    if(me){
      sale.userId = me.id;
      sale.userName = me.name;
      sale.userRole = me.role;
    }
    if(sh) sale.shiftId = sh.id;
  }

  const sales = DB.getSales();
  sales.push(sale);
  DB.saveSales(sales);

  // Se descuenta lo vendido del inventario (piezas, kilos, litros o metros).
  const desc = deductStock(usoStock, inventario);
  stockAlert = desc.alertas;
  if(desc.cambio) DB.saveProducts(inventario);

  cart = [];
  checkout = { serviceType:'comer', table:'', paymentMethod:'efectivo', cash:'' };
  saleCategoryFilter = 'todos';

  vibrate([15, 60, 15]);
  showTicket(sale, { fromCheckout:true });
}

/* =========================================================
   IMPRESION DE TICKETS (impresora termica)
   ---------------------------------------------------------
   Esta configuracion se guarda en ESTE dispositivo, porque la
   impresora cambia en cada caja, celular o computadora.
========================================================= */
const PRINT_KEY = 'mesa_print';

/* paper = ancho del rollo | width = ancho util de impresion */
const PRINT_PRESETS = {
  '58':     { label:'Termica 58 mm', note:'Rollo chico',        paper:58, width:48, size:11 },
  '80':     { label:'Termica 80 mm', note:'Rollo estandar',     paper:80, width:72, size:12 },
  'hoja':   { label:'Hoja normal',   note:'Carta / A4',         paper:0,  width:72, size:13 },
  'custom': { label:'Otro tamano',   note:'Tu eliges el ancho', paper:0,  width:60, size:12 }
};
const PRINT_SPACING = { compacto:1.15, normal:1.35, amplio:1.6 };

const DEFAULT_PRINT = {
  preset:   '80',
  widthMm:  72,
  fontSize: 12,
  spacing:  'normal',
  copies:   1,
  feedMm:   10,
  logo:     false,
  footer:   '\u00a1Gracias por su visita!'
};

function printPrefs(){
  let guardado = {};
  try{ guardado = JSON.parse(localStorage.getItem(PRINT_KEY) || '{}') || {}; }catch(e){ guardado = {}; }
  return Object.assign({}, DEFAULT_PRINT, guardado, { logo:false });   // el logo ya no se imprime
}
function savePrintPrefs(p){
  try{ localStorage.setItem(PRINT_KEY, JSON.stringify(p)); }catch(e){}
  applyPrintVars();
}
/** rerender = true vuelve a pintar toda la hoja de configuracion. */
function setPrintPref(key, value, rerender){
  const p = printPrefs();
  p[key] = value;
  savePrintPrefs(p);
  if(rerender) renderPrintSettings(); else updatePrintPreview();
}
function setPrintPreset(id){
  const preset = PRINT_PRESETS[id] || PRINT_PRESETS['80'];
  const p = printPrefs();
  p.preset = id;
  if(id !== 'custom'){
    p.widthMm  = preset.width;
    p.fontSize = preset.size;
  }
  savePrintPrefs(p);
  vibrate(10);
  renderPrintSettings();
}
function resetPrintPrefs(){
  try{ localStorage.removeItem(PRINT_KEY); }catch(e){}
  applyPrintVars();
  renderPrintSettings();
  toast('Listo, valores de f\u00e1brica');
}
function printPaperMm(p){
  p = p || printPrefs();
  if(p.preset === '58') return 58;
  if(p.preset === '80') return 80;
  return Math.max(30, Number(p.widthMm) + 6);
}
function printSubtitle(){
  const p = printPrefs();
  const preset = PRINT_PRESETS[p.preset] || PRINT_PRESETS['80'];
  const base = preset.label.replace('Termica', 'T\u00e9rmica') + ' \u00b7 ' + p.widthMm + ' mm de ancho';
  /* Si ya hay una impresora guardada, se ve aqui mismo si esta conectada. */
  if(typeof printerMain === 'function'){
    const d = printerMain();
    if(d) return d.name + ' \u00b7 ' + (printerIsConnected() ? 'Conectada' : 'Desconectada');
  }
  return base;
}

/** Copia la configuracion a variables CSS y arma la regla @page. */
function applyPrintVars(){
  const p = printPrefs();
  const hoja = p.preset === 'hoja';
  const r = document.documentElement.style;
  r.setProperty('--print-w',    Math.max(30, Number(p.widthMm) || 72) + 'mm');
  r.setProperty('--print-size', (Number(p.fontSize) || 12) + 'px');
  r.setProperty('--print-lh',   String(PRINT_SPACING[p.spacing] || 1.35));
  r.setProperty('--print-pad',  hoja ? '0mm' : '1.5mm');
  r.setProperty('--print-feed', (Number(p.feedMm) || 0) + 'mm');

  let regla = document.getElementById('printPageRule');
  if(!regla){
    regla = document.createElement('style');
    regla.id = 'printPageRule';
    document.head.appendChild(regla);
  }
  regla.textContent = hoja
    ? '@page{ size:auto; margin:8mm; }'
    : '@page{ size:' + printPaperMm(p) + 'mm auto; margin:0; }';
}

/* Las termicas dibujan los emojis como imagen y salen borrosos:

/** Encuentra la venta a partir del id o del objeto (como siempre). */
function resolveSale(venta){
  let sale = null;
  if(venta && typeof venta === 'object') sale = venta;
  else if(venta) sale = DB.getSales().find(s => s.id === venta) || null;
  if(!sale) sale = lastTicketSale;
  return sale;
}

/** Puerta de entrada de SIEMPRE. Si hay una impresora fisica conectada
    manda el ticket por ESC/POS; si no, usa el dialogo del navegador. */
function printTicket(venta){
  const sale = resolveSale(venta);
  if(!sale){ toast('No encontramos ese ticket'); return; }
  if(typeof printerIsConnected === 'function' && printerIsConnected()){
    printerPrintSale(sale).then(function(ok){
      if(!ok) printTicketBrowser(sale);
    });
    return;
  }
  printTicketBrowser(sale);
}

/** Impresion por el dialogo del navegador (el metodo original, intacto). */
function printTicketBrowser(venta){
  const sale = resolveSale(venta);
  if(!sale){ toast('No encontramos ese ticket'); return; }

  const p = printPrefs();
  applyPrintVars();

  let root = document.getElementById('printRoot');
  if(!root){
    root = document.createElement('div');
    root.id = 'printRoot';
    document.body.appendChild(root);
  }

  const copias = Math.max(1, Math.min(3, Number(p.copies) || 1));
  let html = '';
  for(let i = 0; i < copias; i++) html += '<div class="p-copy">' + ticketPrintHTML(sale) + '</div>';
  root.innerHTML = html;

  function limpiar(){
    window.removeEventListener('afterprint', limpiar);
    const r = document.getElementById('printRoot');
    if(r) r.innerHTML = '';
  }
  window.addEventListener('afterprint', limpiar);

  const conLogo = !!(p.logo && (currentUser() || {}).business && (currentUser() || {}).business.logo);
  setTimeout(function(){
    window.print();
    setTimeout(limpiar, 8000);
  }, conLogo ? 400 : 80);
}
