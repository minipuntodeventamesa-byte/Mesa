/* =========================================================
   IMPRESORA FISICA (ESC/POS)
   ---------------------------------------------------------
   Esto NO es una seccion nueva: se pinta DENTRO de la hoja
   que ya existia (Mi cuenta -> Impresion de tickets) y usa
   la MISMA configuracion de printPrefs() (papel, ancho,
   copias, papel extra y mensaje final).

   Nada aqui simula una conexion: el estado "Conectada" sale
   del objeto real (GATT / interfaz USB / puente nativo). Si
   no hay comunicacion real, dice Desconectada.

   Rutas reales de impresion, en orden:
     1) Puente nativo (Capacitor)  -> window.MesaPrinter
     2) Web Bluetooth (BLE GATT)   -> Chrome/Edge Android y PC
     3) WebUSB                     -> Chrome PC y Android (OTG)
     4) Wi-Fi                      -> puente nativo o agente HTTP
     5) Si no hay ninguna          -> window.print() de siempre
========================================================= */
const PRINTER_KEY = 'mesa_printer';

const DEFAULT_PRINTER = {
  conn:    'bt',     /* bt | wifi | usb */
  mainId:  null,     /* impresora principal */
  devices: [],       /* impresoras guardadas EN ESTE dispositivo */
  cut:     true,     /* corte de papel al final, si la impresora lo trae */
  charset: 'cp437',  /* cp437 | cp850 | plano */
  host:    '',       /* Wi-Fi: IP de la impresora o del agente */
  port:    9100
};

/* Servicios GATT que anuncian las termicas ESC/POS BLE mas comunes.
   Web Bluetooth solo deja ver los servicios declarados aqui. */
const BT_PRINT_SERVICES = [
  '000018f0-0000-1000-8000-00805f9b34fb', /* el mas usado (char 2AF1) */
  '0000ff00-0000-1000-8000-00805f9b34fb',
  '0000ffe0-0000-1000-8000-00805f9b34fb', /* modulos tipo HM-10 */
  '0000ffb0-0000-1000-8000-00805f9b34fb',
  '0000fee7-0000-1000-8000-00805f9b34fb',
  '0000ae30-0000-1000-8000-00805f9b34fb',
  '49535343-fe7d-4ae5-8fa9-9fafd205e455', /* UART transparente (ISSC) */
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
];

/* Estado vivo. No se guarda: si se recarga la pagina, se reconecta. */
const printerRT = {
  device:null, chr:null, noResp:false,
  usb:null, usbEp:0, usbIface:0,
  nativeOn:false,
  connected:false, busy:false, error:''
};

function printerPrefs(){
  let g = {};
  try{ g = JSON.parse(localStorage.getItem(PRINTER_KEY) || '{}') || {}; }catch(e){ g = {}; }
  const cfg = Object.assign({}, DEFAULT_PRINTER, g);
  if(!Array.isArray(cfg.devices)) cfg.devices = [];
  return cfg;
}
function savePrinterPrefs(cfg){
  try{ localStorage.setItem(PRINTER_KEY, JSON.stringify(cfg)); }catch(e){}
}
function setPrinterPref(key, value){
  const cfg = printerPrefs();
  cfg[key] = value;
  savePrinterPrefs(cfg);
  printerRefresh();
}
function printerSetConn(tipo){
  const cfg = printerPrefs();
  if(cfg.conn === tipo) return;
  cfg.conn = tipo;
  savePrinterPrefs(cfg);
  vibrate(10);
  printerRefresh();
}

/* ---------- Que puede hacer REALMENTE este dispositivo ---------- */
function printerNative(){
  const C = window.Capacitor;
  const p = (C && C.Plugins && C.Plugins.MesaPrinter) || window.MesaPrinter || null;
  return (p && typeof p.write === 'function') ? p : null;
}
function printerEnv(){
  const ua = navigator.userAgent || '';
  const iOS = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return {
    iOS: iOS,
    native: !!printerNative(),
    webBT: !!(navigator.bluetooth && navigator.bluetooth.requestDevice),
    webUSB: !!(navigator.usb && navigator.usb.requestDevice),
    secure: !!window.isSecureContext
  };
}

/* ---------- Impresoras guardadas ---------- */
function printerMain(){
  const cfg = printerPrefs();
  return cfg.devices.find(d => d.id === cfg.mainId) || null;
}
function printerSetMain(id){
  const cfg = printerPrefs();
  cfg.mainId = id;
  const d = cfg.devices.find(x => x.id === id);
  if(d && d.conn) cfg.conn = d.conn;
  savePrinterPrefs(cfg);
  vibrate(10);
  printerRefresh();
}
function printerRemember(rec){
  const cfg = printerPrefs();
  const i = cfg.devices.findIndex(d => d.id === rec.id);
  if(i >= 0) cfg.devices[i] = Object.assign({}, cfg.devices[i], rec);
  else cfg.devices.push(rec);
  cfg.mainId = rec.id;
  cfg.conn = rec.conn;
  savePrinterPrefs(cfg);
}
function printerForget(id){
  const cfg = printerPrefs();
  cfg.devices = cfg.devices.filter(d => d.id !== id);
  if(cfg.mainId === id){
    cfg.mainId = cfg.devices.length ? cfg.devices[0].id : null;
    printerDisconnect(true);
  }
  savePrinterPrefs(cfg);
  toast('Impresora quitada de este dispositivo');
  printerRefresh();
}
/** "Cambiar impresora": suelta la actual y abre la busqueda otra vez. */
async function printerChange(){
  await printerDisconnect(true);
  printerScan();
}

/** false cuando NO existe forma real de buscar con ese tipo de conexion
    (Safari en iPhone/iPad). En Bluefy o con el puente nativo sigue activo. */
function printerCanScan(tipo){
  const env = printerEnv();
  if(env.native) return true;
  if(tipo === 'bt')  return env.webBT;
  if(tipo === 'usb') return env.webUSB;
  return true; /* Wi-Fi siempre: solo hace falta escribir la IP */
}

function printerIsConnected(){ return !!printerRT.connected; }
function printerLabel(){
  const d = printerMain();
  return d ? d.name : 'Sin impresora';
}

/* =========================================================
   CONEXION REAL
========================================================= */
async function printerScan(){
  const cfg = printerPrefs();
  const env = printerEnv();
  try{
    if(env.native && typeof printerNative().scan === 'function'){
      toast('Buscando impresoras…');
      const r = await printerNative().scan({ type: cfg.conn });
      const lista = (r && r.devices) || [];
      if(!lista.length){ toast('No encontramos impresoras cerca', { variant:'toast-danger' }); return; }
      lista.forEach(d => printerRemember({
        id: d.id, name: d.name || 'Impresora', conn: cfg.conn, via: 'native'
      }));
      printerRefresh();
      toast('Listo, ya aparece en la lista', { icon:icon('check'), variant:'toast-success' });
      return;
    }
    if(cfg.conn === 'bt')   return await printerScanBT();
    if(cfg.conn === 'usb')  return await printerScanUSB();
    if(cfg.conn === 'wifi') return printerSaveWifi();
  }catch(e){
    if(e && e.name === 'NotFoundError'){ toast('No elegiste ninguna impresora'); return; }
    toast('No pudimos buscar', { variant:'toast-danger', subtitle:String(e && e.message || e) });
  }
}

async function printerScanBT(){
  const env = printerEnv();
  if(!env.webBT){ printerNoBT(); return; }
  const dev = await navigator.bluetooth.requestDevice({
    acceptAllDevices: true,
    optionalServices: BT_PRINT_SERVICES
  });
  printerRemember({
    id: dev.id,
    name: dev.name || 'Impresora Bluetooth',
    conn: 'bt', via: 'web'
  });
  printerRT.device = dev;
  printerRefresh();
  await printerConnect();
}

async function printerScanUSB(){
  const env = printerEnv();
  if(!env.webUSB){
    toast('Este navegador no permite USB', { variant:'toast-danger', subtitle:'Usa Chrome en PC o Android' });
    return;
  }
  let dev = null;
  try{
    dev = await navigator.usb.requestDevice({ filters:[{ classCode:7 }] }); /* clase impresora */
  }catch(e){
    if(e && e.name === 'NotFoundError') dev = await navigator.usb.requestDevice({ filters:[] });
    else throw e;
  }
  const id = 'usb:' + dev.vendorId + ':' + dev.productId;
  printerRemember({
    id: id,
    name: dev.productName || ('Impresora USB ' + dev.vendorId.toString(16)),
    conn: 'usb', via:'web', vendorId: dev.vendorId, productId: dev.productId
  });
  printerRT.usb = dev;
  printerRefresh();
  await printerConnect();
}

function printerSaveWifi(){
  const h = document.getElementById('prHost');
  const p = document.getElementById('prPort');
  const host = (h ? h.value : '').trim();
  const port = Number(p ? p.value : 9100) || 9100;
  if(!host){ toast('Escribe la IP de la impresora', { variant:'toast-danger' }); return; }
  printerRemember({
    id: 'net:' + host + ':' + port,
    name: 'Impresora en red ' + host,
    conn: 'wifi', via:'net', host: host, port: port
  });
  const cfg = printerPrefs();
  cfg.host = host; cfg.port = port;
  savePrinterPrefs(cfg);
  printerRefresh();
  printerConnect();
}

/** Conecta de verdad con la impresora principal. Devuelve true/false. */
async function printerConnect(){
  const rec = printerMain();
  if(!rec){ toast('Primero busca y elige tu impresora'); return false; }
  if(printerRT.connected) return true;
  printerRT.error = '';
  try{
    if(rec.via === 'native' || printerEnv().native) return await printerConnectNative(rec);
    if(rec.conn === 'bt')   return await printerConnectBT(rec);
    if(rec.conn === 'usb')  return await printerConnectUSB(rec);
    if(rec.conn === 'wifi') return await printerConnectNet(rec);
    return false;
  }catch(e){
    printerRT.connected = false;
    printerRT.error = String(e && e.message || e);
    printerRefresh();
    toast('No se pudo conectar', { variant:'toast-danger', icon:icon('alert'), subtitle: printerRT.error.slice(0, 70) });
    return false;
  }
}

async function printerConnectNative(rec){
  const nat = printerNative();
  if(!nat) return false;
  toast('Conectando…');
  const r = await nat.connect({ id: rec.id, type: rec.conn, host: rec.host, port: rec.port });
  printerRT.nativeOn = !!(r && r.connected !== false);
  printerRT.connected = printerRT.nativeOn;
  printerRefresh();
  if(printerRT.connected) toast('Impresora conectada', { icon:icon('check'), variant:'toast-success' });
  return printerRT.connected;
}

/** Recupera el objeto BluetoothDevice ya autorizado, sin volver a pedir permiso. */
async function printerBTDevice(rec){
  if(printerRT.device && printerRT.device.id === rec.id) return printerRT.device;
  if(navigator.bluetooth && navigator.bluetooth.getDevices){
    try{
      const list = await navigator.bluetooth.getDevices();
      const hit = list.find(d => d.id === rec.id);
      if(hit) return hit;
    }catch(e){ /* el navegador no lo soporta */ }
  }
  return null;
}

async function printerConnectBT(rec){
  if(!printerEnv().webBT){ printerNoBT(); return false; }
  let dev = await printerBTDevice(rec);
  if(!dev){
    toast('Vuelve a enlazarla', { subtitle:'Toca "Buscar impresoras" y eligela' });
    return false;
  }
  toast('Conectando…');
  const server = await dev.gatt.connect();
  const svcs = await server.getPrimaryServices();
  let chr = null;
  for(const s of svcs){
    let chars = [];
    try{ chars = await s.getCharacteristics(); }catch(e){ continue; }
    const w = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
    if(w){ chr = w; break; }
  }
  if(!chr){
    try{ dev.gatt.disconnect(); }catch(e){}
    throw new Error('La impresora no expone un canal de escritura BLE');
  }
  printerRT.device = dev;
  printerRT.chr = chr;
  printerRT.noResp = !!chr.properties.writeWithoutResponse;
  printerRT.connected = true;
  dev.removeEventListener('gattserverdisconnected', printerOnDrop);
  dev.addEventListener('gattserverdisconnected', printerOnDrop);
  printerRemember(Object.assign({}, rec, { svc: chr.service.uuid, chr: chr.uuid }));
  printerRefresh();
  toast('Impresora conectada', { icon:icon('check'), variant:'toast-success', subtitle: rec.name });
  return true;
}

async function printerConnectUSB(rec){
  if(!printerEnv().webUSB) return false;
  let dev = printerRT.usb;
  if(!dev){
    const list = await navigator.usb.getDevices();
    dev = list.find(d => d.vendorId === rec.vendorId && d.productId === rec.productId) || null;
  }
  if(!dev){ toast('Vuelve a enlazarla', { subtitle:'Toca "Buscar impresoras"' }); return false; }
  await dev.open();
  if(!dev.configuration) await dev.selectConfiguration(1);
  let iface = null, ep = 0;
  for(const i of dev.configuration.interfaces){
    for(const alt of i.alternates){
      const out = alt.endpoints.find(e => e.direction === 'out' && e.type === 'bulk');
      if(out && (alt.interfaceClass === 7 || !iface)){ iface = i.interfaceNumber; ep = out.endpointNumber; }
      if(out && alt.interfaceClass === 7) break;
    }
  }
  if(iface === null) throw new Error('No encontramos la salida USB de la impresora');
  await dev.claimInterface(iface);
  printerRT.usb = dev;
  printerRT.usbIface = iface;
  printerRT.usbEp = ep;
  printerRT.connected = true;
  printerRefresh();
  toast('Impresora conectada', { icon:icon('check'), variant:'toast-success', subtitle: rec.name });
  return true;
}

/** Wi-Fi: el navegador NO abre sockets TCP. Se comprueba el agente/puente. */
async function printerConnectNet(rec){
  const nat = printerNative();
  if(nat && typeof nat.netProbe === 'function'){
    const r = await nat.netProbe({ host: rec.host, port: rec.port });
    printerRT.connected = !!(r && r.ok);
  }else{
    const url = 'http://' + rec.host + ':' + rec.port + '/status';
    const corte = new AbortController();
    const reloj = setTimeout(function(){ corte.abort(); }, 2500);
    try{
      await fetch(url, { method:'GET', mode:'no-cors', cache:'no-store', signal: corte.signal });
      printerRT.connected = true; /* algo contesto de verdad en esa IP */
    }catch(e){
      printerRT.connected = false;
      throw new Error('No responde el agente en ' + rec.host + ':' + rec.port);
    }finally{
      clearTimeout(reloj);
    }
  }
  printerRefresh();
  if(printerRT.connected) toast('Impresora conectada', { icon:icon('check'), variant:'toast-success' });
  return printerRT.connected;
}

function printerOnDrop(){
  printerRT.chr = null;
  printerRT.connected = false;
  printerRefresh();
  toast('Se perdio la conexion con la impresora', { variant:'toast-danger', icon:icon('alert') });
}

async function printerDisconnect(silencio){
  try{
    const nat = printerNative();
    if(printerRT.nativeOn && nat && nat.disconnect) await nat.disconnect();
    if(printerRT.device && printerRT.device.gatt && printerRT.device.gatt.connected){
      printerRT.device.removeEventListener('gattserverdisconnected', printerOnDrop);
      printerRT.device.gatt.disconnect();
    }
    if(printerRT.usb && printerRT.usb.opened){
      try{ await printerRT.usb.releaseInterface(printerRT.usbIface); }catch(e){}
      await printerRT.usb.close();
    }
  }catch(e){ /* silencioso */ }
  printerRT.chr = null;
  printerRT.nativeOn = false;
  printerRT.connected = false;
  printerRefresh();
  if(!silencio) toast('Impresora desconectada');
}

/** Reconecta sola al abrir la app, sin molestar si no se puede. */
async function printerAutoConnect(){
  const rec = printerMain();
  if(!rec || printerRT.connected) return;
  try{
    if(printerEnv().native){ await printerConnectNative(rec); return; }
    if(rec.conn === 'bt'){
      const dev = await printerBTDevice(rec);
      if(dev) await printerConnectBT(rec);
    }else if(rec.conn === 'usb'){
      const list = await navigator.usb.getDevices();
      if(list.some(d => d.vendorId === rec.vendorId)) await printerConnectUSB(rec);
    }
  }catch(e){ /* que el usuario lo haga a mano */ }
}

/* =========================================================
   ENVIO DE BYTES
========================================================= */
function printerB64(bytes){
  let s = '';
  for(let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i] & 0xFF);
  return btoa(s);
}
function printerSleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function printerWrite(bytes){
  const cfg = printerPrefs();
  const rec = printerMain();
  const nat = printerNative();
  const data = Uint8Array.from(bytes);

  if(printerRT.nativeOn && nat){
    await nat.write({ data: printerB64(data) });
    return 'native';
  }
  if(printerRT.chr){
    const paso = 20; /* las termicas BLE baratas no aguantan mas por paquete */
    for(let i = 0; i < data.length; i += paso){
      const trozo = data.slice(i, i + paso);
      if(printerRT.noResp && printerRT.chr.writeValueWithoutResponse){
        await printerRT.chr.writeValueWithoutResponse(trozo);
      }else{
        await printerRT.chr.writeValue(trozo);
      }
      await printerSleep(printerRT.noResp ? 18 : 6);
    }
    return 'ble';
  }
  if(printerRT.usb){
    await printerRT.usb.transferOut(printerRT.usbEp, data);
    return 'usb';
  }
  if(rec && rec.conn === 'wifi'){
    if(nat && nat.netPrint){
      await nat.netPrint({ host: rec.host, port: rec.port, data: printerB64(data) });
      return 'native';
    }
    const url = 'http://' + rec.host + ':' + rec.port + '/print';
    await fetch(url, {
      method:'POST', mode:'no-cors', cache:'no-store',
      headers:{ 'Content-Type':'application/octet-stream' },
      body: data
    });
    return 'http';
  }
  throw new Error('No hay ninguna impresora conectada');
}

/* =========================================================
   ESC/POS  (el MISMO ticket que ya se imprimia, en bytes)
========================================================= */
const CP437 = {
  'Ç':128,'ü':129,'é':130,'â':131,'ä':132,'à':133,'å':134,'ç':135,'ê':136,'ë':137,
  'è':138,'ï':139,'î':140,'ì':141,'Ä':142,'Å':143,'É':144,'æ':145,'Æ':146,'ô':147,
  'ö':148,'ò':149,'û':150,'ù':151,'ÿ':152,'Ö':153,'Ü':154,'¢':155,'£':156,'¥':157,
  'ƒ':159,'á':160,'í':161,'ó':162,'ú':163,'ñ':164,'Ñ':165,'ª':166,'º':167,'¿':168,
  '¬':170,'½':171,'¼':172,'¡':173,'«':174,'»':175,'°':248,'·':250,'²':253
};
const CP850 = {
  'Á':181,'Â':182,'À':183,'Ã':199,'ã':198,'Í':214,'Ó':224,'Ò':227,'Õ':229,'õ':228,
  'Ú':233,'Û':234,'Ù':235,'Ê':210,'Ë':211,'È':212,'Î':215,'Ï':216,'Ô':226,'×':158
};
const SIN_ACENTO = {
  'á':'a','é':'e','í':'i','ó':'o','ú':'u','ü':'u','ñ':'n','ç':'c',
  'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U','Ü':'U','Ñ':'N','Ç':'C',
  'à':'a','è':'e','ì':'i','ò':'o','ù':'u','â':'a','ê':'e','î':'i','ô':'o','û':'u',
  '¿':'?','¡':'!','°':'o','·':'-','—':'-','–':'-','’':"'",'‘':"'",'“':'"','”':'"','€':'EUR','\u00a0':' ','\u202f':' ','\u2009':' ','\u2007':' '
};

function escEncode(txt, cs){
  const out = [];
  const s = String(txt == null ? '' : txt);
  for(const ch of s){
    const c = ch.codePointAt(0);
    if(c === 10){ out.push(10); continue; }
    if(c < 32) continue;
    if(c < 127){ out.push(c); continue; }
    if(cs !== 'plano'){
      const m = (cs === 'cp850' && CP850[ch] !== undefined) ? CP850[ch] : CP437[ch];
      if(m !== undefined){ out.push(m); continue; }
    }
    const p = SIN_ACENTO[ch];
    if(p){ for(const q of p) out.push(q.charCodeAt(0)); continue; }
    if(c < 256) out.push(c);
  }
  return out;
}

/** Columnas de texto segun el papel elegido en printPrefs(). */
function escposColumns(p){
  p = p || printPrefs();
  if(p.preset === '58') return 32;
  if(p.preset === '80') return 48;
  const n = Math.round((Number(p.widthMm) || 72) * 2 / 3);
  return Math.max(24, Math.min(56, n));
}
/** Puntos horizontales del cabezal (para el logo). */
function escposDots(p){
  p = p || printPrefs();
  if(p.preset === '58') return 384;
  if(p.preset === '80') return 576;
  return Math.max(256, Math.min(576, Math.round((Number(p.widthMm) || 72) * 8)));
}
function escPad(izq, der, cols){
  izq = String(izq); der = String(der);
  let libre = cols - izq.length - der.length;
  if(libre < 1){
    izq = izq.slice(0, Math.max(1, cols - der.length - 1));
    libre = cols - izq.length - der.length;
  }
  return izq + ' '.repeat(Math.max(1, libre)) + der;
}
function escWrap(txt, cols){
  const palabras = String(txt || '').split(/\s+/).filter(Boolean);
  const lineas = [];
  let l = '';
  palabras.forEach(w => {
    while(w.length > cols){
      if(l){ lineas.push(l); l = ''; }
      lineas.push(w.slice(0, cols));
      w = w.slice(cols);
    }
    if((l + (l ? ' ' : '') + w).length > cols){ lineas.push(l); l = w; }
    else l += (l ? ' ' : '') + w;
  });
  if(l) lineas.push(l);
  return lineas.length ? lineas : [''];
}

/** El logo del negocio como imagen de mapa de bits (GS v 0). */
function escposRaster(dataUrl, dots){
  return new Promise(function(res){
    try{
      const img = new Image();
      img.onerror = function(){ res(null); };
      img.onload = function(){
        try{
          const W = Math.max(8, Math.floor((dots * 0.6) / 8) * 8);
          const H = Math.max(1, Math.min(280, Math.round(img.height * (W / img.width))));
          const cv = document.createElement('canvas');
          cv.width = W; cv.height = H;
          const cx = cv.getContext('2d');
          cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H);
          cx.drawImage(img, 0, 0, W, H);
          const px = cx.getImageData(0, 0, W, H).data;
          const bytesPorFila = W / 8;
          const out = [0x1D, 0x76, 0x30, 0x00,
                       bytesPorFila & 0xFF, (bytesPorFila >> 8) & 0xFF,
                       H & 0xFF, (H >> 8) & 0xFF];
          for(let y = 0; y < H; y++){
            for(let b = 0; b < bytesPorFila; b++){
              let byte = 0;
              for(let bit = 0; bit < 8; bit++){
                const x = b * 8 + bit;
                const i = (y * W + x) * 4;
                const lum = (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114);
                const alpha = px[i + 3];
                if(alpha > 40 && lum < 165) byte |= (0x80 >> bit);
              }
              out.push(byte);
            }
          }
          out.push(0x0A);
          res(out);
        }catch(e){ res(null); }
      };
      img.src = dataUrl;
    }catch(e){ res(null); }
  });
}

/** Arma el ticket en ESC/POS con el MISMO contenido de ticketPrintHTML(). */
async function escposTicketBytes(sale){
  const p    = printPrefs();
  const cfg  = printerPrefs();
  const cols = escposColumns(p);
  const cs   = cfg.charset;
  const biz  = ticketBusiness();
  const u    = (typeof currentUser === 'function' ? currentUser() : null) || {};
  const b    = u.business || {};
  const service = serviceOf(sale.serviceType);
  const payment = paymentOf(sale.paymentMethod);

  const out  = [];
  const raw  = (a) => { for(let i = 0; i < a.length; i++) out.push(a[i]); };
  const txt  = (s) => raw(escEncode(s, cs));
  const ln   = (s) => { txt(s == null ? '' : s); out.push(0x0A); };
  const cen  = () => raw([0x1B, 0x61, 0x01]);
  const izq  = () => raw([0x1B, 0x61, 0x00]);
  const neg  = (on) => raw([0x1B, 0x45, on ? 1 : 0]);
  const gran = (on) => raw([0x1D, 0x21, on ? 0x11 : 0x00]);
  const sep  = () => ln('-'.repeat(cols));
  const fila = (a, c) => ln(escPad(a, c, cols));

  raw([0x1B, 0x40]);                                   /* reiniciar */
  raw([0x1B, 0x74, cs === 'cp850' ? 0x02 : 0x00]);     /* tabla de caracteres */
  raw([0x1B, 0x52, 0x0C]);                             /* juego: Latinoamerica */

  /* ----- Encabezado ----- */
  cen();
  if(p.logo && b.logo){
    const img = await escposRaster(b.logo, escposDots(p));
    if(img) raw(img);
  }
  neg(true); gran(true);
  escWrap(stripEmoji(biz.title), Math.floor(cols / 2)).forEach(ln);
  gran(false); neg(false);
  escWrap(stripEmoji(biz.sub), cols).forEach(ln);
  if(b.address && biz.address) escWrap(b.address, cols).forEach(ln);
  if(b.phone) ln('Tel. ' + b.phone);
  izq(); sep();

  /* ----- Datos de la venta ----- */
  fila('Pedido',   orderNumberLabel(sale.number));
  fila('Fecha',    formatDateTime(sale.date));
  fila('Servicio', stripEmoji(service.name));
  if(sale.origin === 'menu') fila('Origen', 'Menu Digital' + (sale.menuCode ? ' ' + sale.menuCode : ''));
  if(sale.customerName) fila('Cliente', sale.customerName);
  if(sale.table) fila('Mesa', sale.table);
  if(sale.userName) fila('Atendio', sale.userName);
  sep();

  /* ----- Productos ----- */
  sale.items.forEach(it => {
    const importe = formatMoney(it.price * it.qty);
    const lineas  = escWrap(it.name, cols - importe.length - 1);
    neg(true);
    fila(lineas[0], importe);
    neg(false);
    for(let i = 1; i < lineas.length; i++) ln(lineas[i]);
    ln('  ' + (it.unit && !it.sizeLabel && !unitOf(it.unit).plain ? fmtQty(it.qty, it.unit) : fmtNum(it.qty)) + ' x ' + formatMoney(it.price));
  });
  sep();

  /* ----- Totales ----- */
  fila('Subtotal',  formatMoney(sale.subtotal));
  fila('IVA (16%)', formatMoney(sale.iva));
  neg(true); gran(true);
  ln(escPad('TOTAL', formatMoney(sale.total), Math.floor(cols / 2)));
  gran(false); neg(false);
  sep();

  /* ----- Pago ----- */
  fila('Pago', stripEmoji(payment.name));
  if(sale.paymentMethod === 'efectivo' && sale.cash != null){
    fila('Recibido', formatMoney(sale.cash));
    fila('Cambio',   formatMoney(sale.change));
  }
  if(sale.cancelled){
    cen(); neg(true); ln(''); ln('*** VENTA CANCELADA ***'); neg(false); izq();
  }

  /* ----- Mensaje final ----- */
  if(p.footer){
    ln('');
    cen();
    escWrap(p.footer, cols).forEach(ln);
    izq();
  }

  /* ----- Papel extra y corte ----- */
  const lineasFeed = Math.max(1, Math.min(12, Math.round((Number(p.feedMm) || 0) / 3.75) + 1));
  raw([0x1B, 0x64, lineasFeed]);
  if(cfg.cut) raw([0x1D, 0x56, 66, 0]);                /* corte parcial */
  return out;
}

/* =========================================================
   IMPRIMIR DE VERDAD
========================================================= */
async function printerPrintSale(sale, opts){
  opts = opts || {};
  if(printerRT.busy){ toast('Espera, se esta imprimiendo'); return false; }
  if(!printerIsConnected()){
    const ok = await printerConnect();
    if(!ok) return false;
  }
  printerRT.busy = true;
  try{
    const p = printPrefs();
    const copias = Math.max(1, Math.min(3, Number(p.copies) || 1));
    let bytes = [];
    for(let i = 0; i < copias; i++){
      const t = await escposTicketBytes(sale);
      bytes = bytes.concat(t);
    }
    const ruta = await printerWrite(bytes);
    vibrate(12);
    /* Por agente HTTP no hay acuse de la impresora: se dice "enviado", no "impreso". */
    const seguro = ruta !== 'http';
    toast(opts.testing ? 'Ticket de prueba enviado' : (seguro ? 'Ticket impreso' : 'Ticket enviado al agente'),
          { icon:icon('print'), variant:'toast-success', subtitle: printerLabel() });
    return true;
  }catch(e){
    printerRT.connected = false;
    printerRefresh();
    toast('No se pudo imprimir', {
      icon: icon('alert'), variant:'toast-danger',
      subtitle: String(e && e.message || e).slice(0, 70), duration: 2600
    });
    return false;
  }finally{
    printerRT.busy = false;
  }
}

}

  });

function printerConnIcon(tipo){
  if(tipo === 'wifi') return icon('wifi');
  if(tipo === 'usb')  return icon('usb');
  return icon('bluetooth');
}

  if(tipo === 'wifi') return 'Wi-Fi';
  if(tipo === 'usb')  return 'USB';
  return 'Bluetooth';
}

/** Nota honesta segun lo que este dispositivo puede hacer de verdad. */
function printerNoteHTML(){
  const cfg = printerPrefs();
  const env = printerEnv();

  if(env.native){
    return `<div class="pr-note ok">
      <b>Puente nativo activo.</b> Esta app corre dentro del contenedor nativo,
      así que se conecta directo con la impresora y manda ESC/POS sin pasar por el navegador.
    </div>`;
  }
  if(!env.secure){
    return `<div class="pr-note warn">
      <b>Falta HTTPS.</b> El navegador solo deja usar Bluetooth y USB en páginas
      seguras (https:// o localhost). Abre la app desde una dirección https y vuelve a intentar.
    </div>`;
  }
  if(env.iOS && cfg.conn === 'bt'){
    return `<div class="pr-note warn">
      <b>iPhone / iPad:</b> Safari no incluye Web Bluetooth, así que esta página
      no puede hablar con la impresora por Bluetooth. No es un error de la app: es un límite de iOS.
      El ticket se imprime igual desde el diálogo del sistema.
    </div>`;
  }
  if(cfg.conn === 'bt' && !env.webBT){
    return `<div class="pr-note warn">
      <b>Este navegador no tiene Web Bluetooth.</b> Usa Chrome o Edge en Android o PC,
      o conecta la impresora por Wi-Fi o USB.
    </div>`;
  }
  if(cfg.conn === 'usb' && !env.webUSB){
    return `<div class="pr-note warn">
      <b>Este navegador no permite USB.</b> Funciona en Chrome o Edge, en PC y en Android con OTG.
      El ticket se imprime igual desde el diálogo del sistema.
    </div>`;
  }
  if(cfg.conn === 'wifi'){
    return `<div class="pr-note">
      <b>Wi-Fi:</b> un navegador no puede abrir el puerto 9100 directo. Escribe la IP y el
      puerto de tu impresora: si ${APP_NAME} corre dentro del contenedor nativo, se envía por socket;
      si corre en el navegador, necesita un pequeño agente en la red que reciba los bytes
      ESC/POS en <code>/print</code>.
    </div>`;
  }
  return `<div class="pr-note">
    Toca <b>Buscar impresoras</b> y elige la tuya. Se guarda en este dispositivo,
    porque la impresora cambia en cada caja o celular.
  </div>`;
}

function matchesHistoryFilters(sale){
  const now = new Date();
  const d = new Date(sale.date);
  if(historyFilters.period === 'today' && !isSameDay(d, now)) return false;
  if(historyFilters.period === 'week' && !isSameWeek(d, now)) return false;
  if(historyFilters.period === 'month' && !isSameMonth(d, now)) return false;
  if(historyFilters.status === 'activa' && sale.cancelled) return false;
  if(historyFilters.status === 'cancelada' && !sale.cancelled) return false;
  if(historyFilters.service !== 'all' && sale.serviceType !== historyFilters.service) return false;
  if(historyFilters.payment !== 'all' && sale.paymentMethod !== historyFilters.payment) return false;
  if(historyFilters.search){
    const q = historyFilters.search.toLowerCase();
    const inNumber = String(sale.number).includes(q) || orderNumberLabel(sale.number).toLowerCase().includes(q);
    const inItems = sale.items.some(it => it.name.toLowerCase().includes(q));
    const inTable = (sale.table || '').toLowerCase().includes(q);
    if(!inNumber && !inItems && !inTable) return false;
  }
  return true;
}

function renderHistoryList(){
  const container = document.getElementById('historyList');
  if(!container) return;
  const allSales = visibleSales();
  const sales = allSales.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).filter(matchesHistoryFilters);
  container.innerHTML = sales.length === 0 ? (
    allSales.length === 0 ? `
      <div class="empty-state">
        ${illustration('docsEmpty')}
        <div class="empty-title">Aún no hay historial</div>
        <div class="empty-text">Cuando registres tu primera venta, aparecerá aquí.</div>

  ) : buildHistoryChart(sales) + sales.map(s => renderSaleRow(s)).join('');
}

/* Gráfico de barras del historial: solo aparece cuando las ventas filtradas
   abarcan más de una semana, agrupando por día (o por semana si el rango
   es muy largo), con el mismo lenguaje visual que la vista de Ventas. */
function buildHistoryChart(sales){
  const activeSales = sales.filter(s => !s.cancelled);
  if(activeSales.length < 2) return '';

  const times = activeSales.map(s => new Date(s.date).getTime());
  const minT = Math.min(...times), maxT = Math.max(...times);
  const spanDays = (maxT - minT) / 86400000;
  if(spanDays < 7) return '';

  const groupByWeek = spanDays > 31;
  const buckets = {};
  activeSales.forEach(s => {
    const d = new Date(s.date);
    let key, label;
    if(groupByWeek){
      const wk = startOfWeek(d);
      key = wk.getTime();
      label = 'Sem. ' + wk.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit' });
    } else {
      const day = new Date(d); day.setHours(0,0,0,0);
      key = day.getTime();
      label = day.toLocaleDateString('es-MX', { day:'2-digit', month:'short' });
    }
    if(!buckets[key]) buckets[key] = { key, label, total:0 };
    buckets[key].total += s.total;
  });

  let rows = Object.values(buckets).sort((a,b) => a.key - b.key);
  if(rows.length > 14) rows = rows.slice(-14);
  const maxVal = Math.max(...rows.map(r => r.total), 1);

  return `
    <div class="section-title" style="margin-top:0;">Ventas por ${groupByWeek ? 'semana' : 'día'}</div>
    <div class="card hist-chart-card">
      ${rows.map(r => `
        <div class="bar-row">
          <div class="bar-row-top"><span>${r.label}</span><span class="bv">${formatMoney(r.total)}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(r.total/maxVal)*100}%; background:var(--sec-history);"></div></div>
        </div>
      `).join('')}
    </div>
  `;
}

function cancelSale(saleId){
  if(!requirePerm('cancelarVentas', 'No tienes permiso para cancelar ventas')) return;
  const ok = window.confirm('¿Cancelar esta venta? Se mantendrá en el historial pero dejará de contar en las estadísticas.');
  if(!ok) return;
  const sales = DB.getSales();
  const sale = sales.find(s => s.id === saleId);
  if(!sale) return;
  sale.cancelled = true;
  DB.saveSales(sales);
  toast('Venta cancelada');
  closeModal();
  render();
}

/* Eliminar del historial es permanente: solo el Dueño puede hacerlo,
   y solo sobre ventas que ya estén canceladas. */
function deleteSale(saleId){
  if(!requireOwner('Solo el Dueño puede eliminar ventas del historial')) return;
  const sales = DB.getSales();
  const sale = sales.find(s => s.id === saleId);
  if(!sale) return;
  if(!sale.cancelled){ toast('Primero debes cancelar la venta'); return; }
  const ok = window.confirm('¿Eliminar esta venta del historial? Esta acción no se puede deshacer.');
  if(!ok) return;
  DB.saveSales(sales.filter(s => s.id !== saleId));
  toast('Venta eliminada del historial');
  closeModal();
  render();
}

  const hoy = active.filter(s => isSameDay(new Date(s.date), now));
  const semana = active.filter(s => isSameWeek(new Date(s.date), now));
  const mes = active.filter(s => isSameMonth(new Date(s.date), now));

  const sum = arr => arr.reduce((a,s)=>a+s.total,0);
  const ticketProm = active.length ? sum(active)/active.length : 0;
  const gan = computeProfit(active);

  if(active.length === 0){

  active.forEach(s => { byPayment[s.paymentMethod].total += s.total; byPayment[s.paymentMethod].count += 1; });
  const maxPayment = Math.max(1, ...Object.values(byPayment).map(v=>v.total));

  // Por tipo de servicio

  SERVICE_TYPES.forEach(s => byService[s.id] = { total:0, count:0 });
  active.forEach(s => { byService[s.serviceType].total += s.total; byService[s.serviceType].count += 1; });
  const maxService = Math.max(1, ...Object.values(byService).map(v=>v.total));

  // Productos más vendidos
  const productMap = {};
  active.forEach(s => s.items.forEach(it => {
    if(!productMap[it.productId]) productMap[it.productId] = { name: it.name, qty:0, revenue:0 };
    productMap[it.productId].qty += it.qty;
    productMap[it.productId].revenue += it.price * it.qty;
  }));
  const topProducts = Object.values(productMap).sort((a,b)=>b.qty-a.qty).slice(0,5);

  return `
    <h1 class="page-title">Ventas</h1>

      <div class="stat-card">
        <div class="stat-label">Esta semana</div>

        <div class="stat-label" style="margin-top:4px;">${semana.length} pedido${semana.length===1?'':'s'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Este mes</div>
        <div class="stat-value">${formatMoney(sum(mes))}</div>
        <div class="stat-label" style="margin-top:4px;">${mes.length} pedido${mes.length===1?'':'s'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ticket promedio</div>
        <div class="stat-value">${formatMoney(ticketProm)}</div>
        <div class="stat-label" style="margin-top:4px;">${active.length} pedidos en total</div>
      </div>
      ${can('verGanancias') ? `
      <div class="stat-card wide">
        <div class="stat-card-row">
          <div class="stat-icon">${icon('chart')}</div>
          <div>
            <div class="stat-label">Ganancia neta total</div>
            <div class="stat-value" style="${gan.profit < 0 ? 'color:var(--accent-2);' : ''}">${formatMoney(gan.profit)}</div>
            <div class="stat-label" style="margin-top:4px;">Precio de venta − precio de producción (sin IVA)</div>
            ${gan.missing > 0 ? `<div class="stat-label" style="margin-top:2px; color:var(--accent-2);">${gan.missing} artículo${gan.missing === 1 ? '' : 's'} sin precio de producción no ${gan.missing === 1 ? 'se cuenta' : 'se cuentan'}</div>` : ''}
          </div>
        </div>

/* ---------- Ganancia neta ----------
   Ganancia = (precio de venta − precio de producción) × cantidad, sin IVA
   (el IVA no es ganancia). Usa el coste guardado en cada venta; en ventas
   anteriores usa el que tiene hoy el producto. Lo que no tenga precio de
   producción no se cuenta (se avisa en pantalla). */
function itemCost(it){
  if(it.cost != null) return it.cost;
  const p = findProduct(it.productId);
  return (p && p.cost != null) ? p.cost : null;
}
function computeProfit(sales){
  let profit = 0, missing = 0;
  sales.forEach(s => s.items.forEach(it => {
    const c = itemCost(it);
    if(c == null){ missing += it.qty; return; }
    profit += (it.price - c) * it.qty;
  }));
  return { profit: round2(profit), missing };
}

/* ---------- Gráficas de Ventas (barras y líneas) ----------
   Se calculan al vuelo con las ventas guardadas (sin canceladas).
   Cambian solas al elegir Días / Semanas / Meses. */
let statsPeriod = 'days';   // days | weeks | months
let statsSel = null;        // columna seleccionada (null = la actual)
const STATS_PERIODS = [
  { id:'days',   label:'Días',    n:14 },
  { id:'weeks',  label:'Semanas', n:8  },
  { id:'months', label:'Meses',   n:6  },
];

function buildStatsBuckets(sales, period){
  const cfg = STATS_PERIODS.find(p => p.id === period) || STATS_PERIODS[0];
  const now = new Date();
  const rows = [];
  for(let i = cfg.n - 1; i >= 0; i--){
    let start, end, label, long;
    if(period === 'days'){
      start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
      label = String(start.getDate());
      long = i === 0 ? 'Hoy' : start.toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short' });
    } else if(period === 'weeks'){
      start = startOfWeek(now); start.setDate(start.getDate() - 7 * i);
      end = new Date(start); end.setDate(end.getDate() + 7);
      label = start.getDate() + '/' + (start.getMonth() + 1);
      long = i === 0 ? 'Esta semana' : 'Semana del ' + start.toLocaleDateString('es-MX', { day:'numeric', month:'short' });
    } else {
      start = new Date(now.getFullYear(), now.getMonth() - i, 1);
      end = new Date(start.getFullYear(), start.getMonth() + 1, 1);
      label = start.toLocaleDateString('es-MX', { month:'short' }).replace('.', '');
      long = start.toLocaleDateString('es-MX', { month:'long', year:'numeric' });
    }
    rows.push({ start:start.getTime(), end:end.getTime(), label, long, total:0, count:0 });
  }
  sales.forEach(s => {
    const t = new Date(s.date).getTime();
    const r = rows.find(r => t >= r.start && t < r.end);
    if(r){ r.total += s.total; r.count += 1; }
  });
  return rows;
}

function statsChartsHTML(){
  const rows = buildStatsBuckets(visibleSales().filter(s => !s.cancelled), statsPeriod);
  const n = rows.length;
  const sel = (statsSel !== null && statsSel < n) ? statsSel : n - 1;
  const cur = rows[sel];
  const maxTotal = Math.max(1, ...rows.map(r => r.total));
  const maxCount = Math.max(1, ...rows.map(r => r.count));

  const cx = i => ((i + 0.5) / n) * 100;
  const py = v => 8 + (v / maxCount) * 84;            // % desde abajo
  const pts = rows.map((r, i) => cx(i).toFixed(2) + ',' + (100 - py(r.count)).toFixed(2));
  const area = cx(0).toFixed(2) + ',100 ' + pts.join(' ') + ' ' + cx(n - 1).toFixed(2) + ',100';
  const xLabels = `<div class="chart-x">${rows.map((r, i) => `<span class="${i === sel ? 'sel' : ''}">${r.label}</span>`).join('')}</div>`;

  return `
    <div class="seg" role="tablist" aria-label="Periodo">
      ${STATS_PERIODS.map(p => `<button role="tab" aria-selected="${p.id === statsPeriod}" class="${p.id === statsPeriod ? 'active' : ''}" onclick="setStatsPeriod('${p.id}')">${p.label}</button>`).join('')}
    </div>
    <div class="chart-grid">
      <div class="card">
        <div class="chart-head">
          <div><div class="chart-title">Ventas</div><div class="chart-sub">${cur.long}</div></div>
          <div class="chart-value">${formatMoney(cur.total)}</div>
        </div>
        <div class="chart-plot">
          ${rows.map((r, i) => `<button class="chart-col ${i === sel ? 'sel' : ''}" onclick="selectStatsBucket(${i})" aria-label="${r.long}: ${formatMoney(r.total)}">
            <span class="vbar ${r.total ? '' : 'zero'}" style="${r.total ? 'height:' + Math.max(r.total / maxTotal * 100, 4) + '%' : ''}"></span>
          </button>`).join('')}
        </div>
        ${xLabels}
      </div>
      <div class="card">
        <div class="chart-head">
          <div><div class="chart-title">Pedidos</div><div class="chart-sub">${cur.long}</div></div>
          <div class="chart-value">${cur.count} pedido${cur.count === 1 ? '' : 's'}</div>
        </div>
        <div class="chart-plot">
          <svg class="line-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <polygon points="${area}" fill="var(--accent-soft)" opacity=".75"/>
            <polyline points="${pts.join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
          </svg>
          ${rows.map((r, i) => `<button class="chart-col ${i === sel ? 'sel' : ''}" onclick="selectStatsBucket(${i})" aria-label="${r.long}: ${r.count} pedidos">
            <span class="dot" style="bottom:${py(r.count)}%"></span>
          </button>`).join('')}
        </div>
        ${xLabels}
      </div>
    </div>
  `;
}
function refreshStatsCharts(){
  const el = document.getElementById('statsCharts');
  if(el) el.innerHTML = statsChartsHTML();
}

function sumarStock(n){
  const input = document.getElementById('sfStock');
  if(!input) return;
  input.value = Math.max(0, r3((parseFloat(input.value) || 0) + n));
  vibrate(10);
}

function saveStockForm(productId){
  if(!requirePerm('gestionarProductos', 'No tienes permiso para administrar productos')) return;
  const stock = r3(parseFloat(document.getElementById('sfStock').value));
  let min = r3(parseFloat(document.getElementById('sfMin').value));
  if(isNaN(stock) || stock < 0){ toast('Escribe cuánto tienes'); return; }
  if(isNaN(min) || min < 0) min = 2;

  const products = DB.getProducts();
  const p = products.find(x => x.id === productId);
  if(!p) return;
  p.stock = stock;
  p.minStock = min;
  DB.saveProducts(products);
  closeModal();
  toast('Existencias actualizadas', { icon:icon('check'), variant:'toast-success', subtitle: p.name + ': ' + fmtStock(p, stock) });
  render();
}

  if(!requirePerm('gestionarProductos', 'No tienes permiso para administrar productos')) return;
  const products = DB.getProducts();
  const p = products.find(x => x.id === id);
  if(!p) return;

function deleteProduct(productId){

  if(!cat) return;
  const products = DB.getProducts();
  const affected = products.filter(p => p.category === categoryId);
  const msg = affected.length > 0
    ? `"${cat.name}" tiene ${affected.length} producto(s). Se moverán a "Sin categoría". ¿Eliminar de todas formas?`
    : `¿Eliminar la categoría "${cat.name}"?`;
  const ok = window.confirm(msg);

    DB.saveProducts(products);

/* Texto de la etiqueta de precio de producción: cuando el producto
   se vende por tamaño, el precio principal ya no es "el" precio, es un
   aproximado por litro/kilo (referencia para reportes y ganancia).
   El precio de venta se queda fijo porque ese ya se define por tamaño. */
/* Unidades para "Vender por tamaño". Todos los textos del apartado
   (explicación, ejemplos, placeholders, existencias y precio de
   producción) salen de aquí, así que al elegir Kilo o Metro TODO el
   apartado cambia a esa unidad. */
const SIZE_UNITS = {
  litro: { id:'litro', emoji:'💧', label:'Litro', one:'litro', many:'litros', short:'L',  half:'Medio litro', ex:'medio litro, litro o 2 litros', hint:'el litro no siempre cuesta el doble que el medio litro' },
  kilo:  { id:'kilo',  emoji:'⚖️', label:'Kilo',  one:'kilo',  many:'kilos',  short:'kg', half:'Medio kilo',  ex:'medio kilo, kilo o 2 kilos',   hint:'el kilo no siempre cuesta el doble que el medio kilo' },
  metro: { id:'metro', emoji:'📏', label:'Metro', one:'metro', many:'metros', short:'m',  half:'Medio metro', ex:'medio metro, metro o 2 metros', hint:'el metro no siempre cuesta el doble que el medio metro' },
};
function sizeUnitOf(id){ return SIZE_UNITS[id] || SIZE_UNITS.litro; }
function cleanSizeUnit(id){ return SIZE_UNITS[id] ? id : 'litro'; }
/* Unidad que se muestra junto a las existencias ("2.5 kg", "3"). */
function stockUnitShort(p){
  if(!p) return '';
  if(p.sizesOn && p.sizes && p.sizes.length) return sizeUnitOf(p.sizeUnit).short;
  const u = (typeof unitOf === 'function') ? unitOf(p.unit) : null;
  return (u && !u.plain) ? u.short : '';
}
function fmtStock(p, n){
  const s = stockUnitShort(p);
  const v = (Math.round(Number(n) * 1000) / 1000).toLocaleString('es-MX', { maximumFractionDigits:3 });
  return s ? v + ' ' + s : v;
}

function priceFieldLabel(kind, sizesOn, unit){
  const u = sizeUnitOf(unit).one;
  if(kind !== 'produccion' || !sizesOn) return kind === 'venta' ? 'Precio de venta' : 'Precio de producción';
  return `Precio de producción por ${u} (aprox.)`;
}
function updatePriceFieldLabels(){
  const sizesOnEl = document.getElementById('pfSizesOn');
  const unitEl = document.getElementById('pfSizeUnit');
  const sizesOn = !!(sizesOnEl && sizesOnEl.checked);
  const unit = cleanSizeUnit(unitEl && unitEl.value);
  const priceLabel = document.getElementById('pfPriceLabel');
  const costLabel = document.getElementById('pfCostLabel');
  if(priceLabel) priceLabel.textContent = priceFieldLabel('venta', sizesOn, unit);
  if(costLabel) costLabel.textContent = priceFieldLabel('produccion', sizesOn, unit);
  updateStockFieldLabels();
}
/* Etiquetas de existencias según la unidad elegida en el formulario:
   "Kilos que tienes", "Litros que tienes"… o "Cantidad que tienes". */
function formStockUnit(){
  const sizesOn = !!((document.getElementById('pfSizesOn') || {}).checked);
  if(sizesOn){ const su = sizeUnitOf((document.getElementById('pfSizeUnit') || {}).value); return { name:su.many, short:su.short, frac:true }; }
  const sel = document.getElementById('pfUnit');
  const u = (sel && typeof unitOf === 'function') ? unitOf(sel.value) : null;
  if(!u || u.plain) return { name:'', short:'', frac:false };
  return { name: u.frac ? (u.id === 'kilo' ? 'kilos' : u.id === 'litro' ? 'litros' : u.id === 'metro' ? 'metros' : u.label.toLowerCase() + 's') : u.many, short:u.short, frac:!!u.frac };
}
function updateStockFieldLabels(){
  const su = formStockUnit();
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const l1 = document.getElementById('pfStockLabel');
  const l2 = document.getElementById('pfMinStockLabel');
  const sub = document.getElementById('pfStockSub');
  if(l1) l1.textContent = su.name ? cap(su.name) + ' que tienes' : 'Cantidad que tienes';
  if(l2) l2.textContent = 'Avisar cuando queden' + (su.short ? ' (' + su.short + ')' : '');
  if(sub) sub.textContent = su.name
    ? 'Descuenta los ' + su.name + ' vendidos, avisa cuando queden pocos y bloquea el producto al llegar a 0.'
    : 'Descuenta lo que vendes, avisa cuando quede poco y bloquea el producto al llegar a 0.';
  ['pfStock','pfMinStock'].forEach(id => { const el = document.getElementById(id); if(el){ el.step = su.frac ? 'any' : '1'; el.inputMode = su.frac ? 'decimal' : 'numeric'; } });
}

function openProductForm(productId){

  const editing = productId ? products.find(p => p.id === productId) : null;

    <div class="field">
      <label>Foto del producto (opcional)</label>
      <label class="photo-upload ${productFormImage ? 'has-image' : ''}" id="pfPhotoBox">
        ${productFormImage ? `<img id="pfPhotoImg" src="${productFormImage}" alt="">` : icon('camera')}
        <span class="photo-upload-hint">Toca para subir una foto</span>
        <input id="pfPhotoInput" type="file" accept="image/*" style="display:none" onchange="onProductPhotoSelected(this)">
      </label>
      ${productFormImage ? `<button type="button" class="btn ghost block photo-upload-remove-block" style="margin-top:8px;" onclick="removeProductPhoto()">${icon('trash')} Quitar foto</button>` : ''}
    </div>
    <div class="field" id="pfNameField">
      <label>Nombre</label>
      <input id="pfName" type="text" placeholder="Ej. Cuaderno profesional" value="${editing ? escapeHtml(editing.name) : ''}">
    </div>
    <div class="field" id="pfPriceField" style="display:${sizesOn ? 'none' : 'block'};">
      <label id="pfPriceLabel">${priceFieldLabel('venta', sizesOn, sizeUnit)}</label>
      <input id="pfPrice" type="number" min="0" step="0.5" placeholder="0.00" value="${editing ? editing.price : ''}" oninput="updateProductFormWarnings()">
    </div>
    <div class="field" id="pfCostField">
      <label id="pfCostLabel">${priceFieldLabel('produccion', sizesOn, sizeUnit)}</label>
      <input id="pfCost" type="number" min="0" step="0.5" placeholder="0.00" value="${editing && editing.cost != null ? editing.cost : ''}" oninput="updateProductFormWarnings()">
    </div>
    <div class="field-hint warn" id="pfConsistencyHint" style="display:none;"></div>
    <div class="field">
      <label>Categoría</label>
      <select id="pfCategory">
        ${categories.map(c => `<option value="${c.id}" ${editing && editing.category===c.id ? 'selected':''}>${c.emoji} ${c.name}</option>`).join('')}

    </div>

    <div class="section-title">Existencias</div>
    <div class="toggle-row" style="padding-top:0;">
      <span class="acc-ico green">${icon('boxes')}</span>
      <span class="acc-txt">
        <span class="acc-label">Llevar el conteo</span>
        <span class="acc-sub" id="pfStockSub">Descuenta lo que vendes, avisa cuando quede poco y bloquea el producto al llegar a 0.</span>
      </span>
      <label class="switch">
        <input id="pfStockOn" type="checkbox" ${stockOn ? 'checked' : ''} onchange="toggleStockFields(this.checked)">
        <span class="track"></span>
      </label>
    </div>
    <div id="pfStockBox" style="display:${stockOn ? 'block' : 'none'}; margin-top:14px;">
      <div class="two-fields">
        <div class="field" id="pfStockField">
          <label id="pfStockLabel">Cantidad que tienes</label>
          <input id="pfStock" type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="${stockOn ? editing.stock : ''}">
        </div>
        <div class="field" id="pfMinStockField">
          <label id="pfMinStockLabel">Avisar cuando queden</label>
          <input id="pfMinStock" type="number" inputmode="numeric" min="0" step="1" placeholder="2" value="${stockOn ? (editing.minStock == null ? 2 : editing.minStock) : 2}">

    <div class="toggle-row" style="padding-top:0;">
      <span class="acc-ico green">${icon('boxes')}</span>

  `;
  openModal(html, { dismissible:true });
  updateProductFormWarnings();
  updateStockFieldLabels();
}

/* Redimensiona/recorta cualquier imagen a un cuadro fijo (cover) para que
   el tamaño de la tarjeta de producto nunca cambie, sin importar la foto original. */
const PRODUCT_IMAGE_SIZE = 320;
function onProductPhotoSelected(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Selecciona un archivo de imagen'); return; }

  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const size = PRODUCT_IMAGE_SIZE;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      const dx = (size - w) / 2, dy = (size - h) / 2;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, dx, dy, w, h);
      productFormImage = canvas.toDataURL('image/jpeg', 0.85);

      const box = document.getElementById('pfPhotoBox');
      if(box){
        box.classList.add('has-image');
        box.innerHTML = `<img id="pfPhotoImg" src="${productFormImage}" alt="">
          <span class="photo-upload-hint">Toca para subir una foto</span>
          <input id="pfPhotoInput" type="file" accept="image/*" style="display:none" onchange="onProductPhotoSelected(this)">`;
        let removeBtn = box.parentElement.querySelector('.photo-upload-remove-block');
        if(!removeBtn){
          box.insertAdjacentHTML('afterend', `<button type="button" class="btn ghost block photo-upload-remove-block" style="margin-top:8px;" onclick="removeProductPhoto()">${icon('trash')} Quitar foto</button>`);
        }
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeProductPhoto(){
  productFormImage = null;
  const box = document.getElementById('pfPhotoBox');
  if(box){
    box.classList.remove('has-image');
    box.innerHTML = `${icon('camera')}
      <span class="photo-upload-hint">Toca para subir una foto</span>
      <input id="pfPhotoInput" type="file" accept="image/*" style="display:none" onchange="onProductPhotoSelected(this)">`;
  }
  const removeBtn = document.querySelector('.photo-upload-remove-block');
  if(removeBtn) removeBtn.remove();
}

/* Muestra u oculta los campos de existencias dentro del formulario. */
function toggleStockFields(on){
  const box = document.getElementById('pfStockBox');
  if(box) box.style.display = on ? 'block' : 'none';
  if(on){
    const input = document.getElementById('pfStock');
    if(input && input.value === '') input.value = 0;
  }
}

/* Muestra u oculta los campos de tamaños dentro del formulario.
   Cuando se vende por tamaño, el precio de venta ya no se define arriba
   (cada tamaño tiene el suyo), así que ese campo se oculta por completo
   y solo queda el precio de producción por litro/kilo (aprox.). */
function toggleSizeFields(on){
  const box = document.getElementById('pfSizesBox');
  if(box) box.style.display = on ? 'block' : 'none';
  const priceField = document.getElementById('pfPriceField');
  if(priceField) priceField.style.display = on ? 'none' : 'block';
  /* Si arriba ya eligió "Kilo" (o gramo) como unidad de venta, los
     tamaños arrancan en kilos; lo mismo con litros y metros. */
  if(on){
    const sel = document.getElementById('pfUnit');
    const map = { kilo:'kilo', gramo:'kilo', litro:'litro', mililitro:'litro', metro:'metro', centimetro:'metro' };
    if(sel && map[sel.value]){ setSizeUnit(map[sel.value]); return; }
  }
  updatePriceFieldLabels();
  updateProductFormWarnings();
}
function setSizeUnit(unit){
  const u = cleanSizeUnit(unit);
  const su = sizeUnitOf(u);
  const hidden = document.getElementById('pfSizeUnit');
  if(hidden) hidden.value = u;
  Object.keys(SIZE_UNITS).forEach(k => {
    const b = document.getElementById('pfUnit_' + k);
    if(b) b.classList.toggle('active', k === u);
  });
  /* Todo el apartado cambia a la unidad elegida */
  const sub = document.getElementById('pfSizesSub');
  if(sub) sub.textContent = 'Por ejemplo ' + su.ex + '. Cada tamaño con su propio precio.';
  const lbl = document.getElementById('pfSizesLabel');
  if(lbl) lbl.textContent = 'Tamaños y precios (en ' + su.many + ')';
  const hint = document.getElementById('pfSizesHint');
  if(hint) hint.textContent = 'Cada tamaño tiene su propio precio: ' + su.hint + ', tú decides cuánto vale cada uno.';
  document.querySelectorAll('#pfSizeRows .pf-size-label').forEach((el, i) => { el.placeholder = sizePlaceholder(u, i); });
  updatePriceFieldLabels();
  updateProductFormWarnings();
}
function sizePlaceholder(unit, i){
  const su = sizeUnitOf(unit);
  const ej = [su.half, '1 ' + su.one, '2 ' + su.many, '3 ' + su.many];
  return 'Ej. ' + ej[Math.min(i || 0, ej.length - 1)];
}

/* Adivina a cuántos litros/kilos equivale un tamaño a partir de su nombre
   (así el usuario solo escribe "Medio litro" o "2 litros", sin llenar un
   campo aparte). Reconoce palabras comunes (medio, cuarto, tres cuartos),
   fracciones (1/2), números con ml/g/litros/kilos, o un número suelto.
   Si no reconoce nada, asume 1 (un litro/kilo completo) para no romper
   el cálculo; por eso conviene nombrar los tamaños de forma clara. */
function parseSizeQty(label){
  if(!label) return 1;
  let s = label.toLowerCase().trim()
    .replace(/í/g,'i').replace(/ó/g,'o').replace(/é/g,'e').replace(/á/g,'a').replace(/ú/g,'u');

  if(/\btres cuartos\b|\b3\/4\b/.test(s)) return 0.75;
  if(/\bcuarto\b/.test(s)) return 0.25;
  if(/\bmedi[oa]\b/.test(s)) return 0.5;
  if(/\bdoble\b/.test(s)) return 2;

  const fracMatch = s.match(/(\d+)\s*\/\s*(\d+)/);
  if(fracMatch){
    const num = parseFloat(fracMatch[1]), den = parseFloat(fracMatch[2]);
    if(den) return round2(num / den);
  }

  const mlMatch = s.match(/(\d+(?:[.,]\d+)?)\s*ml\b/);
  if(mlMatch) return round2(parseFloat(mlMatch[1].replace(',', '.')) / 1000);

  const gMatch = s.match(/(\d+(?:[.,]\d+)?)\s*(?:gr|g|gramos)\b/);
  if(gMatch) return round2(parseFloat(gMatch[1].replace(',', '.')) / 1000);

  const cmMatch = s.match(/(\d+(?:[.,]\d+)?)\s*(?:cm|centimetros?)\b/);
  if(cmMatch) return round2(parseFloat(cmMatch[1].replace(',', '.')) / 100);

  const numMatch = s.match(/(\d+(?:[.,]\d+)?)\s*(?:litros?|lts?|l\b|kilos?|kgs?|kg\b|metros?|mts?\b|m\b)/);
  if(numMatch) return round2(parseFloat(numMatch[1].replace(',', '.')));

  const anyNum = s.match(/(\d+(?:[.,]\d+)?)/);
  if(anyNum) return round2(parseFloat(anyNum[1].replace(',', '.')));

  if(/\blitro\b|\bkilo\b|\bkg\b|\bl\b|\bmetro\b|\bm\b/.test(s)) return 1;

  return 1;
}

function sizeRowHTML(s, unit, idx){
  s = s || {};
  const hid = document.getElementById('pfSizeUnit');
  const u = cleanSizeUnit(unit || (hid && hid.value));
  const i = idx != null ? idx : document.querySelectorAll('#pfSizeRows .size-row').length;
  return `
    <div class="size-row" data-id="${s.id || ''}">
      <input type="text" class="pf-size-label" placeholder="${sizePlaceholder(u, i)}" value="${s.label ? escapeHtml(s.label) : ''}" oninput="updateProductFormWarnings()">
      <input type="number" class="pf-size-price" inputmode="decimal" min="0" step="0.5" placeholder="Precio" value="${s.price != null && s.price !== '' ? s.price : ''}" oninput="updateProductFormWarnings()">
      <button type="button" class="icon-btn" onclick="removeSizeRow(this)">${icon('trash')}</button>
    </div>`;
}
function addSizeRow(){
  const box = document.getElementById('pfSizeRows');
  if(box) box.insertAdjacentHTML('beforeend', sizeRowHTML({}));
  updateProductFormWarnings();
}
function removeSizeRow(btn){
  const box = document.getElementById('pfSizeRows');
  const row = btn.closest('.size-row');
  if(!box || !row) return;
  if(box.children.length > 1){
    row.remove();
  } else {
    const lbl = row.querySelector('.pf-size-label');
    const pr = row.querySelector('.pf-size-price');
    if(lbl) lbl.value = '';
    if(pr) pr.value = '';
  }
  updateProductFormWarnings();
}

/* Avisa, en vivo mientras se llena el formulario, si el precio de venta
   (o el de algún tamaño) queda por debajo de lo que cuesta producirlo.
   No bloquea el guardado: solo explica la inconsistencia para que el
   usuario decida. Ganancia = precio de venta − precio de producción;
   si el de venta es menor, esa venta pierde dinero en vez de ganar. */
function updateProductFormWarnings(){
  const simpleHint = document.getElementById('pfConsistencyHint');
  const costEl = document.getElementById('pfCost');
  const sizesOnEl = document.getElementById('pfSizesOn');
  if(!costEl || !sizesOnEl) return;
  const clearHint = el => { if(el){ el.style.display = 'none'; el.innerHTML = ''; } };

  const costRaw = costEl.value.trim();
  const cost = costRaw === '' ? null : parseFloat(costRaw);
  if(cost === null || isNaN(cost) || cost < 0){
    clearHint(simpleHint);
    return;
  }

  const sizesOn = sizesOnEl.checked;
  const problems = [];

  if(sizesOn){
    // El aviso en vivo para tamaños (litro/kilo) ya no se muestra aquí:
    // la inconsistencia se valida y se bloquea con una alerta al guardar,
    // ver saveProductForm().
    clearHint(simpleHint);
  } else {
    const priceEl = document.getElementById('pfPrice');
    const priceRaw = priceEl ? priceEl.value : '';
    if(priceRaw !== ''){
      const price = parseFloat(priceRaw);
      if(!isNaN(price) && price < cost){
        problems.push(`el precio de venta (${formatMoney(price)}) es menor que el precio de producción (${formatMoney(cost)})`);
      }
    }
    if(simpleHint){
      if(problems.length){
        simpleHint.style.display = 'block';
        simpleHint.innerHTML = `<b>Pon un precio mayor al costo de producción:</b> ${problems.join('; ')}. La ganancia se calcula como precio de venta − precio de producción: si el de venta es menor, esa venta te hace perder dinero en vez de dejarte ganancia.`;
      } else {
        clearHint(simpleHint);
      }
    }
  }
}

function saveProductForm(productId){
  if(!requirePerm('gestionarProductos', 'No tienes permiso para administrar productos')) return;

  // Limpia mensajes de error de una validación anterior.
  ['pfNameField','pfPriceField','pfCostField','pfStockField','pfMinStockField'].forEach(clearFieldError);
  document.querySelectorAll('#pfSizeRows .size-row.has-error').forEach(r => r.classList.remove('has-error'));

  let ok = true;
  let firstErrorEl = null;
  const markError = (fieldId, message, inputId) => {
    setFieldError(fieldId, message);
    ok = false;
    if(!firstErrorEl) firstErrorEl = document.getElementById(inputId || fieldId);
  };

  const name = document.getElementById('pfName').value.trim();
  const category = document.getElementById('pfCategory').value;

  if(!name){ markError('pfNameField', 'Escribe un nombre para el producto', 'pfName'); }

  // Tamaños/presentaciones (opcional): medio litro, litro, 2 litros, por kilo, etc.
  // Se necesita saber esto antes de validar el precio: cuando se vende por
  // tamaño, el precio de venta no se pide arriba (cada tamaño trae el suyo).
  const sizesOn = document.getElementById('pfSizesOn').checked;

  let price = 0;
  if(!sizesOn){
    price = parseFloat(document.getElementById('pfPrice').value);
    if(isNaN(price) || price < 0){ markError('pfPriceField', 'Ingresa un precio de venta válido', 'pfPrice'); }
  }

  const costRaw = document.getElementById('pfCost').value.trim();
  const cost = costRaw === '' ? null : parseFloat(costRaw);
  if(cost !== null && (isNaN(cost) || cost < 0)){ markError('pfCostField', 'Ingresa un precio de producción válido', 'pfCost'); }

  // Existencias (opcional)
  const stockOn = document.getElementById('pfStockOn').checked;
  let stock = null, minStock = 2;
  if(stockOn){
    /* Con kilos, litros o metros las existencias pueden llevar decimales. */
    const fracStock = formStockUnit().frac;
    const rd = v => fracStock ? Math.round(v * 1000) / 1000 : Math.floor(v);
    stock = parseFloat(document.getElementById('pfStock').value);
    if(isNaN(stock) || stock < 0){ markError('pfStockField', 'Escribe cuánto tienes', 'pfStock'); }
    else stock = rd(stock);
    minStock = parseFloat(document.getElementById('pfMinStock').value);
    if(isNaN(minStock) || minStock < 0) minStock = 2;
    else minStock = rd(minStock);
  }

  let sizeUnit = 'litro', sizes = [];
  if(sizesOn){
    sizeUnit = cleanSizeUnit(document.getElementById('pfSizeUnit').value);
    const rows = document.querySelectorAll('#pfSizeRows .size-row');
    let sizeError = false;
    rows.forEach(row => {
      const label = row.querySelector('.pf-size-label').value.trim();
      const priceRaw = row.querySelector('.pf-size-price').value;
      if(!label && priceRaw === '') return; // fila vacía: se ignora
      const sPrice = parseFloat(priceRaw);
      if(!label || isNaN(sPrice) || sPrice < 0){
        sizeError = true;
        row.classList.add('has-error');
        if(!firstErrorEl) firstErrorEl = row.querySelector('.pf-size-label');
        return;
      }
      // unitQty: cuántos litros/kilos representa este tamaño, adivinado a
      // partir de su nombre (medio litro = 0.5, 2 litros = 2...). Con esto
      // la ganancia se calcula por litro/kilo real y no con el precio de
      // producción completo sin importar el tamaño vendido.
      sizes.push({ id: row.dataset.id || ('sz' + Date.now() + Math.floor(Math.random()*1000)), label, price: round2(sPrice), unitQty: parseSizeQty(label) });
    });
    if(sizeError){
      toast('Cada tamaño necesita un nombre y un precio válido', { variant:'toast-danger', icon:icon('close') });
      ok = false;
    } else if(sizes.length === 0){
      toast('Agrega al menos un tamaño con su precio', { variant:'toast-danger', icon:icon('close') });
      ok = false;
    } else if(cost !== null && !isNaN(cost) && sizes.some(s => s.price < round2(cost * s.unitQty))){
      // No deja agregar/guardar el producto si algún tamaño (litro/kilo, etc.)
      // se vende por debajo de lo que cuesta producirlo.
      alert('El precio de producción es mayor al precio de venta, modifique los precios');
      ok = false;
    } else {
      // El precio "principal" del producto ya no lo define el usuario aquí;
      // se usa el más bajo de los tamaños solo como referencia interna.
      price = round2(Math.min.apply(null, sizes.map(s => s.price)));
    }
  }

  if(!ok){
    if(firstErrorEl){ firstErrorEl.focus({ preventScroll:true }); firstErrorEl.scrollIntoView({ behavior:'smooth', block:'center' }); }
    return;
  }

  const products = DB.getProducts();
  if(productId){
    const p = products.find(x => x.id === productId);
    p.name = name; p.price = round2(price); p.cost = cost === null ? null : round2(cost); p.category = category; p.image = productFormImage;
    p.demo = false; // ya lo personalizó: deja de ser un producto de ejemplo
    dismissDemoHint();
    p.stock = stock; p.minStock = minStock;
    p.sizesOn = sizesOn; p.sizeUnit = sizeUnit; p.sizes = sizes;
  } else {
    products.push({ id:'p' + Date.now(), name, price: round2(price), cost: cost === null ? null : round2(cost), category, active:true, image: productFormImage, stock: stock, minStock: minStock, sizesOn: sizesOn, sizeUnit: sizeUnit, sizes: sizes });
  }
  DB.saveProducts(products);
  productFormImage = null;
  closeModal();
  toast(productId ? 'Producto actualizado' : 'Producto agregado');
  render();
}

/* =========================================================
   Reloj + arranque
========================================================= */
function tickClock(){
  const el = document.getElementById('clock');
  if(!el) return;
  const now = new Date();
  el.innerHTML = now.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit' }) + '<br>' +
    now.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
}

function paintChrome(){
  const mark = document.getElementById('brandMark');
  if(mark) mark.innerHTML = ICONS.fork;
  document.querySelectorAll('.navbtn').forEach(btn => {
    const holder = btn.querySelector('.navicon');
    if(holder) holder.innerHTML = icon(btn.dataset.icon);
  });
  const av = document.getElementById('avatarBtn');
  const u = (typeof currentUser === 'function') ? currentUser() : null;
  /* Con varios usuarios, arriba se ve quién está usando Mesa. */
  const mu = (typeof multiUser === 'function' && multiUser()) ? activeUser() : null;
  if(av){
    const foto = mu ? userPhoto(mu) : (u && u.photo);
    av.innerHTML = foto ? `<img src="${foto}" alt="">`
                        : `<span class="ini">${mu ? userInitials(mu) : initials()}</span>`;
  }
  const chip = document.getElementById('chipName');
  if(chip){
    const n = (mu ? (mu.name || '') : (u && u.name || '')).trim();
    chip.textContent = n ? n.split(/\s+/)[0] : 'Mi cuenta';
  }
}

const AUTH = {
  getUser(){
    try{ return JSON.parse(localStorage.getItem('mesa_user') || 'null'); }
    catch(e){ return null; }
  },
  saveUser(u){ localStorage.setItem('mesa_user', JSON.stringify(u)); },
  isLogged(){ return localStorage.getItem('mesa_session') === '1' && !!AUTH.getUser(); },
  openSession(){ localStorage.setItem('mesa_session','1'); },
  closeSession(){ localStorage.removeItem('mesa_session'); },
  eraseAccount(){
    localStorage.removeItem('mesa_user');
    localStorage.removeItem('mesa_session');
  }
};

/* ---------- Prueba gratis de 3 meses ---------- */
const TRIAL_MESES = 3;
const TRIAL_PRECIO = 129;
function trialInfo(u){
  u = u || currentUser();
  if(!u) return null;
  const start = new Date(u.trialStart || u.createdAt || Date.now());
  const end = new Date(start);
  end.setMonth(end.getMonth() + TRIAL_MESES);
  const now = new Date();
  const totalDays = Math.max(1, Math.round((end - start) / 86400000));
  const daysLeft = Math.max(0, Math.ceil((end - now) / 86400000));
  const daysUsed = Math.min(totalDays, totalDays - daysLeft);
  return {
    start, end, totalDays, daysLeft,
    pct: Math.min(100, Math.max(0, Math.round((daysUsed / totalDays) * 100))),
    expired: now >= end,
    paid: !!u.membershipPaid
  };
}

function currentUser(){ return AUTH.getUser(); }
function userPrefs(){
  const u = currentUser();
  const base = { notifSales:true, notifStock:true, notifDaily:false, haptics:true, bizOnTicket:true };
  return Object.assign(base, (u && u.prefs) || {});
}
function updateUser(patch){
  const u = currentUser() || newUser('MX','');
  AUTH.saveUser(Object.assign({}, u, patch));
}
function displayName(){
  const u = currentUser();
  if(!u) return 'Invitado';
  return u.name && u.name.trim() ? u.name.trim() : 'Sin nombre';
}
function initials(){
  const n = (currentUser() && currentUser().name || '').trim();
  if(!n) return icon('person');
  return n.split(/\s+/).slice(0,2).map(p => p[0].toUpperCase()).join('');
}
function fullPhone(u){
  u = u || currentUser();
  if(!u || !u.phone) return 'Sin número';
  return countryOf(u.country).dial + ' ' + formatPhone(u.phone, u.country);
}
function formatPhone(digits, code){
  const c = countryOf(code);
  if(c.code === 'MX' && digits.length === 10){
    return digits.slice(0,2) + ' ' + digits.slice(2,6) + ' ' + digits.slice(6);
  }
  if(digits.length === 10) return digits.slice(0,3) + ' ' + digits.slice(3,6) + ' ' + digits.slice(6);
  return digits;
}

function sendCode(){
  if(!authPhoneReady()) return;
  const existing = currentUser();
  if(authState.mode === 'login'){
    const same = existing && existing.phone === authState.phone && existing.country === authState.country;
    if(!same){
      toast('No encontramos esa cuenta en este dispositivo', {
        subtitle:'Revisa el número o crea una cuenta nueva',
        variant:'toast-danger', icon:icon('close'), duration:2600
      });
      return;
    }
  }
  vibrate(12);

  if(!SMS_ACTIVADO){
    entrarSinCodigo();
    return;
  }

  authState.code = String(Math.floor(100000 + Math.random() * 900000));
  authState.resendIn = 45;
  authGo('otp');
  startResendTimer();
}

/* Entrada directa mientras el SMS no está conectado.
   Hace exactamente lo mismo que verifyCode() cuando el código es correcto. */
function entrarSinCodigo(){
  if(authState.mode === 'login'){
    AUTH.openSession();
    finishAuth('¡Bienvenido de vuelta!');
    return;
  }
  const existing = currentUser();
  if(existing && existing.phone === authState.phone){
    AUTH.openSession();
    finishAuth('¡Bienvenido de vuelta!');
    return;
  }
  AUTH.saveUser(newUser(authState.country, authState.phone));
  AUTH.openSession();
  authGo('name');
}

function startResendTimer(){
  clearInterval(authResendTimer);
  authResendTimer = setInterval(() => {
    authState.resendIn -= 1;
    const el = document.getElementById('resendArea');
    if(!el){ clearInterval(authResendTimer); return; }
    el.innerHTML = resendHTML();
    if(authState.resendIn <= 0) clearInterval(authResendTimer);
  }, 1000);
}
function resendHTML(){
  if(authState.resendIn > 0){
    return `Puedes pedir otro código en <b>${authState.resendIn}s</b>`;
  }
  return `¿No te llegó? <button onclick="sendCode()">Enviar de nuevo</button>`;
}

function otpValue(){
  return [0,1,2,3,4,5].map(i => (document.getElementById('otp'+i) || {}).value || '').join('');
}
function refreshOtpBtn(){
  const btn = document.getElementById('otpBtn');
  if(btn) btn.disabled = otpValue().length !== 6;
}
function onOtpInput(i, el){
  el.value = el.value.replace(/\D/g,'').slice(0,1);
  el.classList.toggle('filled', !!el.value);
  document.getElementById('otpRow').classList.remove('error');
  if(el.value && i < 5){ document.getElementById('otp'+(i+1)).focus(); }
  refreshOtpBtn();
  if(otpValue().length === 6) setTimeout(verifyCode, 140);
}
function onOtpKey(i, e){
  if(e.key === 'Backspace' && !e.target.value && i > 0){
    const prev = document.getElementById('otp'+(i-1));
    prev.value = ''; prev.classList.remove('filled'); prev.focus();
    refreshOtpBtn();
  }
}
function onOtpPaste(e){
  const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
  if(!txt) return;
  e.preventDefault();
  txt.split('').forEach((d, i) => {
    const cell = document.getElementById('otp'+i);
    if(cell){ cell.value = d; cell.classList.add('filled'); }
  });
  refreshOtpBtn();
  if(txt.length === 6) setTimeout(verifyCode, 140);
}

function verifyCode(){
  const value = otpValue();
  if(value.length !== 6) return;
  if(value !== authState.code){
    const row = document.getElementById('otpRow');
    row.classList.add('error');
    setTimeout(() => row.classList.remove('error'), 400);
    [0,1,2,3,4,5].forEach(i => {
      const c = document.getElementById('otp'+i);
      c.value = ''; c.classList.remove('filled');
    });
    document.getElementById('otp0').focus();
    refreshOtpBtn();
    vibrate([18,60,18]);
    toast('Ese código no coincide', { subtitle:'Revísalo e inténtalo otra vez', variant:'toast-danger', icon:icon('close') });
    return;
  }

  clearInterval(authResendTimer);
  vibrate(20);

  if(authState.mode === 'login'){
    AUTH.openSession();
    finishAuth('¡Bienvenido de vuelta!');
    return;
  }
  const existing = currentUser();
  if(existing && existing.phone === authState.phone){
    AUTH.openSession();
    finishAuth('¡Bienvenido de vuelta!');
    return;
  }
  AUTH.saveUser(newUser(authState.country, authState.phone));
  AUTH.openSession();
  authGo('name');
}

const AVATAR_SIZE = 256;
function onAvatarSelected(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Selecciona un archivo de imagen'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const size = AVATAR_SIZE;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0,0,size,size);
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      accountFormPhoto = canvas.toDataURL('image/jpeg', 0.85);
      const box = document.getElementById('avatarBox');
      if(box){
        box.classList.add('has-image');
        box.innerHTML = `<img src="${accountFormPhoto}" alt="">`;
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removeAvatar(){
  accountFormPhoto = null;
  const box = document.getElementById('avatarBox');
  if(box){ box.classList.remove('has-image'); box.innerHTML = icon('camera'); }
  const del = document.querySelector('.photo-picker-actions .btn.danger');
  if(del) del.remove();
}
