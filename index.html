/* =========================================================
   HORARIOS
   Un horario = 7 días (índice como Date.getDay(): 0 = domingo).
   Cada día: { open, from:'HH:MM', to:'HH:MM' }.
   Si "to" es menor o igual que "from", cierra al día siguiente
   (ej. 18:00 a 02:00).
========================================================= */
const HRS_DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const HRS_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const HRS_ORDER = [1,2,3,4,5,6,0];   // se muestra de lunes a domingo
function hrsDefault(){
  return [0,1,2,3,4,5,6].map(d => ({ open:d !== 0, from:'09:00', to:'21:00' }));
}
function hrsValidTime(t){ return typeof t === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(t); }
function hrsClean(days){
  if(!Array.isArray(days) || days.length !== 7) return null;
  return days.map(x => ({
    open: !!(x && x.open),
    from: hrsValidTime(x && x.from) ? x.from : '09:00',
    to:   hrsValidTime(x && x.to)   ? x.to   : '21:00'
  }));
}
function hrsMin(t){ const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function hrsFmt(t){
  const [h, m] = t.split(':').map(Number);
  const hh = h % 12 === 0 ? 12 : h % 12;
  return hh + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? ' am' : ' pm');
}
function hrsRange(x){ return x.from === x.to ? 'Abierto 24 horas' : hrsFmt(x.from) + ' – ' + hrsFmt(x.to); }

/* ¿Está abierto en este momento? Revisa hoy y lo que quedó de ayer (horario nocturno). */
function hrsIsOpen(days, when){
  days = hrsClean(days);
  if(!days) return true;                       // sin horario = siempre abierto
  const now = when || new Date();
  const d = now.getDay(), m = now.getHours() * 60 + now.getMinutes();
  const hoy = days[d], ayer = days[(d + 6) % 7];
  if(hoy.open){
    const f = hrsMin(hoy.from), t = hrsMin(hoy.to);
    if(f === t) return true;
    if(t > f ? (m >= f && m < t) : m >= f) return true;
  }
  if(ayer.open){
    const f = hrsMin(ayer.from), t = hrsMin(ayer.to);
    if(t < f && m < t) return true;
  }
  return false;
}
/* Texto de cuándo vuelve a abrir: "hoy a las 1 pm", "mañana a las 9 am", "el lunes a las 9 am". */
function hrsNextOpen(days, when){
  days = hrsClean(days);
  if(!days) return '';
  const now = when || new Date();
  const d = now.getDay(), m = now.getHours() * 60 + now.getMinutes();
  for(let i = 0; i < 8; i++){
    const x = days[(d + i) % 7];
    if(!x.open) continue;
    if(i === 0 && hrsMin(x.from) <= m) continue;
    const cuando = i === 0 ? 'hoy' : (i === 1 ? 'mañana' : 'el ' + HRS_DAYS[(d + i) % 7].toLowerCase());
    return cuando + ' a las ' + hrsFmt(x.from);
  }
  return '';
}
/* Hora de cierre de hoy si está abierto: "Cierra a las 9 pm". */
function hrsClosesAt(days, when){
  days = hrsClean(days);
  if(!days) return '';
  const now = when || new Date();
  const d = now.getDay(), m = now.getHours() * 60 + now.getMinutes();
  const hoy = days[d], ayer = days[(d + 6) % 7];
  if(ayer.open && hrsMin(ayer.to) < hrsMin(ayer.from) && m < hrsMin(ayer.to)) return hrsFmt(ayer.to);
  if(hoy.open && hoy.from !== hoy.to) return hrsFmt(hoy.to);
  return '';
}
/* Resumen corto agrupando días seguidos iguales: "Lun–Sáb 9 am – 9 pm · Dom cerrado" */
function hrsSummary(days){
  days = hrsClean(days);
  if(!days) return '';
  const key = x => x.open ? x.from + '-' + x.to : 'x';
  const grupos = [];
  HRS_ORDER.forEach(d => {
    const g = grupos[grupos.length - 1];
    if(g && key(days[g.last]) === key(days[d])){ g.last = d; g.n++; }
    else grupos.push({ first:d, last:d, n:1 });
  });
  return grupos.map(g => {
    const dias = g.n === 1 ? HRS_SHORT[g.first] : (g.n === 2 ? HRS_SHORT[g.first] + ' y ' + HRS_SHORT[g.last] : HRS_SHORT[g.first] + '–' + HRS_SHORT[g.last]);
    const x = days[g.first];
    return (g.n === 7 ? 'Todos los días' : dias) + ' ' + (x.open ? hrsRange(x) : 'cerrado');
  }).join(' · ');
}
function hrsStatus(days){
  if(!hrsClean(days)) return { on:true, txt:'Sin horario' };
  if(hrsIsOpen(days)){
    const c = hrsClosesAt(days);
    return { on:true, txt:'Abierto ahora' + (c ? ' · cierra a las ' + c : '') };
  }
  const n = hrsNextOpen(days);
  return { on:false, txt:'Cerrado ahora' + (n ? ' · abre ' + n : '') };
}

/* ---------- Editor de horario (se usa en el negocio y en el menú) ---------- */
let hrsDraft = null;
function hrsEditorHTML(){
  return hrsListHTML() + `
    <button class="btn ghost block hrs-copy" onclick="hrsCopyMonday()">${icon('copy')} Copiar el horario del lunes a todos los días abiertos</button>`;
}
function hrsListHTML(){
  return `
    <div class="hrs-list" id="hrsList">${HRS_ORDER.map(d => {
      const x = hrsDraft[d];
      return `<div class="hrs-row ${x.open ? '' : 'off'}">
        <span class="hrs-day">${HRS_DAYS[d]}</span>
        ${x.open ? '' : `<span class="hrs-closed">Cerrado</span>`}
        <label class="switch"><input type="checkbox" ${x.open ? 'checked' : ''} onchange="hrsToggleDay(${d}, this.checked)"><span class="track"></span></label>
        ${x.open ? `<span class="hrs-times">
            <input type="time" value="${x.from}" aria-label="${HRS_DAYS[d]}: abre" onchange="hrsSetTime(${d},'from',this.value)">
            <span>a</span>
            <input type="time" value="${x.to}" aria-label="${HRS_DAYS[d]}: cierra" onchange="hrsSetTime(${d},'to',this.value)">
          </span>` : ''}
      </div>`;
    }).join('')}</div>`;
}
function hrsRepaint(){ const el = document.getElementById('hrsList'); if(el) el.outerHTML = hrsListHTML(); }
function hrsToggleDay(d, on){ hrsDraft[d].open = !!on; vibrate(8); hrsRepaint(); }
function hrsSetTime(d, k, v){ if(hrsValidTime(v)) hrsDraft[d][k] = v; }
function hrsCopyMonday(){
  const l = hrsDraft[1];
  hrsDraft.forEach((x, i) => { if(i !== 1 && x.open){ x.from = l.from; x.to = l.to; } });
  vibrate(8); hrsRepaint();
  toast('Horario del lunes copiado');
}

/* =========================================================
   USUARIOS Y PERMISOS  —  función OPCIONAL de Mesa
   ---------------------------------------------------------
   Mesa arranca como siempre: un solo usuario (el Dueño), sin
   NIP y sin pantallas nuevas. Todo esto solo "despierta"
   cuando el Dueño agrega a alguien más desde
   Configuración → Usuarios.

   Se guarda igual que el resto de la app (localStorage):
     mesa_users        -> usuarios, roles, NIP y permisos
     mesa_active_user  -> quién está usando Mesa ahora
     mesa_shifts       -> turnos (entrada y salida)
   Las ventas guardan quién las cobró (userId / userName).
========================================================= */

});

/* ---------- Roles y permisos ---------- */
const ROLES = [
  { id:'dueno',    name:'Dueño',         sub:'Control total. Solo él administra usuarios.' },
  { id:'admin',    name:'Administrador', sub:'Ve todas las ventas y administra productos.' },
  { id:'empleado', name:'Empleado',      sub:'Cobra y ve solo sus propias ventas y turnos.' }
];
function roleOf(id){ return ROLES.find(r => r.id === id) || ROLES[2]; }

const PERMS = [
  { id:'verTodasVentas',     label:'Ver todas las ventas',   sub:'Historial y estadísticas de todo el negocio.' },
  { id:'gestionarProductos', label:'Administrar productos',  sub:'Agregar, modificar o eliminar productos y existencias.' },
  { id:'cancelarVentas',     label:'Cancelar ventas',        sub:'Marcar una venta como cancelada.' },
  { id:'verGanancias',       label:'Ver ganancias y costos', sub:'Precio de producción y ganancia neta.' }
];

function defaultPerms(role){
  if(role === 'empleado'){
    return { verTodasVentas:false, gestionarProductos:false, cancelarVentas:false, verGanancias:false };
  }
  return { verTodasVentas:true, gestionarProductos:true, cancelarVentas:true, verGanancias:true };
}

/* ---------- Lectura de usuarios ---------- */
function ensureOwnerUser(){
  const list = DB.getUsers();
  if(list.length === 0){
    const acc = (typeof currentUser === 'function' ? currentUser() : null) || {};
    DB.saveUsers([{
      id: 'u_owner',
      name: (acc.name && acc.name.trim()) ? acc.name.trim() : 'Dueño',
      role: 'dueno',
      pin: null,
      phone: acc.phone || '',
      country: acc.country || 'MX',
      perms: defaultPerms('dueno'),
      createdAt: new Date().toISOString()
    }]);
    return;
  }
  let changed = false;
  list.forEach(u => { if(!u.perms){ u.perms = defaultPerms(u.role); changed = true; } });
  if(!list.some(u => u.role === 'dueno')){
    list[0].role = 'dueno';
    list[0].perms = defaultPerms('dueno');
    changed = true;
  }
  if(changed) DB.saveUsers(list);
}

function userById(id){ return DB.getUsers().find(u => u.id === id) || null; }
function ownerUser(){ return DB.getUsers().find(u => u.role === 'dueno') || null; }
/** ¿Ya hay más de un usuario? Si no, Mesa se comporta como POS de un solo usuario. */
function multiUser(){ return DB.getUsers().length > 1; }

function activeUser(){
  const list = DB.getUsers();
  if(!list.length) return null;
  const id = localStorage.getItem('mesa_active_user') || '';
  return list.find(u => u.id === id) || list.find(u => u.role === 'dueno') || list[0];
}
function setActiveUser(id){
  if(id) localStorage.setItem('mesa_active_user', id);
  else localStorage.removeItem('mesa_active_user');
}
/* Sesión del usuario: mientras esté abierta, Mesa NO vuelve a pedir el
   NIP aunque se recargue o se cierre la página. Solo se cierra cuando
   alguien le da a "Cambiar de usuario" (o se cierra la cuenta). */
function openUserSession(){ localStorage.setItem('mesa_user_session','1'); }
function closeUserSession(){ localStorage.removeItem('mesa_user_session'); }
function userSessionOpen(){ return localStorage.getItem('mesa_user_session') === '1'; }

/* Desbloqueo de esta sesión. Vive en sessionStorage: aguanta las recargas
   de la página, pero se borra al cerrar Mesa. Así el NIP se pide cuando
   se ABRE la app, y no otra vez cada vez que se recarga. */
function markAppUnlocked(){ try{ sessionStorage.setItem('mesa_unlocked','1'); }catch(e){} }
function clearAppUnlocked(){ try{ sessionStorage.removeItem('mesa_unlocked'); }catch(e){} }
function appUnlockedThisSession(){
  try{ return sessionStorage.getItem('mesa_unlocked') === '1'; }catch(e){ return false; }
}
function userInitials(u){
  const n = ((u && u.name) || '').trim();
  if(!n) return icon('person');
  return n.split(/\s+/).slice(0,2).map(p => p[0].toUpperCase()).join('');
}
function userFirstName(u){
  const n = ((u && u.name) || '').trim();
  return n ? n.split(/\s+/)[0] : '';
}
/* Foto del usuario. El Dueño usa la misma foto de su perfil, así que
   si ya tenía una, se sigue viendo en todas partes. */
function userPhoto(u){
  if(!u) return null;
  if(u.photo) return u.photo;
  if(u.role === 'dueno'){
    const acc = (typeof currentUser === 'function') ? currentUser() : null;
    if(acc && acc.photo) return acc.photo;
  }
  return null;
}
function userAvatar(u){
  const ph = userPhoto(u);
  return ph ? `<img src="${ph}" alt="">` : userInitials(u);
}
function syncOwnerName(){
  const list = DB.getUsers();
  const o = list.find(u => u.role === 'dueno');
  const acc = (typeof currentUser === 'function' ? currentUser() : null) || {};
  if(o && acc.name && acc.name.trim() && o.name !== acc.name.trim()){
    o.name = acc.name.trim();
    DB.saveUsers(list);
  }
}

/* ---------- Permisos ---------- */
/** Con un solo usuario no hay restricciones: todo es del Dueño. */
function can(perm){
  if(!multiUser()) return true;
  const u = activeUser();
  if(!u) return true;
  if(u.role === 'dueno') return true;
  const p = Object.assign(defaultPerms(u.role), u.perms || {});
  return !!p[perm];
}
function isOwner(){
  if(!multiUser()) return true;
  const u = activeUser();
  return !u || u.role === 'dueno';
}
function requirePerm(perm, msg){
  if(can(perm)) return true;
  vibrate([18,60,18]);
  toast(msg || 'No tienes permiso para hacer esto', { variant:'toast-danger', icon:icon('close'), subtitle:'Pídeselo al Dueño o al Administrador.' });
  return false;
}
function requireOwner(msg){
  if(isOwner()) return true;
  vibrate([18,60,18]);
  toast(msg || 'Solo el Dueño puede hacer esto', { variant:'toast-danger', icon:icon('close') });
  return false;
}

/* ---------- Ventas visibles según quién está usando Mesa ---------- */
function visibleSales(list){
  list = list || DB.getSales();
  if(!multiUser() || can('verTodasVentas')) return list;
  const me = activeUser();
  if(!me) return list;
  return list.filter(s => s.userId === me.id);
}
function canSeeSale(sale){
  if(!multiUser() || can('verTodasVentas')) return true;
  const me = activeUser();
  return !!me && sale.userId === me.id;
}
/** Nombre de quien cobró, para mostrarlo al Dueño y al Administrador. */
function saleWho(sale){
  if(!multiUser() || !can('verTodasVentas')) return '';
  if(!sale.userName) return '';
  return sale.userName;
}

/* =========================================================
   TURNOS
   Se abre un turno cuando alguien entra con su NIP y se
   cierra al cambiar de usuario. Solo aplica con varios
   usuarios: con uno solo, Mesa no lleva turnos.
========================================================= */
function openShiftFor(user){
  if(!multiUser() || !user) return;
  const shifts = DB.getShifts();
  shifts.forEach(s => { if(!s.end) s.end = new Date().toISOString(); });
  shifts.push({
    id: 't' + Date.now(),
    userId: user.id,
    userName: user.name,
    role: user.role,
    start: new Date().toISOString(),
    end: null
  });
  DB.saveShifts(shifts);
}
function closeOpenShifts(){
  const shifts = DB.getShifts();
  let changed = false;
  shifts.forEach(s => { if(!s.end){ s.end = new Date().toISOString(); changed = true; } });
  if(changed) DB.saveShifts(shifts);
}
function currentShift(){
  const me = activeUser();
  if(!me) return null;
  return DB.getShifts().find(s => !s.end && s.userId === me.id) || null;
}
function shiftSales(shift){
  const start = new Date(shift.start).getTime();
  const end = shift.end ? new Date(shift.end).getTime() : Date.now();
  return DB.getSales().filter(s => {
    if(s.userId !== shift.userId || s.cancelled) return false;
    const t = new Date(s.date).getTime();
    return t >= start && t <= end;
  });
}
function shiftTotals(shift){
  const sales = shiftSales(shift);
  return { count: sales.length, total: sales.reduce((a,s) => a + s.total, 0) };
}
function shiftClock(iso){
  return new Date(iso).toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
}
function visibleShifts(){
  const all = DB.getShifts().slice().sort((a,b) => new Date(b.start) - new Date(a.start));
  if(can('verTodasVentas')) return all;
  const me = activeUser();
  return me ? all.filter(s => s.userId === me.id) : [];
}

function onUserPinInput(el){
  el.value = el.value.replace(/\D/g,'').slice(0,4);
  const dots = document.querySelectorAll('#userPinDots .pin-dot');
  dots.forEach((d, i) => d.classList.toggle('on', i < el.value.length));
  if(el.value.length !== 4) return;
  const u = userById(authState.pickedUser);
  if(u && el.value === u.pin){
    vibrate(15);
    enterAsUser(u);
  }else{
    vibrate([18,60,18]);
    el.value = '';
    dots.forEach(d => d.classList.remove('on'));
    toast('NIP incorrecto', { variant:'toast-danger', icon:icon('close') });
  }
}

function enterAsUser(u){
  setActiveUser(u.id);
  openUserSession();
  markAppUnlocked();
  openShiftFor(u);
  hideAuth();
  closeModal();
  cart = [];
  currentView = 'home';
  paintChrome();
  render();
  toast('Bienvenido, ' + (userFirstName(u) || u.name), { variant:'toast-success', icon:icon('check'), subtitle:'Turno iniciado a las ' + shiftClock(new Date().toISOString()) });
}

/** Cierra el turno actual y vuelve a la selección de usuario. */
function switchUser(){
  const sh = currentShift();
  let resumen = '';
  if(sh){
    const t = shiftTotals(sh);
    resumen = t.count + (t.count === 1 ? ' venta · ' : ' ventas · ') + formatMoney(t.total);
  }
  closeOpenShifts();
  closeUserSession();
  clearAppUnlocked();
  closeModal();
  cart = [];
  checkout = { serviceType:'comer', table:'', paymentMethod:'efectivo', cash:'' };
  currentView = 'home';
  authState.pickedUser = null;
  showAuth('users');
  if(resumen) toast('Turno cerrado', { subtitle: resumen, icon:icon('clock') });
}

function saveNewUser(){
  if(!requireOwner('Solo el Dueño puede agregar usuarios')) return;
  const name = document.getElementById('nuName').value.trim();
  const role = document.getElementById('nuRole').value;
  const phone = document.getElementById('nuPhone').value.replace(/\D/g,'');
  const a = document.getElementById('nuPin1').value.replace(/\D/g,'');
  const b = document.getElementById('nuPin2').value.replace(/\D/g,'');
  if(name.length < 2){ toast('Escribe el nombre de la persona'); return; }
  if(a.length !== 4){ toast('El NIP debe tener 4 dígitos'); return; }
  if(a !== b){ toast('Los dos NIP no son iguales'); return; }

  const list = DB.getUsers();
  list.push({
    id: 'u' + Date.now(),
    name: name,
    role: (role === 'admin' ? 'admin' : 'empleado'),
    pin: a,
    phone: phone,
    country: (currentUser() || {}).country || 'MX',
    perms: defaultPerms(role),
    createdAt: new Date().toISOString()
  });
  DB.saveUsers(list);

  // El Dueño que estaba usando Mesa sigue siendo el usuario activo.
  const me = activeUser();
  if(me) setActiveUser(me.id);
  openUserSession();
  if(!currentShift()) openShiftFor(activeUser());

  toast(roleOf(role).name + ' agregado', { variant:'toast-success', icon:icon('check'), subtitle: name + ' ya puede entrar con su NIP' });
  paintChrome();
  render();
  openUsersSheet();

let userFormPhoto = null;

function openUserPhotoForm(id){
  const u = userById(id);
  if(!u) return;

  if(!esMio && !isOwner()){ requireOwner('Solo el Dueño puede cambiar la foto de otros'); return; }
  userFormPhoto = userPhoto(u);
  openModal(`
    <h3 class="sheet-title">${esMio ? 'Mi foto' : 'Foto de ' + escapeHtml(u.name)}</h3>
    <p class="sheet-text">Se verá arriba, en la selección de usuario y en los turnos.</p>
    <div class="photo-picker">
      <div class="photo-picker-circle ${userFormPhoto ? 'has-image':''}" id="userPhotoBox" onclick="document.getElementById('userPhotoInput').click()">
        ${userFormPhoto ? `<img src="${userFormPhoto}" alt="">` : icon('camera')}
      </div>
      <div class="photo-picker-actions">
        <button class="btn ghost" onclick="document.getElementById('userPhotoInput').click()">${icon('camera')} Elegir foto</button>
        ${userFormPhoto ? `<button class="btn danger" onclick="removeUserPhoto()">${icon('trash')} Quitar</button>` : ''}
      </div>
      <input id="userPhotoInput" type="file" accept="image/*" style="display:none" onchange="onUserPhotoSelected(this)">
    </div>
    <div class="sheet-actions">
      <button class="btn ghost block" onclick="openUsersSheet()">Cancelar</button>
      <button class="btn primary block" onclick="saveUserPhoto('${u.id}')">Guardar</button>
    </div>
  `, { dismissible:true });

function onUserPhotoSelected(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Selecciona un archivo de imagen'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const size = AVATAR_SIZE;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0,0,size,size);
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      userFormPhoto = canvas.toDataURL('image/jpeg', 0.85);
      const box = document.getElementById('userPhotoBox');
      if(box){
        box.classList.add('has-image');
        box.innerHTML = `<img src="${userFormPhoto}" alt="">`;
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeUserPhoto(){
  userFormPhoto = null;
  const box = document.getElementById('userPhotoBox');
  if(box){ box.classList.remove('has-image'); box.innerHTML = icon('camera'); }
  const del = document.querySelector('.photo-picker-actions .btn.danger');
  if(del) del.remove();
}

function saveUserPhoto(id){
  const list = DB.getUsers();
  const u = list.find(x => x.id === id);
  if(!u) return;
  const me = activeUser();
  if(!(me && me.id === u.id) && !isOwner()){ requireOwner('Solo el Dueño puede cambiar la foto de otros'); return; }
  u.photo = userFormPhoto || null;
  DB.saveUsers(list);
  /* El Dueño comparte la foto con su perfil de la cuenta. */
  if(u.role === 'dueno') updateUser({ photo: userFormPhoto || null });
  userFormPhoto = null;
  paintChrome();
  render();
  toast('Foto actualizada', { variant:'toast-success', icon:icon('check') });
  openUsersSheet();
}

/* ---------- Mi NIP ---------- */
function openMyPinForm(){
  const me = activeUser();
  if(!me) return;
  openSetPinForm(me.id, true);
}

function openSetPinForm(id, mine){
  const u = userById(id);
  if(!u) return;
  if(!mine && !isOwner()){ requireOwner('Solo el Dueño puede cambiar el NIP de otros'); return; }
  const me = activeUser();
  const esMio = !!mine || (me && me.id === u.id);
  openModal(`
    <h3 class="sheet-title">${esMio ? 'Mi NIP' : 'NIP de ' + escapeHtml(u.name)}</h3>
    <p class="sheet-text">
      ${u.pin ? 'Escribe un NIP nuevo de 4 dígitos.' : 'Crea un NIP de 4 dígitos para entrar a ' + APP_NAME + '.'}
    </p>
    ${(esMio && u.pin) ? `
      <div class="field">
        <label for="spOld">NIP actual</label>
        <input id="spOld" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:8px; text-align:center;">
      </div>` : ''}
    <div class="field">
      <label for="spPin1">NIP nuevo</label>
      <input id="spPin1" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:8px; text-align:center;">
    </div>
    <div class="field">
      <label for="spPin2">Repite el NIP</label>
      <input id="spPin2" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:8px; text-align:center;">
    </div>
    <div class="sheet-actions">
      <button class="btn ghost block" onclick="openUsersSheet()">Cancelar</button>
      <button class="btn primary block" onclick="saveSetPin('${u.id}', ${esMio ? 'true' : 'false'})">Guardar NIP</button>
    </div>
  `, { dismissible:true });
}

function saveSetPin(id, esMio){
  const list = DB.getUsers();
  const u = list.find(x => x.id === id);
  if(!u) return;
  if(!esMio && !isOwner()){ requireOwner('Solo el Dueño puede cambiar el NIP de otros'); return; }
  const oldEl = document.getElementById('spOld');
  if(oldEl && u.pin && oldEl.value.replace(/\D/g,'') !== u.pin){
    toast('Tu NIP actual no es correcto', { variant:'toast-danger', icon:icon('close') });
    return;
  }
  const a = document.getElementById('spPin1').value.replace(/\D/g,'');
  const b = document.getElementById('spPin2').value.replace(/\D/g,'');
  if(a.length !== 4){ toast('El NIP debe tener 4 dígitos'); return; }
  if(a !== b){ toast('Los dos NIP no son iguales'); return; }
  u.pin = a;
  DB.saveUsers(list);
  toast('NIP guardado', { variant:'toast-success', icon:icon('check') });
  openUsersSheet();
}

========================================================= */
function openShiftsSheet(){
  const shifts = visibleShifts();
  const todos = can('verTodasVentas');
  const body = shifts.length === 0 ? `
    <div class="empty-state">
      ${illustration('receiptEmpty')}
      <div class="empty-title">Aún no hay turnos</div>
      <div class="empty-text">Los turnos se registran cuando cada usuario entra con su NIP.</div>
    </div>
  ` : `
    <div class="card">
      ${shifts.slice(0, 40).map(s => {
        const t = shiftTotals(s);
        const abierto = !s.end;

          <div class="shift-row">
            <span class="acc-ico ${s.role === 'dueno' ? 'gold' : (s.role === 'admin' ? 'blue' : 'green')} ${userPhoto(userById(s.userId)) ? 'has-photo' : ''}">

      <button class="btn primary block" onclick="openUsersSheet()">Volver</button>

/* =========================================================
   OLVIDÉ MI NIP  (prototipo local)
   ---------------------------------------------------------
   Por ahora NO se envía ningún SMS ni WhatsApp: el código se
   genera y se muestra en la misma pantalla, solo para probar
   el flujo completo. Cuando conectes un servicio real, aquí
   es donde se manda el código al teléfono guardado.
========================================================= */
const NIP_SMS_ACTIVADO = false;
let nipRecover = { userId:null, code:'', step:1 };

function openNipRecovery(preId){
  const list = DB.getUsers();
  const enAcceso = document.getElementById('authLayer').classList.contains('show');
  nipRecover = { userId: preId || null, code:'', step: preId ? 2 : 1 };
  /* Dentro de la app, cada quien solo recupera su propio NIP.
     El Dueño sí puede recuperar el de cualquiera, y en la pantalla
     de acceso se puede elegir a quién (todavía nadie entró). */
  if(!enAcceso && !isOwner()){
    const me = activeUser();
    if(me){ nipRecover.userId = me.id; nipRecover.step = 2; }
  }
  if(list.length === 1){ nipRecover.userId = list[0].id; nipRecover.step = 2; }
  renderNipRecovery();
}

function renderNipRecovery(){
  const list = DB.getUsers();
  const u = userById(nipRecover.userId);
  const back = `<button class="sheet-close" onclick="closeNipRecovery()">${icon('close')}</button>`;

  if(nipRecover.step === 1){
    openModal(`
      <div class="sheet-header"><h2>Olvidé mi NIP</h2>${back}</div>
      <p class="sheet-text">¿De quién es el NIP que quieres recuperar?</p>
      <div class="acc-list">
        ${list.map(x => `
          <button class="acc-row" onclick="nipPickUser('${x.id}')">
            <span class="acc-ico ${x.role === 'dueno' ? 'gold' : (x.role === 'admin' ? 'blue' : 'green')} ${userPhoto(x) ? 'has-photo' : ''}">${userPhoto(x) ? `<img src="${userPhoto(x)}" alt="">` : `<span class="ini">${userInitials(x)}</span>`}</span>
            <span class="acc-txt">
              <span class="acc-label">${escapeHtml(x.name)}</span>
              <span class="acc-sub">${roleOf(x.role).name}</span>
            </span>
            <span class="acc-chev">${icon('chevronRight')}</span>
          </button>`).join('')}
      </div>
    `, { dismissible:true });
    return;
  }

  if(nipRecover.step === 2){
    const tiene = !!(u && u.phone);
    openModal(`
      <div class="sheet-header"><h2>Olvidé mi NIP</h2>${back}</div>
      <p class="sheet-text">
        ${tiene
          ? 'Escribe el teléfono registrado de <b>' + escapeHtml(u.name) + '</b> para confirmar que eres tú.'
          : '<b>' + escapeHtml(u ? u.name : '') + '</b> no tiene un teléfono registrado. Pídele al Dueño que lo agregue en Configuración → Usuarios.'}
      </p>
      ${tiene ? `
        <div class="field">
          <label for="nrPhone">Teléfono registrado</label>
          <input id="nrPhone" type="tel" inputmode="numeric" placeholder="981 123 4567">
          <div class="field-hint">Termina en ${escapeHtml(String(u.phone).slice(-2))}</div>
        </div>` : ''}
      <div class="sheet-actions">
        <button class="btn ghost block" onclick="closeNipRecovery()">Cancelar</button>
        ${tiene ? '<button class="btn primary block" onclick="nipCheckPhone()">Continuar</button>' : ''}
      </div>
    `, { dismissible:true });
    return;
  }

  if(nipRecover.step === 3){
    openModal(`
      <div class="sheet-header"><h2>Código de verificación</h2>${back}</div>
      <p class="sheet-text">
        Escribe el código de 6 dígitos para continuar.
      </p>
      ${!NIP_SMS_ACTIVADO ? `
        <div class="recover-code">${nipRecover.code}</div>
        <p class="sheet-text" style="margin-top:0;">
          Prototipo local: el código se muestra aquí porque todavía no hay envío
          real por SMS ni WhatsApp. Nada sale de este dispositivo.
        </p>` : ''}
      <div class="field">
        <label for="nrCode">Código</label>
        <input id="nrCode" type="tel" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:6px; text-align:center;">
      </div>
      <div class="sheet-actions">
        <button class="btn ghost block" onclick="closeNipRecovery()">Cancelar</button>
        <button class="btn primary block" onclick="nipCheckCode()">Verificar</button>
      </div>
    `, { dismissible:true });
    return;
  }

  openModal(`
    <div class="sheet-header"><h2>Nuevo NIP</h2>${back}</div>
    <p class="sheet-text">Listo. Ahora crea el NIP nuevo de <b>${escapeHtml(u ? u.name : '')}</b>.</p>
    <div class="field">
      <label for="nrPin1">NIP nuevo</label>
      <input id="nrPin1" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:8px; text-align:center;">
    </div>
    <div class="field">
      <label for="nrPin2">Repite el NIP</label>
      <input id="nrPin2" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:8px; text-align:center;">
    </div>
    <div class="sheet-actions">
      <button class="btn ghost block" onclick="closeNipRecovery()">Cancelar</button>
      <button class="btn primary block" onclick="nipSaveNewPin()">Guardar NIP</button>
    </div>
  `, { dismissible:true });
}

function nipPickUser(id){ nipRecover.userId = id; nipRecover.step = 2; renderNipRecovery(); }

function nipCheckPhone(){
  const u = userById(nipRecover.userId);
  if(!u) return;
  const typed = (document.getElementById('nrPhone').value || '').replace(/\D/g,'');
  const saved = String(u.phone || '').replace(/\D/g,'');
  if(!typed){ toast('Escribe el teléfono'); return; }
  if(typed !== saved){
    vibrate([18,60,18]);
    toast('Ese no es el teléfono registrado', { variant:'toast-danger', icon:icon('close') });
    return;
  }
  nipRecover.code = String(Math.floor(100000 + Math.random() * 900000));
  nipRecover.step = 3;
  renderNipRecovery();
}

function nipCheckCode(){
  const typed = (document.getElementById('nrCode').value || '').replace(/\D/g,'');
  if(typed !== nipRecover.code){
    vibrate([18,60,18]);
    toast('Código incorrecto', { variant:'toast-danger', icon:icon('close') });
    return;
  }
  nipRecover.step = 4;
  renderNipRecovery();
}

function nipSaveNewPin(){
  const list = DB.getUsers();
  const u = list.find(x => x.id === nipRecover.userId);
  if(!u) return;
  const a = document.getElementById('nrPin1').value.replace(/\D/g,'');
  const b = document.getElementById('nrPin2').value.replace(/\D/g,'');
  if(a.length !== 4){ toast('El NIP debe tener 4 dígitos'); return; }
  if(a !== b){ toast('Los dos NIP no son iguales'); return; }
  u.pin = a;
  DB.saveUsers(list);
  nipRecover = { userId:null, code:'', step:1 };
  toast('NIP actualizado', { variant:'toast-success', icon:icon('check') });
  if(document.getElementById('authLayer').classList.contains('show')){
    closeModal();
    authGo('users');
  }else{
    openUsersSheet();
  }
}

function closeNipRecovery(){
  nipRecover = { userId:null, code:'', step:1 };
  closeModal();
  if(!document.getElementById('authLayer').classList.contains('show')) openUsersSheet();
}

/* ---------- Arranque de la app con sesión ---------- */
function bootApp(){
  initDB();
  ensureOwnerUser();     // La primera vez: se entra como Dueño, sin NIP.
  syncOwnerName();
  /* Ya no existe el PIN para abrir la app. Si alguien lo tenía activado
     antes, se borra aquí para que no se quede encerrado. */
  const acc = AUTH.getUser();
  if(acc && acc.pin){ acc.pin = null; AUTH.saveUser(acc); }
  applyPrintVars();
  paintChrome();
  render();
  tickClock();
  const u = currentUser();
  if(!AUTH.isLogged()){
    showAuth(u ? 'login' : 'welcome');
    if(u) authState.mode = 'login';
  }else if(multiUser()){
    const me = activeUser();
    if(userSessionOpen() && me){
      /* La sesión de este usuario sigue abierta: aunque se recargue la
         página, Mesa no vuelve a pedir el NIP. Solo se pide otra vez
         cuando le dan a "Cambiar de usuario". */
      if(!currentShift()) openShiftFor(me);
      paintChrome();
      render();
    }else{
      /* Nadie ha entrado todavía: cada quien entra con su NIP. */
      closeOpenShifts();
      authState.pickedUser = null;
      showAuth('users');
    }
  }
}

/* ---------- Encabezado del ticket con los datos del negocio ---------- */
function ticketBusiness(){
  const u = (typeof currentUser === 'function') ? currentUser() : null;
  const p = userPrefs();
  const b = (u && u.business) || {};
  if(p.bizOnTicket && b.name){
    return {
      title: b.name.toUpperCase(),
      sub: (b.type || 'Negocio') + ' · Ticket de venta',
      address: b.address ? escapeHtml(b.address) : ''
    };
  }
  return { title:'MESA', sub:'Restaurante · Ticket de venta', address:'' };
}

/* =========================================================
   UNIDADES DE VENTA
   El precio del producto es "por unidad". Las unidades de peso o
   volumen se piden en fracciones (incremento configurable).
========================================================= */
/* 'pieza' se conserva solo por compatibilidad con los productos ya
   guardados: ya no se muestra como unidad. Un producto "sin unidad"
   se vende por cantidad (1, 2, 3…) y no lleva etiqueta de unidad. */
const SALE_UNITS = [
  { id:'pieza',     label:'Ninguna',   one:'',        many:'',          short:'',       step:1, plain:true },
  { id:'orden',     label:'Orden',     one:'orden',   many:'órdenes',   short:'orden',  step:1 },
  { id:'porcion',   label:'Porción',   one:'porción', many:'porciones', short:'porción',step:1 },
  { id:'paquete',   label:'Paquete',   one:'paquete', many:'paquetes',  short:'paq.',   step:1 },
  { id:'caja',      label:'Caja',      one:'caja',    many:'cajas',     short:'caja',   step:1 },
  { id:'docena',    label:'Docena',    one:'docena',  many:'docenas',   short:'doc.',   step:1 },
  { id:'kilo',      label:'Kilo',      one:'kg',      many:'kg',        short:'kg',     step:0.25, frac:true },
  { id:'gramo',     label:'Gramo',     one:'g',       many:'g',         short:'g',      step:50,   frac:true },
  { id:'litro',     label:'Litro',     one:'L',       many:'L',         short:'L',      step:0.5,  frac:true },
  { id:'mililitro', label:'Mililitro', one:'ml',      many:'ml',        short:'ml',     step:50,   frac:true },
  { id:'metro',     label:'Metro',     one:'m',       many:'m',         short:'m',      step:0.5,  frac:true },
  { id:'centimetro',label:'Centímetro',one:'cm',      many:'cm',        short:'cm',     step:10,   frac:true },
];
function unitOf(id){ return SALE_UNITS.find(u => u.id === id) || SALE_UNITS[0]; }
function productUnit(p){ return unitOf(p && p.unit); }
function hasSizes(p){ return !!(p && p.sizesOn && p.sizes && p.sizes.length); }
function productStep(p){
  if(hasSizes(p)) return 1;
  const u = productUnit(p);
  const s = parseFloat(p && p.unitStep);
  return (u.frac && s > 0) ? s : u.step;
}
function fmtNum(n){ return (Math.round(n * 1000) / 1000).toLocaleString('es-MX', { maximumFractionDigits:3 }); }
function fmtQty(q, unitId){
  const u = unitOf(unitId);
  if(u.plain) return fmtNum(q);
  if(u.frac) return fmtNum(q) + ' ' + u.short;
  return fmtNum(q) + ' ' + (q === 1 ? u.one : u.many);
}
/* "2 ×" para productos sin unidad y tamaños; "1.5 kg" o "3 paquetes" para lo demás */
function lineQtyLabel(it){
  if(it.sizeLabel || !it.unit || unitOf(it.unit).plain) return fmtNum(it.qty) + ' ×';
  return fmtQty(it.qty, it.unit);
}
/* Etiqueta de la tarjeta: "Por kilo", "Por tamaño"… Sin unidad no lleva etiqueta. */
function unitTagText(p){
  if(hasSizes(p)) return 'Por tamaño';
  const u = productUnit(p);
  return u.plain ? '' : 'Por ' + u.label.toLowerCase();
}

/* ---------- Color del Menú Digital ----------
   El negocio elige un color; con él se calculan el tono suave, el tono
   oscuro para textos y si encima va texto claro u oscuro. */
const MD_DEFAULT_COLOR = '#CFAE8B';
const MD_COLORS = [
  { hex:'#CFAE8B', name:'Café' },
  { hex:'#E8A33D', name:'Mostaza' },
  { hex:'#E07A3F', name:'Naranja' },
  { hex:'#D9534F', name:'Rojo' },
  { hex:'#E07A9B', name:'Rosa' },
  { hex:'#8E6CD1', name:'Morado' },
  { hex:'#3B82C4', name:'Azul' },
  { hex:'#2FA59A', name:'Turquesa' },
  { hex:'#4E9F5B', name:'Verde' },
  { hex:'#2B2F3A', name:'Negro' },
];
function mdValidColor(h){ return (typeof h === 'string' && /^#[0-9a-f]{6}$/i.test(h.trim())) ? h.trim().toUpperCase() : null; }
function mdHexRgb(h){ h = mdValidColor(h) || MD_DEFAULT_COLOR; return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mdRgbHex(rgb){ return '#' + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase(); }
function mdMix(rgb, to, t){ return rgb.map((v, i) => v + (to[i] - v) * t); }
function mdLum(rgb){
  const c = rgb.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function mdContrast(a, b){ const la = mdLum(a), lb = mdLum(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }
/* Paleta completa a partir de un solo color */
function mdPalette(hex){
  const rgb = mdHexRgb(hex);
  const ink = [22, 33, 62];
  const soft = mdMix(rgb, [255, 255, 255], 0.86);
  // tono oscuro legible sobre el tono suave
  let dark = rgb.slice(), k = 0;
  while(mdContrast(dark, soft) < 4.5 && k < 20){ dark = mdMix(dark, [0, 0, 0], 0.12); k++; }
  const on = mdContrast(rgb, ink) >= mdContrast(rgb, [255, 255, 255]) ? '#16213E' : '#FFFFFF';
  return { main:mdRgbHex(rgb), soft:mdRgbHex(soft), ink:mdRgbHex(dark), rgb:rgb.join(','), on };
}
function mdColorName(hex){ const c = MD_COLORS.find(x => x.hex === (mdValidColor(hex) || '')); return c ? c.name : 'Personalizado'; }

function mdDefaultCfg(){
  return { active:false, id:null, activatedAt:null, paused:false, whatsapp:{ country:'', number:'' }, color:MD_DEFAULT_COLOR, hours:{ mode:'business', days:null } };
}
function mdCfg(){
  let c = {};
  try{ c = JSON.parse(localStorage.getItem(MD_CFG_KEY) || '{}') || {}; }catch(e){ c = {}; }
  const out = Object.assign(mdDefaultCfg(), c);
  out.whatsapp = Object.assign(mdDefaultCfg().whatsapp, c.whatsapp || {});
  out.hours = mdCleanHours(c.hours);
  return out;
}
function mdSaveCfg(c){
  const limpio = { active:!!c.active, id:c.id || null, activatedAt:c.activatedAt || null, paused:!!c.paused, whatsapp:c.whatsapp || { country:'', number:'' }, color:mdValidColor(c.color) || MD_DEFAULT_COLOR, hours:mdCleanHours(c.hours) };
  try{ localStorage.setItem(MD_CFG_KEY, JSON.stringify(limpio)); }catch(e){}
}
/* ---------- Horario del Menú Digital ----------
   mode 'business' = igual que el horario del negocio (Mi cuenta)
   mode 'custom'   = horario propio del menú
   mode 'always'   = recibe pedidos a cualquier hora
   Fuera de horario, los clientes ven el menú pero no pueden enviar pedidos. */

  { id:'business', emoji:'🏪', label:'Igual que el negocio' },
  { id:'custom',   emoji:'🕒', label:'Horario propio' },
  { id:'always',   emoji:'🌙', label:'Siempre abierto' },
];
function mdCleanHours(h){
  h = h || {};
  const mode = MD_HOURS_MODES.some(m => m.id === h.mode) ? h.mode : 'business';
  return { mode, days: hrsClean(h.days) };
}
function mdMenuHours(cfg){
  const h = (cfg || mdCfg()).hours;
  if(h.mode === 'always') return null;
  if(h.mode === 'custom') return h.days;
  return typeof bizHours === 'function' ? bizHours() : null;
}
function mdClosedNow(cfg){ return !hrsIsOpen(mdMenuHours(cfg)); }
function mdOrdersBlocked(cfg){ cfg = cfg || mdCfg(); return cfg.paused || mdClosedNow(cfg); }
function mdHoursSub(cfg){
  cfg = cfg || mdCfg();
  const days = mdMenuHours(cfg);
  if(cfg.hours.mode === 'always') return 'Siempre abierto · recibe pedidos a cualquier hora';
  if(cfg.hours.mode === 'business' && !days) return 'Igual que el negocio · aún no tiene horario (siempre abierto)';
  return (cfg.hours.mode === 'business' ? 'Igual que el negocio' : 'Horario propio') + ' · ' + hrsStatus(days).txt.toLowerCase();
}

function mdTotals(lines){
  const subtotal = lines.reduce((a, l) => a + l.price * l.qty, 0);
  const iva = subtotal * IVA_RATE;
  return { subtotal:round2(subtotal), iva:round2(iva), total:round2(subtotal + iva) };
}

  const w = mdWhatsapp() || { country:((currentUser() || {}).country) || 'MX', number:'' };
  openModal(`
    <div class="sheet-header">
      <h2>WhatsApp del negocio</h2>
      <button class="sheet-close" onclick="closeModal()">${icon('close')}</button>
    </div>
    <p class="sheet-text" style="margin-bottom:16px;">A este número llegarán los pedidos de tu Menú Digital. Debe tener WhatsApp.</p>
    <div class="field">
      <label for="mdWaCountry">País</label>
      <select id="mdWaCountry">
        ${COUNTRIES.map(c => `<option value="${c.code}" ${c.code === w.country ? 'selected' : ''}>${c.flag} ${c.name} (${c.dial})</option>`).join('')}
      </select>
    </div>
    <div class="field" id="mdWaField">
      <label for="mdWaNumber">Número de WhatsApp</label>
      <input id="mdWaNumber" type="tel" inputmode="numeric" maxlength="16" placeholder="Ej. 981 123 4567" value="${escapeHtml(w.number)}">
    </div>
    <button class="btn primary block" onclick="mdSaveWhatsapp()">Guardar número</button>
  `, { dismissible:true });
}
function mdSaveWhatsapp(){
  clearFieldError('mdWaField');
  const country = document.getElementById('mdWaCountry').value;
  const number = document.getElementById('mdWaNumber').value.replace(/\D/g, '');
  const c = countryOf(country);
  if(number.length !== c.digits){
    setFieldError('mdWaField', 'El número de ' + c.name + ' tiene ' + c.digits + ' dígitos (sin el ' + c.dial + ')');
    return;
  }
  const cfg = mdCfg();
  cfg.whatsapp = { country, number };
  mdSaveCfg(cfg);
  closeModal();
  toast('WhatsApp guardado', { subtitle:c.dial + ' ' + formatPhone(number, country) });
  mdRerenderIfMenu();
}

/* ---------- Link único del negocio ---------- */
function mdSlug(s){
  return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24) || 'menu';
}
function mdNewId(){
  const b = ((typeof currentUser === 'function' ? currentUser() : null) || {}).business || {};
  return mdSlug(b.name) + '-' + Math.random().toString(36).slice(2, 8);
}
function mdShortLink(cfg){
  const l = mdLink(cfg);
  return l.length > 40 ? '…/#menu/' + cfg.id : l;
}
function mdLink(cfg){ return location.href.split('#')[0] + '#menu/' + encodeURIComponent(cfg.id); }

/* ---------- Utilidades compartidas ---------- */
function mdCopy(text, okMsg, toastFn){
  const done = () => (toastFn || toast)(okMsg || 'Copiado');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => mdCopyFallback(text, done));
  }else mdCopyFallback(text, done);
}
function mdCopyFallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove(); done();
}
/* =========================================================
   PRODUCTOS: descripción breve + unidad de venta
   (se agregan al formulario existente sin cambiar lo demás)
========================================================= */
function mdUnitFieldHTML(p){
  const unit = productUnit(p).id;
  const step = p && p.unitStep ? p.unitStep : '';
  return `
    <div class="field" id="pfUnitField">
      <label>Unidad de venta</label>
      <select id="pfUnit" onchange="mdOnUnitChange()">
        ${SALE_UNITS.map(u => `<option value="${u.id}" ${u.id === unit ? 'selected' : ''}>${u.plain ? 'Ninguna · se vende por cantidad' : u.label}</option>`).join('')}
      </select>
      <div id="pfStepWrap" style="display:none; margin-top:12px;">
        <label for="pfUnitStep">Se pide de (cantidad mínima y aumento)</label>
        <input id="pfUnitStep" type="number" min="0" step="any" value="${step}">
      </div>
      <div class="field-hint" id="pfUnitHint" style="color:var(--ink-soft);"></div>
    </div>`;
}
function mdOnUnitChange(){
  const sel = document.getElementById('pfUnit'); if(!sel) return;
  const u = unitOf(sel.value);
  const sizesOn = !!(document.getElementById('pfSizesOn') || {}).checked;
  const field = document.getElementById('pfUnitField');
  if(field) field.style.display = sizesOn ? 'none' : 'block';
  const wrap = document.getElementById('pfStepWrap');
  const stepIn = document.getElementById('pfUnitStep');
  if(wrap) wrap.style.display = u.frac ? 'block' : 'none';
  if(stepIn) stepIn.placeholder = String(u.step);
  const hint = document.getElementById('pfUnitHint');
  if(hint){
    const s = parseFloat(stepIn && stepIn.value) || u.step;
    hint.textContent = u.plain
      ? 'Se vende por cantidad (1, 2, 3…), sin unidad en el ticket ni en el Menú Digital.'
      : u.frac
        ? `El precio es por ${u.label.toLowerCase()}. En el Menú Digital se pide de ${fmtQty(s, u.id)} en ${fmtQty(s, u.id)}.`
        : `El precio es por ${u.one}. En el Menú Digital se pide por ${u.many}.`;
  }
  if(!sizesOn){
    const pl = document.getElementById('pfPriceLabel');
    const cl = document.getElementById('pfCostLabel');
    const por = u.plain ? '' : ' por ' + u.label.toLowerCase();
    if(pl) pl.textContent = 'Precio de venta' + por;
    if(cl) cl.textContent = 'Precio de producción' + por;
  }
  if(typeof updateStockFieldLabels === 'function') updateStockFieldLabels();
}
const _mdOpenProductForm = openProductForm;
openProductForm = function(productId){
  _mdOpenProductForm(productId);
  const nameField = document.getElementById('pfNameField');
  if(!nameField || document.getElementById('pfDesc')) return;
  const p = productId ? findProduct(productId) : null;
  nameField.insertAdjacentHTML('afterend', `
    <div class="field" id="pfDescField">
      <label for="pfDesc">Descripción breve del producto (opcional)</label>
      <textarea id="pfDesc" class="md-textarea" maxlength="160" rows="2" placeholder="Ej. 100 hojas de raya, pasta dura">${escapeHtml((p && p.description) || '')}</textarea>
      <div class="field-hint" style="color:var(--ink-soft);">Se muestra en tu Menú Digital, debajo del nombre.</div>
    </div>`);
  const cat = document.getElementById('pfCategory');
  const catField = cat && cat.closest('.field');
  if(catField) catField.insertAdjacentHTML('afterend', mdUnitFieldHTML(p));
  const stepIn = document.getElementById('pfUnitStep');
  if(stepIn) stepIn.addEventListener('input', mdOnUnitChange);
  mdOnUnitChange();
};
const _mdToggleSizeFields = toggleSizeFields;
toggleSizeFields = function(on){ _mdToggleSizeFields(on); if(!on) mdOnUnitChange(); else { const f = document.getElementById('pfUnitField'); if(f) f.style.display = 'none'; } };
const _mdUpdatePriceFieldLabels = updatePriceFieldLabels;
updatePriceFieldLabels = function(){ _mdUpdatePriceFieldLabels(); const s = document.getElementById('pfSizesOn'); if(s && !s.checked) mdOnUnitChange(); };
const _mdSaveProductForm = saveProductForm;
saveProductForm = function(productId){
  const d = document.getElementById('pfDesc');
  const u = document.getElementById('pfUnit');
  const st = document.getElementById('pfUnitStep');
  const vals = d ? { description:d.value.trim().slice(0, 160), unit:u ? u.value : 'pieza', unitStep:st && st.value ? parseFloat(st.value) : null } : null;
  const before = DB.getProducts().map(p => p.id);
  _mdSaveProductForm(productId);
  if(!vals || document.getElementById('pfName')) return;   // no se guardó (faltan datos)
  const list = DB.getProducts();
  const t = productId ? list.find(p => p.id === productId) : list.find(p => !before.includes(p.id));
  if(!t) return;
  t.description = vals.description;
  t.unit = hasSizes(t) ? 'pieza' : (vals.unit || 'pieza');
  t.unitStep = (unitOf(t.unit).frac && vals.unitStep > 0) ? vals.unitStep : null;
  DB.saveProducts(list);
  render();
};


/* =========================================================================
   MENÚ DIGITAL — VISTA DEL CLIENTE
   Se abre con el link  …#menu/<id>. No entra a Mesa ni pide cuenta.
========================================================================= */
const dm = { id:null, cart:[], sheet:null, pd:null, sig:'' };

function dmRoute(){
  const m = location.hash.match(/^#menu\/([^\/?#]+)/);
  return m ? { id:decodeURIComponent(m[1]) } : null;
}
function dmData(){
  const cfg = mdCfg();
  const u = (typeof currentUser === 'function' ? currentUser() : null) || {};
  const b = u.business || {};
  const cats = DB.getCategories();
  const prods = DB.getProducts().filter(p => p.active);
  return { cfg, u, b, cats, prods, ok:cfg.active && cfg.id === dm.id };
}
function dmFind(id){ return DB.getProducts().find(p => p.id === id); }
function dmPhoto(src, alt){
  if(!src) return icon('plate');
  return `<img src="${escapeHtml(src)}" alt="${escapeHtml(alt || '')}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:ICONS.plate}).firstChild)">`;
}
function dmToast(msg){
  const t = document.getElementById('dmToast');
  if(!t) return;
  t.innerHTML = icon('check') + '<span>' + escapeHtml(msg) + '</span>';
  t.classList.add('show');
  clearTimeout(dmToast._t);
  dmToast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
/* ---------- Carrito del cliente ---------- */
function dmQtyOf(pid){ return dm.cart.filter(l => l.productId === pid).reduce((a, l) => a + l.qty, 0); }
function dmAmountOf(pid){ return dm.cart.filter(l => l.productId === pid).reduce((a, l) => a + l.qty * l.price, 0); }
function dmUnits(){ return dm.cart.length; }
function dmMaxFor(p){ const st = stockInfo(p); return st.control ? st.stock : Infinity; }
/* Lo que el pedido ya ocupa de las existencias (medio kilo = 0.5 kg). */
function dmStockUse(pid){ const p = dmFind(pid); return r3(dm.cart.filter(l => l.productId === pid).reduce((a, l) => a + lineStockUse(p, l), 0)); }
function dmUseOf(p, sizeId, qty){ return lineStockUse(p, { sizeId:sizeId || null, qty:qty }); }
function dmAddLine(p, qty, sizeId, note){
  note = (note || '').trim();
  const size = sizeId ? (p.sizes || []).find(s => s.id === sizeId) : null;
  const ex = dm.cart.find(l => l.productId === p.id && (l.sizeId || null) === (sizeId || null) && l.note === note);
  if(ex) ex.qty = round2(ex.qty + qty);
  else dm.cart.push({ productId:p.id, sizeId:sizeId || null, sizeLabel:size ? size.label : null,
                      unit:size ? 'pieza' : productUnit(p).id, qty:round2(qty), price:size ? size.price : p.price, note });
}
function dmStepCard(pid, dir){
  const p = dmFind(pid); if(!p) return;
  const step = productStep(p);
  if(dir > 0){
    if(dmStockUse(pid) + step > dmMaxFor(p) + 1e-9){ dmToast('Ya no hay más existencias'); return; }
    dmAddLine(p, step, null, '');
    if(navigator.vibrate) try{ navigator.vibrate(25); }catch(e){}
  }else{
    const lines = dm.cart.filter(l => l.productId === pid);
    const l = lines.find(x => !x.note && !x.sizeId) || lines[lines.length - 1];
    if(!l) return;
    const s = l.sizeId ? 1 : productStep(p);
    l.qty = round2(l.qty - s);
    if(l.qty < s - 1e-9) dm.cart.splice(dm.cart.indexOf(l), 1);
  }
  dmRefreshCards();
}
function dmStepLine(i, dir){
  const l = dm.cart[i]; if(!l) return;
  const p = dmFind(l.productId);
  const s = l.sizeId ? 1 : productStep(p);
  if(dir > 0 && p && dmStockUse(p.id) + dmUseOf(p, l.sizeId, s) > dmMaxFor(p) + 1e-9){ dmToast('Ya no hay más existencias'); return; }
  l.qty = round2(l.qty + dir * s);
  if(l.qty < s - 1e-9) dm.cart.splice(i, 1);
  dmRefreshCards();
  if(!dm.cart.length){ dmCloseSheet(); return; }
  dmOpenSheet('cart');
}

/* ---------- Render principal ---------- */
function dmQtyText(p, q){ return hasSizes(p) ? fmtNum(q) : (productUnit(p).frac ? fmtQty(q, productUnit(p).id) : fmtNum(q)); }
function dmCardBar(p, paused){
  const q = dmQtyOf(p.id);
  const out = stockInfo(p).level === 'out';
  if(q > 0 && !hasSizes(p)){
    return `<div class="dm-bar">
      <div class="dm-q">
        <button onclick="dmStepCard('${p.id}',-1)" aria-label="Quitar">−</button>
        <span>${dmQtyText(p, q)}</span>
        <button onclick="dmStepCard('${p.id}',1)" aria-label="Agregar" ${q + productStep(p) > dmMaxFor(p) + 1e-9 ? 'disabled' : ''}>+</button>
      </div>
      <div class="dm-qty-total">${formatMoney(dmAmountOf(p.id))}</div>
    </div>`;
  }
  if(q > 0){
    return `<div class="dm-bar" onclick="dmOpenProduct('${p.id}')" style="cursor:pointer;"><div class="dm-price">${fmtNum(q)} en tu pedido</div><div class="dm-qty-total">${formatMoney(dmAmountOf(p.id))}</div></div>`;
  }
  const price = hasSizes(p)
    ? `<small>Desde</small> ${formatMoney(Math.min.apply(null, p.sizes.map(s => s.price)))}`
    : `${formatMoney(p.price)}${productUnit(p).plain ? '' : '<small> /' + productUnit(p).short + '</small>'}`;
  return `<div class="dm-bar" onclick="dmOpenProduct('${p.id}')" style="cursor:pointer;"><div class="dm-price">${price}</div>${out ? '' : ''}</div>`;
}
function dmApplyColor(hex){
  const pal = mdPalette(hex);
  const r = document.documentElement.style;
  r.setProperty('--dm-main', pal.main);
  r.setProperty('--dm-soft', pal.soft);
  r.setProperty('--dm-ink', pal.ink);
  r.setProperty('--dm-rgb', pal.rgb);
  r.setProperty('--dm-on', pal.on);
  let meta = document.querySelector('meta[name="theme-color"]');
  if(!meta){ meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
  meta.content = pal.main;
}
function dmRender(){
  const root = document.getElementById('dmRoot');
  const d = dmData();
  dmApplyColor(d.cfg.color);
  const nombre = (d.b.name || '').trim() || 'Nuestro menú';
  document.title = nombre + ' · Menú Digital';
  const logoSrc = d.b.logo || d.u.photo;
  const logo = logoSrc
    ? `<img src="${escapeHtml(logoSrc)}" alt="${escapeHtml(nombre)}">`
    : ((d.b.name || '').trim() ? escapeHtml(d.b.name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('')) : icon('forkDark'));
  const top = `
    <header class="dm-top" id="dmTop">
      <div class="dm-brand">
        <span class="dm-mark">${icon('forkDark')}</span>
        <span class="dm-brand-txt"><span class="dm-name">${escapeHtml(nombre)}</span><span class="dm-sub">${typeof bizIsFood === 'function' && !bizIsFood() ? 'Catálogo digital' : 'Menú digital'}</span></span>
      </div>
      <div class="dm-logo">${logo}</div>
    </header>`;

  if(!d.ok){
    root.innerHTML = top + `
      <main class="dm-view"><div class="dm-empty">${icon('menuBook')}
        <h2>Este menú no está disponible</h2>
        <p>El link no es válido o el negocio desactivó su Menú Digital por ahora. Pide al negocio su link actualizado.</p>
      </div></main>`;
    document.getElementById('dmCartbar').classList.remove('show');
    return;
  }

  const cats = d.cats.filter(c => d.prods.some(p => p.category === c.id));
  const sinCat = d.prods.filter(p => !d.cats.some(c => c.id === p.category));
  if(sinCat.length) cats.push(UNCATEGORIZED);

  root.innerHTML = top + `
    <main class="dm-view">
      <h1 class="dm-title">${typeof bizIsFood === 'function' && !bizIsFood() ? 'Nuestros productos' : 'Nuestro menú'}</h1>
      <p class="dm-lead">Elige tus productos y envía tu pedido por WhatsApp.</p>
      ${dmHoursLineHTML(d.cfg)}
      ${d.cfg.paused ? `<div class="dm-banner">${icon('pause')}<span><b>Por ahora no estamos recibiendo pedidos</b>Puedes ver el menú; vuelve a intentarlo más tarde.</span></div>`
        : (mdClosedNow(d.cfg) ? `<div class="dm-banner">${icon('clock')}<span><b>Estamos cerrados en este momento</b>Puedes ver el menú${hrsNextOpen(mdMenuHours(d.cfg)) ? '; recibimos pedidos de nuevo ' + hrsNextOpen(mdMenuHours(d.cfg)) : ''}.</span></div>` : '')}
      ${cats.length ? `
        <nav class="dm-chips" id="dmChips">${cats.map((c, i) => `<button class="dm-chip ${i === 0 ? 'active' : ''}" data-target="dms-${c.id}" onclick="dmGoSection('dms-${c.id}')">${c.emoji} ${escapeHtml(c.name)}</button>`).join('')}</nav>
        ${cats.map(c => {
          const list = d.prods.filter(p => c.id === UNCATEGORIZED.id ? !d.cats.some(x => x.id === p.category) : p.category === c.id);
          return `<section class="dm-sec" id="dms-${c.id}">
            <div class="dm-sec-head"><span class="dm-sec-emoji">${c.emoji}</span><div><h2 class="dm-sec-title">${escapeHtml(c.name)}</h2><div class="dm-sec-count">${list.length} producto${list.length === 1 ? '' : 's'}</div></div></div>
            <div class="dm-grid">${list.map(p => dmCardHTML(p, c, mdOrdersBlocked(d.cfg))).join('')}</div>
          </section>`;
        }).join('')}
      ` : `<div class="dm-empty">${icon('bag')}<h2>Aún no hay productos</h2><p>Pronto verás aquí el menú del negocio.</p></div>`}
    </main>`;
  dmMeasure();
  dmRenderCartbar();
  dmSpy();
}
/* Línea de horario bajo el título: "Abierto ahora · cierra a las 9 pm" (toca para ver la semana) */

  const days = mdMenuHours(cfg);
  if(!days) return '';
  const st = hrsStatus(days);
  const [a, ...b] = st.txt.split(' · ');
  return `<button class="dm-hours" onclick="dmOpenSheet('hours')">${icon('clock')}<span><b class="${st.on ? '' : 'off'}">${a}</b>${b.length ? ' · ' + b.join(' · ') : ''} · Ver horario</span></button>`;
}
function dmHoursSheetHTML(){
  const days = mdMenuHours(mdCfg()) || [];
  const hoy = new Date().getDay();
  return `
    <div class="sheet-header">
      <h2>Horario de pedidos</h2>
      <button class="sheet-close" onclick="dmCloseSheet()" aria-label="Cerrar">${icon('close')}</button>
    </div>

function dmCardHTML(p, c, paused){
  const out = stockInfo(p).level === 'out';
  const q = dmQtyOf(p.id);
  return `
    <div class="dm-card ${q > 0 ? 'in-cart' : ''} ${out ? 'out' : ''}" id="dmc-${p.id}">
      <button class="dm-tap" onclick="dmOpenProduct('${p.id}')">
        <div class="dm-photo">${dmPhoto(p.image, p.name)}${out ? '<span class="dm-flag">Agotado</span>' : ''}</div>
        <div class="dm-inner">
          <div class="dm-cname">${escapeHtml(p.name)}</div>
          ${(p.description || '').trim() ? `<div class="dm-cdesc">${escapeHtml(p.description)}</div>` : ''}
          ${unitTagText(p) ? `<span class="dm-unit">${unitTagText(p)}</span>` : ''}
        </div>
      </button>
      <div class="dm-slot">${dmCardBar(p, paused)}</div>
    </div>`;

function dmRefreshCards(){
  DB.getProducts().forEach(p => {
    const card = document.getElementById('dmc-' + p.id);
    if(!card) return;
    card.classList.toggle('in-cart', dmQtyOf(p.id) > 0);
    card.querySelector('.dm-slot').innerHTML = dmCardBar(p);
  });
  dmRenderCartbar();
}
function dmRenderCartbar(){
  const bar = document.getElementById('dmCartbar');
  if(!bar) return;
  const n = dmUnits();
  bar.classList.toggle('show', n > 0 && !dm.sheet);
  if(!n) return;
  const t = mdTotals(dm.cart);
  bar.innerHTML = `<button class="dm-cartbar-inner" onclick="dmOpenSheet('cart')">
    <span class="dm-cb-left"><span class="dm-cb-ico">${icon('bag')}<span class="dm-cb-count">${n}</span></span><span class="dm-cb-label">Ver pedido</span></span>
    <span class="dm-cb-total">${formatMoney(t.subtotal)}<span class="cartbar-chevron">${icon('chevronRight')}</span></span>
  </button>`;
}

/* Índice de categorías pegado + resaltado al deslizar */
let dmSpyLock = 0;
function dmMeasure(){ const t = document.getElementById('dmTop'); if(t) document.documentElement.style.setProperty('--dm-top-h', t.offsetHeight + 'px'); }
function dmStickyH(){ const t = document.getElementById('dmTop'), c = document.getElementById('dmChips'); return (t ? t.offsetHeight : 0) + (c ? c.offsetHeight : 0); }
function dmGoSection(id){
  const t = document.getElementById(id); if(!t) return;
  dmSpyLock = Date.now() + 700;
  dmSetChip(id);
  window.scrollTo({ top:t.getBoundingClientRect().top + window.pageYOffset - dmStickyH() - 4, behavior:'smooth' });
}
function dmSetChip(id){
  const row = document.getElementById('dmChips'); if(!row) return;
  row.querySelectorAll('.dm-chip').forEach(ch => {
    const on = ch.dataset.target === id;
    if(on && !ch.classList.contains('active')) row.scrollTo({ left:ch.offsetLeft - row.offsetWidth / 2 + ch.offsetWidth / 2, behavior:'smooth' });
    ch.classList.toggle('active', on);
  });
}
function dmSpy(){
  if(Date.now() < dmSpyLock) return;
  const secs = document.querySelectorAll('.dm-sec'); if(!secs.length) return;
  const line = dmStickyH() + 30;
  let cur = secs[0].id;
  secs.forEach(s => { if(s.getBoundingClientRect().top <= line) cur = s.id; });
  if(window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) cur = secs[secs.length - 1].id;
  dmSetChip(cur);
}

/* ---------- Hojas (producto, pedido, confirmar, datos, seguimiento) ---------- */
function dmOpenSheet(kind){
  dm.sheet = kind;
  const layer = document.getElementById('dmLayer');
  let html = '';
  if(kind === 'product') html = dmProductHTML();
  else if(kind === 'cart') html = dmCartHTML();
  else if(kind === 'confirm') html = dmConfirmHTML();
  else if(kind === 'hours') html = dmHoursSheetHTML();
  layer.innerHTML = `<div class="dm-overlay" id="dmOverlay"><div class="dm-sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div>${html}</div></div>`;
  document.getElementById('dmOverlay').addEventListener('click', e => { if(e.target.id === 'dmOverlay') dmCloseSheet(); });
  document.body.classList.add('dm-lock');
  dmRenderCartbar();
}
function dmCloseSheet(){
  dm.sheet = null;
  document.getElementById('dmLayer').innerHTML = '';
  document.body.classList.remove('dm-lock');
  dmRenderCartbar();
}

function dmOpenProduct(pid){
  const p = dmFind(pid); if(!p) return;
  dm.pd = { id:pid, sizeId:hasSizes(p) ? p.sizes[0].id : null, qty:productStep(p), note:'' };
  dmOpenSheet('product');
}
function dmProductHTML(){

/* Arma el mensaje y abre el WhatsApp del negocio. */
function dmWhatsappMessage(){
  const t = mdTotals(dm.cart);
  let msg = 'Hola, quiero hacer el siguiente pedido:\n\n';
  dm.cart.forEach(l => {
    const p = dmFind(l.productId);
    const nombre = (p ? p.name : 'Producto') + (l.sizeLabel ? ' (' + l.sizeLabel + ')' : '');
    const cant = (l.sizeLabel || !l.unit || unitOf(l.unit).plain) ? 'x' + fmtNum(l.qty) : fmtQty(l.qty, l.unit);
    msg += '• ' + nombre + ' ' + cant + ' - ' + formatMoney(l.price * l.qty) + '\n';
    if(l.note) msg += '   📝 Nota: ' + l.note + '\n';
  });
  msg += '\nSubtotal: ' + formatMoney(t.subtotal);
  msg += '\nIVA (16%): ' + formatMoney(t.iva);
  msg += '\n*Total: ' + formatMoney(t.total) + ' MXN*';
  return msg;

function dmSendWhatsApp(){
  const cfg = mdCfg();
  if(!cfg.active || cfg.id !== dm.id || cfg.paused){ dmToast('El negocio no está recibiendo pedidos'); return; }
  if(mdClosedNow(cfg)){ dmToast('Estamos cerrados en este momento'); dmRender(); dmCloseSheet(); return; }
  const tel = mdWhatsappDigits();
  if(!tel){ dmToast('El negocio aún no configura su WhatsApp'); return; }
  if(!dm.cart.length) return;
  const url = 'https://wa.me/' + tel + '?text=' + encodeURIComponent(dmWhatsappMessage());
  if(navigator.vibrate) try{ navigator.vibrate([60, 40, 60]); }catch(e){}
  const win = window.open(url, '_blank');
  if(!win) location.href = url;
  dm.cart = [];
  dmCloseSheet();
  dmRefreshCards();
  dmToast('Pedido listo en WhatsApp');
}

function bootMenu(route){
  document.body.classList.add('dm-mode');
  const sp = document.getElementById('splash'); if(sp) sp.remove();
  dm.id = route.id;
  const root = document.createElement('div'); root.id = 'dmRoot'; root.className = 'dm dmx';
  const bar = document.createElement('div'); bar.id = 'dmCartbar'; bar.className = 'dm-cartbar dmx';
  const layer = document.createElement('div'); layer.id = 'dmLayer'; layer.className = 'dmx';
  const t = document.createElement('div'); t.id = 'dmToast'; t.className = 'dm-toast';
  document.body.append(root, bar, layer, t);
  dmRender();
  dm.sig = dmSig();
  window.addEventListener('scroll', dmSpy, { passive:true });
  window.addEventListener('resize', dmMeasure);
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && dm.sheet) dmCloseSheet(); });
  window.addEventListener('hashchange', () => { const r = dmRoute(); if(r && r.id !== dm.id) location.reload(); });
  const dmClockSig = () => mdOrdersBlocked() + '|' + dmHoursLineHTML(mdCfg());
  let dmLastClock = dmClockSig();
  setInterval(() => {
    const c = dmClockSig();
    if(c !== dmLastClock){
      dmLastClock = c;
      const y = window.scrollY; dmRender(); window.scrollTo(0, y);
      if(dm.sheet === 'cart') dmOpenSheet('cart');
    }
  }, 30000);
  mdOnSync(() => {
    const s = dmSig();
    if(s !== dm.sig){
      dm.sig = s;
      const y = window.scrollY;
      dmRender(); window.scrollTo(0, y);
      if(dm.sheet === 'cart') dmOpenSheet(dm.sheet);
    }
  });
}

         (localStorage.getItem('mesa_categories') || '') + '|' + JSON.stringify(((currentUser() || {}).business) || {});
}

/* =========================================================
   4. PEDIDOS ENTRANTES DEL MENÚ DIGITAL
   -------------------------------------------------------------
   Cada pedido que el cliente manda desde el Menú Digital lleva un
   folio (MD-XXXX) y un link "Abrir en caja". El pedido llega a
   "Pedidos entrantes" de tres formas:
     1) En este mismo dispositivo: aparece solo, al instante.
     2) Tocando el link del mensaje de WhatsApp: se abre la caja y
        el pedido queda registrado.
     3) Pegando el mensaje de WhatsApp en "Pegar pedido".
   Se guarda el pedido ORIGINAL (lo que mandó el menú) y el pedido
   ACTUAL (con los cambios que haga el negocio).
========================================================= */
const MDI_KEY = 'mesa_md_incoming';
const MDI_CODE_ABC = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const MDI_STATUS = {
  nuevo:      { label:'Nuevo',      cls:'nuevo' },
  confirmado: { label:'Confirmado', cls:'ok' },
  rechazado:  { label:'Rechazado',  cls:'no' },
};
const MDI_REJECT_REASONS = ['Se acabó un producto', 'Estamos cerrados', 'No llegamos a esa zona', 'Pedido duplicado', 'Otro motivo'];

const MDI = {
  all(){ try{ const l = JSON.parse(localStorage.getItem(MDI_KEY) || '[]'); return Array.isArray(l) ? l : []; }catch(e){ return []; } },
  save(list){ try{ localStorage.setItem(MDI_KEY, JSON.stringify(list.slice(-400))); }catch(e){ toast('No se pudo guardar el pedido', { variant:'toast-danger', icon:icon('alert') }); } },
  get(id){ return MDI.all().find(o => o.id === id) || null; },
  update(id, fn){
    const list = MDI.all();
    const o = list.find(x => x.id === id);
    if(!o) return null;
    fn(o);
    MDI.save(list);
    return o;
  }
};

/* ---------- Utilidades ---------- */
function mdiStr(v, max){ return String(v == null ? '' : v).replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, max || 120); }
function mdiNum(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function mdiNorm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function mdiCleanLine(l){
  return {
    productId: l.productId ? mdiStr(l.productId, 60) : null,
    name: mdiStr(l.name, 120) || 'Producto',
    sizeId: l.sizeId ? mdiStr(l.sizeId, 60) : null,
    sizeLabel: l.sizeLabel ? mdiStr(l.sizeLabel, 60) : null,
    unit: SALE_UNITS.some(u => u.id === l.unit) ? l.unit : 'pieza',
    qty: Math.max(0, r3(mdiNum(l.qty))),
    price: Math.max(0, round2(mdiNum(l.price))),
    note: mdiStr(l.note, 160)
  };
}
function mdiLinesEqual(a, b){
  const k = l => [l.productId || mdiNorm(l.name), l.sizeId || '', r3(l.qty), round2(l.price), (l.note || '').trim()].join('|');
  if(a.length !== b.length) return false;
  const sa = a.map(k).sort(), sb = b.map(k).sort();
  return sa.every((x, i) => x === sb[i]);
}
function mdiIsModified(o){ return !mdiLinesEqual(o.lines || [], o.original || []); }
function mdiNewCode(){ let c = 'MD-'; for(let i = 0; i < 4; i++) c += MDI_CODE_ABC[Math.floor(Math.random() * MDI_CODE_ABC.length)]; return c; }
function mdiAgo(iso){
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if(m < 1) return 'justo ahora';
  if(m < 60) return 'hace ' + m + ' min';
  const h = Math.round(m / 60);
  if(h < 24) return 'hace ' + h + ' h';
  return formatDateTime(iso);
}
function mdiLineLabel(l){ return l.name + (l.sizeLabel ? ' (' + l.sizeLabel + ')' : ''); }
function mdiQtyText(l){ return (l.sizeLabel || unitOf(l.unit).plain) ? 'x' + fmtNum(l.qty) : fmtQty(l.qty, l.unit); }
function mdiLineStep(l){ if(l.sizeId) return 1; const p = findProduct(l.productId); return p ? productStep(p) : 1; }

/* ---------- Crear el pedido (lo usa el Menú Digital del cliente) ---------- */
function mdiBuildFromCart(cartLines, customerName){
  const lines = cartLines.map(l => {
    const p = findProduct(l.productId);
    return mdiCleanLine({ productId:l.productId, name:p ? p.name : 'Producto', sizeId:l.sizeId, sizeLabel:l.sizeLabel, unit:l.unit, qty:l.qty, price:l.price, note:l.note });
  });
  const now = new Date().toISOString();
  return {
    id: 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    code: mdiNewCode(),
    createdAt: now,
    receivedAt: now,
    customer: { name: mdiStr(customerName, 60) },
    original: lines,
    lines: lines.map(l => Object.assign({}, l)),
    status: 'nuevo',
    source: 'menu',
    service: 'llevar',
    payment: 'efectivo'
  };
}
/* Mismo formato que siempre ha tenido el mensaje del Menú Digital. */
function mdiMessage(o, withLink){
  const lines = o.original || o.lines || [];
  const t = mdTotals(lines);
  let msg = 'Hola, quiero hacer el siguiente pedido:\n';
  msg += '🧾 Pedido ' + o.code + '\n';
  if(o.customer && o.customer.name) msg += '👤 Nombre: ' + o.customer.name + '\n';
  msg += '\n';
  lines.forEach(l => {
    msg += '• ' + mdiLineLabel(l) + ' ' + mdiQtyText(l) + ' - ' + formatMoney(l.price * l.qty) + '\n';
    if(l.note) msg += '   📝 Nota: ' + l.note + '\n';
  });
  msg += '\nSubtotal: ' + formatMoney(t.subtotal);
  msg += '\nIVA (16%): ' + formatMoney(t.iva);
  msg += '\n*Total: ' + formatMoney(t.total) + ' MXN*';
  if(withLink) msg += '\n\n🔗 Para el negocio (registrar en caja):\n' + mdiLink(o);
  return msg;
}

/* ---------- Link "Abrir en caja": el pedido va dentro del link ---------- */
function mdiEncode(o){
  const c = { v:1, i:o.id, c:o.code, t:Date.parse(o.createdAt) || Date.now(), n:(o.customer && o.customer.name) || '',
              l:(o.original || []).map(l => [l.productId || '', l.sizeId || '', l.qty, l.price, l.note || '', l.name, l.sizeLabel || '', l.unit || '']) };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(c))));
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function mdiDecode(s){
  s = String(s || '').replace(/-/g, '+').replace(/_/g, '/');
  while(s.length % 4) s += '=';
  const c = JSON.parse(decodeURIComponent(escape(atob(s))));
  if(!c || c.v !== 1 || !Array.isArray(c.l) || !c.l.length || c.l.length > 150) throw new Error('Pedido no válido');
  const lines = c.l.map(a => mdiCleanLine({ productId:a[0], sizeId:a[1], qty:a[2], price:a[3], note:a[4], name:a[5], sizeLabel:a[6], unit:a[7] })).filter(l => l.qty > 0);
  if(!lines.length) throw new Error('Pedido vacío');
  const code = /^MD-[A-Z0-9]{4,6}$/.test(c.c) ? c.c : mdiNewCode();
  const created = new Date(mdiNum(c.t) || Date.now());
  return {
    id: /^o[a-z0-9]{6,24}$/.test(c.i) ? c.i : 'o' + Date.now().toString(36),
    code, createdAt: isNaN(created) ? new Date().toISOString() : created.toISOString(),
    customer: { name: mdiStr(c.n, 60) }, original: lines, lines: lines.map(l => Object.assign({}, l)),
    status:'nuevo', service:'llevar', payment:'efectivo'
  };
}
function mdiLink(o){ return location.href.split('#')[0] + '#pedido/' + mdiEncode(o); }

/* Guarda un pedido que llega. Si ya existía (mismo id o folio) no se duplica. */
function mdiReceive(o, source){
  const list = MDI.all();
  const ex = list.find(x => x.id === o.id || (x.code === o.code && Math.abs(Date.parse(x.createdAt) - Date.parse(o.createdAt)) < 60000));
  if(ex) return { order: ex, isNew:false };
  o.source = source || o.source || 'menu';
  o.receivedAt = new Date().toISOString();
  list.push(o);
  MDI.save(list);
  return { order:o, isNew:true };
}

/* ---------- Leer el mensaje de WhatsApp (para comparar o registrar) ---------- */
function mdiParseMessage(text){
  const out = { code:null, name:null, lines:[], total:null, payload:null };
  if(!text) return out;
  const pm = text.match(/#pedido\/([A-Za-z0-9_-]{16,})/); if(pm) out.payload = pm[1];
  const cm = text.match(/\b(MD-[A-Z0-9]{4,6})\b/i); if(cm) out.code = cm[1].toUpperCase();
  const nm = text.match(/Nombre:\s*([^\n]+)/i); if(nm) out.name = mdiStr(nm[1].replace(/\*/g, ''), 60);
  const tm = text.match(/(?:^|\n)[^\S\n]*\*?\s*Total:\s*\$\s*([\d,]+(?:\.\d+)?)/i); if(tm) out.total = parseFloat(tm[1].replace(/,/g, ''));
  let last = null;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/\*/g, '').trim();
    const note = line.match(/^(?:📝\s*)?Nota:\s*(.*)$/i);
    if(note && last){ last.note = mdiStr(note[1], 160); return; }
    const m = line.match(/^[•·\-–]\s*(.+?)\s+-\s+\$\s*([\d,]+(?:\.\d+)?)\s*$/);
    if(!m) return;
    let left = m[1].trim();
    const amount = parseFloat(m[2].replace(/,/g, ''));
    let qty = 1, unitWord = '';
    let q = left.match(/\s+[x×]\s*(\d+(?:[.,]\d+)?)$/i);
    if(q){ qty = parseFloat(q[1].replace(',', '.')); left = left.slice(0, q.index).trim(); }
    else{
      q = left.match(/\s+(\d+(?:[.,]\d+)?)\s*([a-záéíóúñ.]+)$/i);
      if(q){ qty = parseFloat(q[1].replace(',', '.')); unitWord = q[2]; left = left.slice(0, q.index).trim(); }
    }
    const full = left;
    let size = '';
    const sm = left.match(/\s*\(([^()]+)\)$/);
    if(sm){ size = sm[1].trim(); left = left.slice(0, sm.index).trim(); }
    last = { name:mdiStr(left, 120), full:mdiStr(full, 160), sizeLabel:size, qty:isFinite(qty) && qty > 0 ? qty : 1, amount:isFinite(amount) ? amount : 0, unitWord, note:'' };
    out.lines.push(last);
  });
  return out;
}
/* Busca en el catálogo el producto que dice el mensaje. */
function mdiMatchProduct(name, sizeLabel){
  const n = mdiNorm(name);
  if(!n) return null;
  const prods = DB.getProducts();
  let p = prods.find(x => mdiNorm(x.name) === n);
  if(!p && n.length >= 4) p = prods.find(x => { const k = mdiNorm(x.name); return k.startsWith(n) || n.startsWith(k); });
  if(!p) return null;
  let size = null;
  if(hasSizes(p)){
    size = p.sizes.find(s => mdiNorm(s.label) === mdiNorm(sizeLabel)) || null;
    if(!size) return { p, size:null, needsSize:true };
  }
  return { p, size };
}
/* El nombre puede terminar en paréntesis sin ser tamaño, ej. "Tela (algodón)". */
function mdiMatchParsed(pl){
  if(pl.full && pl.sizeLabel){
    const whole = mdiMatchProduct(pl.full, '');
    if(whole && whole.p && !hasSizes(whole.p) && mdiNorm(whole.p.name) === mdiNorm(pl.full)) return whole;
  }
  return mdiMatchProduct(pl.name, pl.sizeLabel);
}
function mdiLinesFromParsed(parsed){
  return parsed.lines.map(pl => {
    const m = mdiMatchParsed(pl);
    if(m && m.p && !m.needsSize){
      return mdiCleanLine({ productId:m.p.id, name:m.p.name, sizeId:m.size ? m.size.id : null, sizeLabel:m.size ? m.size.label : null,
        unit:m.size ? 'pieza' : (m.p.unit || 'pieza'), qty:pl.qty, price:m.size ? m.size.price : m.p.price, note:pl.note });
    }
    return mdiCleanLine({ productId:null, name:pl.name, sizeLabel:pl.sizeLabel || null, qty:pl.qty, price:pl.qty ? pl.amount / pl.qty : pl.amount, note:pl.note });
  });
}
/* Compara lo que dice el WhatsApp contra lo que registró el menú. */
function mdiCompare(o, parsed){
  const diffs = [];
  const base = (o.original || []).map(l => ({ key: mdiNorm(l.name) + '|' + mdiNorm(l.sizeLabel), l }));
  const used = new Set();
  if(parsed.code && parsed.code !== o.code) diffs.push({ t:'code', txt:`El folio del mensaje es <b>${escapeHtml(parsed.code)}</b> y este pedido es <b>${escapeHtml(o.code)}</b>. Puede ser otro pedido.` });
  parsed.lines.forEach(pl => {
    const keys = [mdiNorm(pl.name) + '|' + mdiNorm(pl.sizeLabel)];
    if(pl.full) keys.push(mdiNorm(pl.full) + '|');
    const i = base.findIndex((b, j) => !used.has(j) && keys.includes(b.key));
    const nombre = `<b>${escapeHtml(pl.full || (pl.name + (pl.sizeLabel ? ' (' + pl.sizeLabel + ')' : '')))}</b>`;
    if(i < 0){ diffs.push({ t:'extra', txt:`En WhatsApp viene ${nombre} ×${fmtNum(pl.qty)} y no estaba en el pedido del menú.` }); return; }
    used.add(i);
    const l = base[i].l;
    if(Math.abs(l.qty - pl.qty) > 1e-9) diffs.push({ t:'qty', txt:`${nombre}: en WhatsApp dice <b>${fmtNum(pl.qty)}</b>, el menú registró <b>${fmtNum(l.qty)}</b>.` });
    else if(Math.abs(round2(l.price * l.qty) - pl.amount) > 0.01) diffs.push({ t:'price', txt:`${nombre}: en WhatsApp el importe es <b>${formatMoney(pl.amount)}</b>, el menú registró <b>${formatMoney(l.price * l.qty)}</b>.` });
    if((pl.note || '').trim() !== (l.note || '').trim()) diffs.push({ t:'note', txt:`${nombre}: la nota ${pl.note ? 'dice “' + escapeHtml(pl.note) + '”' : 'no viene'} en WhatsApp${l.note ? ' (el menú: “' + escapeHtml(l.note) + '”)' : ''}.` });
  });
  base.forEach((b, j) => { if(!used.has(j)) diffs.push({ t:'missing', txt:`<b>${escapeHtml(mdiLineLabel(b.l))}</b> está en el pedido del menú pero no en el WhatsApp.` }); });
  if(parsed.total != null){
    const t = mdTotals(o.original || []).total;
    if(Math.abs(t - parsed.total) > 0.01) diffs.push({ t:'total', txt:`El total en WhatsApp es <b>${formatMoney(parsed.total)}</b> y en el pedido del menú <b>${formatMoney(t)}</b>.` });
  }
  return diffs;
}

/* ---------- Contadores y aviso en el menú ---------- */
function mdiCounts(){
  const all = MDI.all();
  return { nuevo: all.filter(o => o.status === 'nuevo').length, confirmado: all.filter(o => o.status === 'confirmado').length, rechazado: all.filter(o => o.status === 'rechazado').length, total: all.length };
}
function mdiPaintBadge(){
  const btn = document.querySelector('.navbtn[data-view="menu"]');
  if(!btn) return;
  const n = mdiCounts().nuevo;
  let b = btn.querySelector('.nav-badge');
  if(!n){ if(b) b.remove(); return; }
  if(!b){ b = document.createElement('b'); b.className = 'nav-badge'; btn.insertBefore(b, btn.firstChild); }
  b.textContent = n > 9 ? '9+' : String(n);
}

function mdiCompareHTML(o){
  const r = mdiUI.result;

      </details>
      ${mdiUI.compare ? `

      ${r ? (r.diffs.length ? `
        <div class="mdi-result warn">
          <b>${icon('alert')} Hay ${r.diffs.length} diferencia${r.diffs.length === 1 ? '' : 's'}</b>
          <ul>${r.diffs.map(d => `<li>${d.txt}</li>`).join('')}</ul>

            <button class="btn ghost" onclick="mdiUI.result=null; mdiOpen('${o.id}', true);">Dejarlo como está</button>
            <button class="btn dark" onclick="mdiApplyWhatsapp('${o.id}')">Usar lo del WhatsApp</button>
          </div>` : ''}
        </div>` : `
